<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Game Hub</title>
  <style>
    :root{
      --bg0:#070b14; --bg1:#0b1122; --bg2:#111b36;
      --card:rgba(255,255,255,.06); --card2:rgba(255,255,255,.035);
      --line:rgba(255,255,255,.12); --line2:rgba(255,255,255,.18);
      --txt:#eef3ff; --muted:#aeb9e8; --accent:#7d9bff; --accent2:#7ce6b4;
      --warn:#ffd166; --danger:#ff7a93; --shadow:0 26px 70px rgba(0,0,0,.38);
      --shadow2:0 12px 35px rgba(0,0,0,.24); --r:24px; --r2:16px; --cell:44px;
      color-scheme: dark;
    }
    *{box-sizing:border-box} html,body{height:100%}
    body{
      margin:0; color:var(--txt); font-family:Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      background:
        radial-gradient(circle at 8% 8%, rgba(125,155,255,.22), transparent 28%),
        radial-gradient(circle at 92% 4%, rgba(124,230,180,.16), transparent 24%),
        radial-gradient(circle at 50% 110%, rgba(255,209,102,.09), transparent 26%),
        linear-gradient(180deg, var(--bg0), var(--bg1) 48%, var(--bg0));
      overflow-x:hidden;
    }
    body::before{
      content:""; position:fixed; inset:-30%;
      background:linear-gradient(115deg, transparent 0 48%, rgba(255,255,255,.025) 50%, transparent 52%), linear-gradient(25deg, transparent 0 45%, rgba(255,255,255,.02) 50%, transparent 55%);
      transform:rotate(-8deg); animation: drift 20s linear infinite; pointer-events:none; opacity:.55;
    }
    @keyframes drift{from{transform:translateX(-4%) rotate(-8deg)}to{transform:translateX(4%) rotate(-8deg)}}
    .app{position:relative; z-index:1; max-width:1460px; margin:0 auto; padding:18px}
    .top{display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px; margin-bottom:18px}
    .brand{display:flex; align-items:center; gap:14px}
    .mark{width:52px; height:52px; border-radius:16px; display:grid; place-items:center; font-weight:900; color:#06111b; background:linear-gradient(135deg, rgba(125,155,255,1), rgba(124,230,180,1)); box-shadow:var(--shadow2)}
    .brand h1{margin:0; font-size:1.2rem} .brand p{margin:3px 0 0; color:var(--muted); font-size:.92rem}
    .top-actions{display:flex; gap:10px; align-items:center; flex-wrap:wrap}
    .pill,.btn,.tab,.field,.select,.badge{border-radius:14px; border:1px solid var(--line); background:rgba(255,255,255,.06); color:var(--txt)}
    .pill{padding:10px 14px; color:#dfe7ff; background:rgba(255,255,255,.04)}
    .btn,.tab{padding:11px 14px; cursor:pointer; transition:transform .15s ease, border-color .15s ease, background .15s ease, box-shadow .15s ease; box-shadow:none}
    .btn:hover,.tab:hover{transform:translateY(-1px); border-color:var(--line2)}
    .btn.primary{background:linear-gradient(135deg, rgba(125,155,255,.95), rgba(117,135,255,.9)); border-color:rgba(125,155,255,.45); box-shadow:0 12px 30px rgba(125,155,255,.15); font-weight:700}
    .btn.good{background:linear-gradient(135deg, rgba(124,230,180,.16), rgba(124,230,180,.07)); border-color:rgba(124,230,180,.28)}
    .btn.warn{background:linear-gradient(135deg, rgba(255,209,102,.12), rgba(255,209,102,.06)); border-color:rgba(255,209,102,.25)}
    .btn.danger{background:linear-gradient(135deg, rgba(255,122,147,.12), rgba(255,122,147,.06)); border-color:rgba(255,122,147,.25)}
    .field,.select{padding:11px 12px; min-width:0; outline:none}
    .field:focus,.select:focus{border-color:rgba(125,155,255,.5); box-shadow:0 0 0 3px rgba(125,155,255,.14)}
    .hero{border:1px solid var(--line); border-radius:28px; box-shadow:var(--shadow); overflow:hidden; background:radial-gradient(circle at 8% 10%, rgba(125,155,255,.16), transparent 22%), radial-gradient(circle at 80% 0%, rgba(124,230,180,.16), transparent 24%), linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.03))}
    .hero-inner{padding:24px}
    .hero h2{margin:0 0 10px; font-size:clamp(1.8rem, 3vw, 3.35rem); line-height:1.02}
    .hero p{margin:0; color:var(--muted); max-width:75ch; line-height:1.55}
    .hero-grid{display:grid; grid-template-columns:1.15fr .85fr; gap:18px; margin-top:18px}
    .panel{border:1px solid var(--line); border-radius:var(--r); background:linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.03)); box-shadow:var(--shadow2); overflow:hidden}
    .panel-h{padding:16px 16px 0; display:flex; justify-content:space-between; align-items:flex-end; gap:12px; flex-wrap:wrap}
    .panel-b{padding:16px}
    .kicker{display:inline-flex; gap:8px; align-items:center; padding:8px 11px; border-radius:999px; margin-bottom:12px; background:rgba(125,155,255,.12); border:1px solid rgba(125,155,255,.25); color:#dfe7ff; font-size:.84rem}
    .section-title{margin:0 0 12px; font-size:.95rem; letter-spacing:.12em; text-transform:uppercase; color:#d9e1ff}
    .grid{display:grid; gap:14px}
    .cards{grid-template-columns:repeat(2, minmax(0, 1fr))}
    .card{position:relative; overflow:hidden; padding:16px; min-height:158px; border-radius:22px; border:1px solid var(--line); background:linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.03)); transition:transform .16s ease, border-color .16s ease, background .16s ease}
    .card:hover{transform:translateY(-2px); border-color:rgba(125,155,255,.28)}
    .card h3{margin:10px 0 8px; font-size:1.06rem}
    .card p{margin:0; color:var(--muted); line-height:1.5; font-size:.95rem}
    .card .row{margin-top:14px; display:flex; gap:8px; flex-wrap:wrap}
    .badge{display:inline-flex; align-items:center; gap:6px; padding:7px 10px; font-size:.8rem}
    .badge.solo{background:rgba(255,209,102,.12); border-color:rgba(255,209,102,.24)}
    .badge.multi{background:rgba(124,230,180,.12); border-color:rgba(124,230,180,.22)}
    .layout{display:grid; grid-template-columns:1fr 330px; gap:18px; margin-top:18px}
    .main,.side{border:1px solid var(--line); border-radius:24px; background:linear-gradient(180deg, rgba(255,255,255,.055), rgba(255,255,255,.03)); box-shadow:var(--shadow2); overflow:hidden}
    .main{min-height:720px}
    .head{display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; padding:16px 18px; border-bottom:1px solid var(--line); background:linear-gradient(180deg, rgba(255,255,255,.04), transparent)}
    .head h2{margin:0; font-size:1.2rem} .head .sub{margin-top:4px; color:var(--muted); font-size:.92rem}
    .body{padding:18px}
    .toolbar{display:flex; gap:10px; flex-wrap:wrap; align-items:center}
    .stack{display:flex; flex-direction:column; gap:10px}
    .notice{padding:12px 14px; border-radius:16px; border:1px solid rgba(255,209,102,.24); background:rgba(255,209,102,.08); color:#ffe8b0; line-height:1.45}
    .soft{padding:12px 14px; border-radius:16px; border:1px solid var(--line); background:rgba(255,255,255,.04); color:var(--muted); line-height:1.5}
    .hr{height:1px; background:var(--line); margin:12px 0}
    .muted{color:var(--muted)} .small{font-size:.92rem}
    .game-board-wrap{display:flex; flex-direction:column; gap:14px}
    .board{display:grid; gap:0; width:fit-content; user-select:none}
    .cell{border:1px solid rgba(255,255,255,.08); background:rgba(255,255,255,.04); color:var(--txt); display:grid; place-items:center; padding:0; transition:transform .12s ease, background .12s ease, border-color .12s ease}
    .cell:hover{transform:translateY(-1px); border-color:rgba(125,155,255,.3)}
    .cell.dark{background:rgba(255,255,255,.08)} .cell.light{background:rgba(255,255,255,.03)}
    .cell.selected{outline:2px solid rgba(125,155,255,.95); outline-offset:-2px} .cell.target{background:rgba(124,230,180,.14)} .cell.hint{background:rgba(255,209,102,.12)}
    .cell.block{background:rgba(255,255,255,.08)}
    .cell.input{font-size:1rem}
    .cell.input input{width:100%; height:100%; border:0; background:transparent; color:var(--txt); text-align:center; font-weight:800; font-size:1rem; text-transform:uppercase}
    .cell.input input:focus{outline:none}
    .sudoku-grid{grid-template-columns:repeat(9, var(--cell))}
    .word-grid{display:grid; grid-template-rows:repeat(6, 1fr); gap:8px}
    .guess-row{display:grid; grid-template-columns:repeat(5, 54px); gap:8px}
    .letter{width:54px; height:54px; border-radius:14px; border:1px solid var(--line); background:rgba(255,255,255,.04); display:grid; place-items:center; font-size:1.15rem; font-weight:900}
    .letter.green{background:rgba(124,230,180,.18); border-color:rgba(124,230,180,.4)}
    .letter.gold{background:rgba(255,209,102,.16); border-color:rgba(255,209,102,.4)}
    .letter.gray{background:rgba(255,255,255,.07); color:#d5dbef}
    .mini-kbd{display:grid; grid-template-columns:repeat(10, minmax(0, 1fr)); gap:6px; max-width:720px}
    .mini-kbd button{min-height:40px; padding:0; font-size:.9rem}
    .crossword{display:grid; gap:6px; width:fit-content; padding:4px 0 10px}
    .crossword .cell{width:42px; height:42px; border-radius:11px}
    .crossword .cell input{font-size:1rem}
    .clues{display:grid; grid-template-columns:1fr 1fr; gap:12px}
    .clue{border:1px solid var(--line); border-radius:18px; padding:12px; background:rgba(255,255,255,.04)}
    .clue h4{margin:0 0 8px} .clue ol{margin:0; padding-left:20px; color:var(--muted); line-height:1.5}
    .tic{display:grid; grid-template-columns:repeat(3, 94px); gap:10px}
    .tic .cell{width:94px; height:94px; border-radius:18px; font-size:2rem; font-weight:900}
    .connect{display:grid; grid-template-columns:repeat(7, 62px); gap:8px; background:rgba(15,22,44,.7); border:1px solid var(--line); padding:10px; border-radius:18px; width:fit-content}
    .connect .slot{width:62px; height:62px; border-radius:999px; border:1px solid rgba(255,255,255,.08); background:rgba(255,255,255,.05); display:grid; place-items:center; overflow:hidden}
    .chip{width:46px; height:46px; border-radius:999px; box-shadow: inset 0 2px 5px rgba(255,255,255,.18), inset 0 -8px 14px rgba(0,0,0,.35); border:1px solid rgba(255,255,255,.2); transform:scale(.98); animation: chipPop .16s ease}
    @keyframes chipPop{from{transform:scale(.55); opacity:.2}to{transform:scale(.98); opacity:1}}
    .chip.red{background:radial-gradient(circle at 30% 30%, #ff8ea2, #ff365f 65%, #bf1439)}
    .chip.yellow{background:radial-gradient(circle at 30% 30%, #fff3aa, #ffd23b 65%, #bc8e00)}
    .checkers,.chess,.battle{display:grid; width:fit-content; border:1px solid var(--line); border-radius:18px; overflow:hidden}
    .checkers .cell,.chess .cell,.battle .cell{width:56px; height:56px; border-radius:0}
    .piece{display:grid; place-items:center; width:100%; height:100%; font-size:1.75rem; line-height:1}
    .piece.red{color:#ff7a93} .piece.black{color:#e8eeff} .piece.w{color:#eef2ff} .piece.b{color:#ff7a93}
    .side{padding:16px; display:flex; flex-direction:column; gap:10px}
    .side .cardish{border:1px solid var(--line); border-radius:18px; padding:12px; background:rgba(255,255,255,.04)}
    .room-link{width:100%; padding:11px 12px; border-radius:14px; border:1px solid var(--line); background:rgba(255,255,255,.05); color:var(--txt)}
    .room-status{display:flex; gap:8px; flex-wrap:wrap; align-items:center}
    .seat{display:inline-flex; align-items:center; gap:6px; padding:7px 10px; border-radius:999px; background:rgba(125,155,255,.12); border:1px solid rgba(125,155,255,.25)}
    .seat.good{background:rgba(124,230,180,.12); border-color:rgba(124,230,180,.25)}
    .seat.warn{background:rgba(255,209,102,.12); border-color:rgba(255,209,102,.25)}
    .seat.bad{background:rgba(255,122,147,.12); border-color:rgba(255,122,147,.25)}
    .overlay{position:absolute; inset:0; display:grid; place-items:center; background:linear-gradient(180deg, rgba(7,11,20,.42), rgba(7,11,20,.78)); backdrop-filter:blur(4px); z-index:5; border-radius:24px}
    .overlay .box{min-width:min(92%, 420px); max-width:92%; border-radius:22px; background:rgba(15,22,44,.94); border:1px solid rgba(255,255,255,.12); padding:18px; box-shadow:var(--shadow); animation: popIn .22s ease}
    @keyframes popIn{from{opacity:0; transform:translateY(8px) scale(.98)}to{opacity:1; transform:translateY(0) scale(1)}}
    .result-badges{display:flex; flex-wrap:wrap; gap:8px; margin-top:10px}
    .result-badge{display:inline-flex; align-items:center; gap:6px; padding:7px 10px; border-radius:999px; border:1px solid var(--line); background:rgba(255,255,255,.05)}
    .result-badge.win{background:rgba(124,230,180,.12); border-color:rgba(124,230,180,.25)}
    .result-badge.loss{background:rgba(255,122,147,.12); border-color:rgba(255,122,147,.25)}
    .result-badge.draw{background:rgba(255,209,102,.12); border-color:rgba(255,209,102,.25)}
    .fade{animation:fadeIn .22s ease}
    @keyframes fadeIn{from{opacity:0; transform:translateY(6px)}to{opacity:1; transform:translateY(0)}}
    .pulse{animation:pulse 2.5s ease-in-out infinite}
    @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(125,155,255,.1)}50%{box-shadow:0 0 0 10px rgba(125,155,255,0)}}
    .home-grid{display:grid; grid-template-columns:1.08fr .92fr; gap:18px}
    @media (max-width:1100px){.layout,.home-grid{grid-template-columns:1fr}.main{min-height:auto}}
    @media (max-width:720px){
      :root{--cell:36px}
      .cards,.clues{grid-template-columns:1fr}
      .guess-row{grid-template-columns:repeat(5, 48px)} .letter{width:48px; height:48px}
      .tic{grid-template-columns:repeat(3, 78px)} .tic .cell{width:78px; height:78px}
      .connect{grid-template-columns:repeat(7, 48px)} .connect .slot{width:48px; height:48px}
      .checkers .cell,.chess .cell,.battle .cell{width:42px; height:42px}
      .chip{width:34px; height:34px}
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="top">
      <div class="brand">
        <div class="mark">AH</div>
        <div><h1>Game Hub</h1><p>GitHub Pages front end with free shared rooms and turn enforcement</p></div>
      </div>
      <div class="top-actions">
        <span id="status" class="pill">Ready</span>
        <button id="homeBtn" class="btn" style="display:none">Home</button>
      </div>
    </div>
    <div id="app"></div>
  </div>
<script>
const CONFIG = { backendUrl: "https://script.google.com/macros/s/AKfycby2U1FkwT81mcVy4w2XFDqlnOdylL8PfDDJUrkj9UjeMnOgxf41MMb9pWrz4e3innYp/exec"" };
const SOLO_WORDS = { easy:['PLANE','TRAIN','APPLE','STONE','GRASS','BREAD','SHORE','SMILE','CLOUD','WATER'], medium:['CIPHER','PLANET','POCKET','MOTION','RIDDLE','ORANGE','MARKET','SPRING','VELVET','SHADOW'], hard:['QUARTZ','JUNGLE','MURKY','EXHALE','VYING','OBJECT','WIZARD','TROPHY','PYTHON','TANGLE'] };
const CROSSWORDS = [{ name:'City & Nature', grid:[['C','L','O','U','D'],['A',null,'R',null,'R'],['N','E','S','T',null],['D',null,'T',null,'A'],['Y','A','R','D','S']], clues:{ across:['White thing in the sky after rain (5)','Bird home (4)','Outdoor space around a house (5)'], down:['Sweet treat / candy land (5)','Opposite of up, in some contexts (5)','To support or hold (5)'] } },{ name:'Everyday Mix', grid:[['S','T','A','R',null],['T',null,'O',null,'P'],['O','N','E',null,'E'],[null,null,'N',null,'A'],['R','A','I','N',null]], clues:{ across:['Shines in the night sky (4)','The number before two (3)','Weather from the clouds (4)'], down:['A dramatic water body clue (5)','To move downward or to the side (4)','The center of a target (4)'] } }];
const PIECES = { w:{k:'♔', q:'♕', r:'♖', b:'♗', n:'♘', p:'♙'}, b:{k:'♚', q:'♛', r:'♜', b:'♝', n:'♞', p:'♟'} };
const app = document.getElementById('app');
const statusEl = document.getElementById('status');
const homeBtn = document.getElementById('homeBtn');
const S = { screen:'home', game:null, solo:{ sudoku:null, wordle:null, crossword:null }, room:null, me:null, token:null, pollTimer:null };
function setStatus(msg){ statusEl.textContent = msg || 'Ready'; }
function escapeHtml(str){ return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function qs(name){ return new URLSearchParams(location.search).get(name); }
function setQuery(params){ const u = new URL(location.href); Object.entries(params).forEach(([k,v]) => { if (v === null || v === undefined || v === '') u.searchParams.delete(k); else u.searchParams.set(k, v); }); history.replaceState({}, '', u.toString()); }
function copy(text){ return navigator.clipboard.writeText(text).then(() => setStatus('Copied')).catch(() => setStatus('Copy failed')); }
function api(params){ return new Promise((resolve, reject) => { if (!CONFIG.backendUrl || CONFIG.backendUrl.includes('PASTE_YOUR_APPS_SCRIPT_WEB_APP_URL_HERE')) { reject(new Error('Set the Apps Script web app URL in CONFIG.backendUrl.')); return; } const cb = '__ah_' + Math.random().toString(36).slice(2); const s = document.createElement('script'); const url = new URL(CONFIG.backendUrl); Object.entries(params).forEach(([k,v]) => url.searchParams.set(k, typeof v === 'string' ? v : JSON.stringify(v))); url.searchParams.set('callback', cb); window[cb] = (data) => { cleanup(); resolve(data); }; function cleanup(){ delete window[cb]; if (s.parentNode) s.parentNode.removeChild(s); } s.onerror = () => { cleanup(); reject(new Error('Network request failed')); }; s.src = url.toString(); document.head.appendChild(s); setTimeout(() => { if (window[cb]) { cleanup(); reject(new Error('Request timed out')); } }, 12000); }); }
function roomLink(roomId){ const u = new URL(location.href); u.searchParams.set('room', roomId); return u.toString(); }
function gameLabel(game){ return ({ sudoku:'Sudoku', wordle:'Wordle', crossword:'Crossword', ttt:'Tic-Tac-Toe', connect4:'Connect Four', checkers:'Checkers', chess:'Chess', battleship:'Battleship' })[game] || 'Game'; }
function seatName(seat){ return seat === 'A' ? 'Player A' : seat === 'B' ? 'Player B' : '—'; }
function otherSeat(seat){ return seat === 'A' ? 'B' : 'A'; }
function clone(obj){ return JSON.parse(JSON.stringify(obj)); }
function shuffle(arr){ const a = arr.slice(); for (let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; } return a; }
function choice(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function inside(r,c){ return r>=0 && c>=0 && r<8 && c<8; }
function inside6(r,c){ return r>=0 && c>=0 && r<6 && c<6; }
function makeSudoku(){ const base = 3, side = 9; const pattern = (r,c) => (base * (r % base) + Math.floor(r / base) + c) % side; const rBase = [0,1,2]; const rows = shuffle(rBase).flatMap(g => shuffle(rBase).map(r => g*base+r)); const cols = shuffle(rBase).flatMap(g => shuffle(rBase).map(c => g*base+c)); const nums = shuffle([1,2,3,4,5,6,7,8,9]); return Array.from({length:side}, (_, r) => Array.from({length:side}, (_, c) => nums[pattern(rows[r], cols[c])])); }
function initSudoku(difficulty='medium'){ const solution = makeSudoku(); const holes = { easy:34, medium:44, hard:52 }[difficulty] ?? 44; const board = solution.map(r => r.slice()); shuffle([...Array(81).keys()]).slice(0, holes).forEach(i => board[Math.floor(i/9)][i%9] = null); S.solo.sudoku = { difficulty, solution, board, fixed: board.map(row => row.map(v => v !== null)), selected:[0,0], complete:false }; }
function initWordle(difficulty='medium'){ S.solo.wordle = { difficulty, answer: choice(SOLO_WORDS[difficulty]), rows:Array.from({length:6}, () => Array(5).fill('')), result:Array.from({length:6}, () => Array(5).fill('')), row:0, col:0, won:false, lost:false }; }
function initCrossword(idx=0){ S.solo.crossword = { idx, puzzle: clone(CROSSWORDS[idx]), cells: CROSSWORDS[idx].grid.map(row => row.map(v => v ? '' : null)), solved:false }; }
function newRoomState(game, starter='A'){
  if (game === 'ttt') return { game, board:Array(9).fill(''), turnSeat: starter, winner:null, gameOver:false, rematch:{A:false,B:false}, rematchLock:false };
  if (game === 'connect4') return { game, board:Array.from({length:6},()=>Array(7).fill('')), turnSeat: starter, winner:null, gameOver:false, rematch:{A:false,B:false}, rematchLock:false };
  if (game === 'checkers'){ const board = Array.from({length:8},()=>Array(8).fill(null)); for(let r=0;r<3;r++) for(let c=0;c<8;c++) if((r+c)%2===1) board[r][c]='b'; for(let r=5;r<8;r++) for(let c=0;c<8;c++) if((r+c)%2===1) board[r][c]='r'; return { game, board, turnSeat: starter, selected:null, winner:null, gameOver:false, rematch:{A:false,B:false}, rematchLock:false }; }
  if (game === 'chess'){ const back = ['r','n','b','q','k','b','n','r']; const board = Array.from({length:8},()=>Array(8).fill(null)); for(let c=0;c<8;c++){ board[0][c]={t:back[c], c:'b'}; board[1][c]={t:'p', c:'b'}; board[6][c]={t:'p', c:'w'}; board[7][c]={t:back[c], c:'w'}; } return { game, board, turnSeat: starter, selected:null, legal:[], status:'White to move', winner:null, gameOver:false, rematch:{A:false,B:false}, rematchLock:false }; }
  if (game === 'battleship'){ const side = () => ({ board:Array.from({length:6},()=>Array(6).fill('')), shots:Array.from({length:6},()=>Array(6).fill('')), ships:[], placed:false }); return { game, phase:'place', turnSeat: starter, orient:'H', shipSizes:[3,2,2], shipIndex:0, sides:{A:side(), B:side()}, winner:null, gameOver:false, rematch:{A:false,B:false}, rematchLock:false }; }
  return { game, turnSeat: starter, winner:null, gameOver:false, rematch:{A:false,B:false}, rematchLock:false };
}

function renderEndcard(){ const g = S.room.state; const winnerSeat = g.winner; const loserSeat = winnerSeat === 'A' ? 'B' : winnerSeat === 'B' ? 'A' : null; const meResult = winnerSeat === 'D' ? 'draw' : (winnerSeat === S.me ? 'win' : 'loss'); const voteA = !!g.rematch?.A; const voteB = !!g.rematch?.B; const bothVoted = voteA && voteB; return `<div class="overlay"><div class="box"><div class="kicker">Match finished</div><h3 style="margin:0 0 8px; font-size:1.5rem">${winnerSeat === 'D' ? 'Draw' : `${seatName(winnerSeat)} wins`}</h3><div class="muted small">${winnerSeat === 'D' ? 'No winner this round.' : `Winner: ${seatName(winnerSeat)} • Loser: ${seatName(loserSeat)} • Next round starts with the loser if both players vote yes.`}</div><div class="result-badges"><span class="result-badge ${meResult}">${winnerSeat === 'D' ? 'Draw' : (meResult === 'win' ? 'You won' : 'You lost')}</span><span class="result-badge ${voteA ? 'win' : ''}">Player A vote: ${voteA ? 'Yes' : 'No'}</span><span class="result-badge ${voteB ? 'win' : ''}">Player B vote: ${voteB ? 'Yes' : 'No'}</span></div><div class="hr"></div><div class="toolbar"><button class="btn good" data-action="vote-rematch">${S.me ? 'Vote to replay' : 'Spectator'}</button><button class="btn warn" data-action="clear-rematch">Clear my vote</button></div><div class="soft" style="margin-top:10px">${bothVoted ? `Both players voted. A new round will start now with ${seatName(g.rematchStarter)} going first.` : 'The room stays here until both players vote or the room goes inactive.'}</div></div></div>`; }

function renderHome(){ return `<div class="home-grid"><div class="hero"><div class="hero-inner"><div class="kicker pulse">Free static front end + shared room backend</div><h2>One platform for solo puzzles and live turn-based rooms.</h2><p>Solo games run entirely in the browser. Multiplayer rooms use a free shared backend so the board syncs automatically, turns are enforced, and nobody has to keep sending a fresh link after every move.</p><div class="toolbar" style="margin-top:16px"><button class="btn primary" data-action="resume-room">Resume room link</button><button class="btn" data-action="reset-local">Reset local solo progress</button></div><div class="hr"></div><div class="notice">For the free multiplayer layer, deploy the Apps Script backend, paste its URL into <strong>CONFIG.backendUrl</strong>, then host this file on GitHub Pages.</div></div></div><div class="panel"><div class="panel-h"><div><div class="section-title">Game library</div><div class="muted small">Pick a solo puzzle or start a shared room</div></div></div><div class="panel-b"><div class="grid cards">${card('Solo','Sudoku','Choose easy, medium, or hard and fill the grid.','Start','solo-sudoku')}${card('Solo','Wordle','6 guesses with difficulty-based word pools.','Start','solo-wordle')}${card('Solo','Mini Crossword','Compact crossword-style board with clues.','Start','solo-crossword')}${card('Multiplayer','Tic-Tac-Toe','Fast room play with enforced turns.','Create room','multi-ttt')}${card('Multiplayer','Connect Four','Drop tokens and let the backend sync.','Create room','multi-connect4')}${card('Multiplayer','Checkers','Turn-based board with captures.','Create room','multi-checkers')}${card('Multiplayer','Chess','Legal moves, highlights, and promotion.','Create room','multi-chess')}${card('Multiplayer','Battleship','Place ships, then fire in battle mode.','Create room','multi-battleship')}</div></div></div></div>`; }

function sudokuMove(dir){ const s = S.solo.sudoku; const [r,c] = s.selected; const nr = Math.max(0, Math.min(8, r + (dir==='down'?1:dir==='up'?-1:0))); const nc = Math.max(0, Math.min(8, c + (dir==='right'?1:dir==='left'?-1:0))); s.selected = [nr,nc]; render(); }

function wordleEnter(){ const w = S.solo.wordle; if (w.won || w.lost) return; if (w.col < 5) { setStatus('Need 5 letters'); return; } const guess = w.rows[w.row].join('').toUpperCase(); const ans = w.answer.toUpperCase(); const result = Array(5).fill('gray'); const pool = ans.split(''); for(let i=0;i<5;i++){ if (guess[i] === ans[i]) { result[i] = 'green'; pool[i] = null; } } for(let i=0;i<5;i++){ if (result[i] === 'green') continue; const idx = pool.indexOf(guess[i]); if (idx !== -1){ result[i] = 'gold'; pool[idx] = null; } } w.result[w.row] = result; if (guess === ans) w.won = true; else if (w.row === 5) w.lost = true; else { w.row++; w.col = 0; } render(); }

function tttMove(i){ const g = S.room.state; if (g.gameOver || g.board[i] || g.turnSeat !== S.me) return; g.board[i] = S.me === 'A' ? 'X' : 'O'; const lines = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]]; const winLine = lines.find(l => g.board[l[0]] && g.board[l[0]] === g.board[l[1]] && g.board[l[0]] === g.board[l[2]]); if (winLine) { g.winner = S.me; g.gameOver = true; g.rematch = {A:false,B:false}; g.rematchStarter = otherSeat(S.me); } else if (g.board.every(Boolean)) { g.winner = 'D'; g.gameOver = true; g.rematch = {A:false,B:false}; g.rematchStarter = 'A'; } else g.turnSeat = otherSeat(g.turnSeat); saveRoomState().then(() => { render(); }).catch(()=>{}); }
function connectWinner(board, r, c, p){ const dirs = [[1,0],[0,1],[1,1],[1,-1]]; for (const [dr,dc] of dirs){ let count = 1; for (const sgn of [1,-1]){ let nr = r + dr*sgn, nc = c + dc*sgn; while (board[nr] && board[nr][nc] === p) { count++; nr += dr*sgn; nc += dc*sgn; } } if (count >= 4) return true; } return false; }
function connectMove(col){ const g = S.room.state; if (g.gameOver || g.turnSeat !== S.me) return; for(let r=5;r>=0;r--){ if(!g.board[r][col]){ const disc = g.turnSeat === 'A' ? 'R' : 'Y'; g.board[r][col] = disc; if (connectWinner(g.board, r, col, disc)) { g.winner = S.me; g.gameOver = true; g.rematch = {A:false,B:false}; g.rematchStarter = otherSeat(S.me); } else if (g.board.every(row => row.every(Boolean))) { g.winner = 'D'; g.gameOver = true; g.rematch = {A:false,B:false}; g.rematchStarter = 'A'; } else g.turnSeat = otherSeat(g.turnSeat); saveRoomState().then(() => { render(); }).catch(()=>{}); return; } } }
function pieceSide(piece){ return piece?.toLowerCase() === 'r' ? 'r' : piece?.toLowerCase() === 'b' ? 'b' : null; }
function checkersMovesFor(board, r, c){ const p = board[r][c]; if (!p) return []; const side = pieceSide(p); const dirs = []; if (p === 'r' || p === 'R') dirs.push([-1,-1],[-1,1]); if (p === 'b' || p === 'B') dirs.push([1,-1],[1,1]); if (p === 'R') dirs.push([1,-1],[1,1]); if (p === 'B') dirs.push([-1,-1],[-1,1]); const out = []; for (const [dr,dc] of dirs){ const nr = r+dr, nc = c+dc; const jr = r+dr*2, jc = c+dc*2; if (inside(nr,nc) && !board[nr][nc]) out.push({r:nr,c:nc,capture:null}); if (inside(jr,jc) && board[nr][nc] && pieceSide(board[nr][nc]) !== side && !board[jr][jc]) out.push({r:jr,c:jc,capture:[nr,nc]}); } return out; }
function checkersMove(r,c){ const g = S.room.state; if (g.gameOver || g.turnSeat !== S.me) return; const piece = g.board[r][c]; if (g.selected){ const [sr,sc] = g.selected; const move = checkersMovesFor(g.board, sr, sc).find(m => m.r===r && m.c===c); if (move){ g.board[r][c] = g.board[sr][sc]; g.board[sr][sc] = null; if (move.capture) g.board[move.capture[0]][move.capture[1]] = null; if (g.board[r][c] === 'r' && r === 0) g.board[r][c] = 'R'; if (g.board[r][c] === 'b' && r === 7) g.board[r][c] = 'B'; const sideNow = pieceSide(g.board[r][c]); const moreCap = move.capture ? checkersMovesFor(g.board, r, c).some(m => m.capture) : false; if (moreCap) g.selected = [r,c]; else { g.selected = null; g.turnSeat = otherSeat(g.turnSeat); } const oppSide = sideNow === 'r' ? 'b' : 'r'; if (!g.board.flat().some(p => p && pieceSide(p) === oppSide)) { g.winner = S.me; g.gameOver = true; g.rematch = {A:false,B:false}; g.rematchStarter = otherSeat(S.me); } saveRoomState().then(() => { render(); }).catch(()=>{}); return; } } if (piece && ((S.me === 'A' && pieceSide(piece) === 'r') || (S.me === 'B' && pieceSide(piece) === 'b'))) { g.selected = [r,c]; render(); } }
function cloneChessBoard(board){ return board.map(row => row.map(p => p ? {t:p.t,c:p.c} : null)); }
function findKing(board, side){ for(let r=0;r<8;r++) for(let c=0;c<8;c++){ const p = board[r][c]; if (p && p.t==='k' && p.c===side) return [r,c]; } return null; }
function pseudoChessMoves(board, r, c, attackOnly=false){ const p = board[r][c]; if (!p) return []; const side = p.c; const moves = []; const add = (nr,nc, captureOk=true) => { if (!inside(nr,nc)) return; const t = board[nr][nc]; if (!t) moves.push({r:nr,c:nc}); else if (captureOk && t.c !== side) moves.push({r:nr,c:nc}); }; if (p.t === 'p'){ const dir = side === 'w' ? -1 : 1; const start = side === 'w' ? 6 : 1; if (!attackOnly && !board[r + dir]?.[c]) add(r+dir, c, false); if (!attackOnly && r === start && !board[r + dir]?.[c] && !board[r + dir*2]?.[c]) moves.push({r:r+dir*2,c}); for (const dc of [-1,1]){ const nr = r + dir, nc = c + dc; if (!inside(nr,nc)) continue; const t = board[nr][nc]; if (attackOnly) moves.push({r:nr,c:nc}); else if (t && t.c !== side) moves.push({r:nr,c:nc}); } } if (p.t === 'n'){ [[1,2],[2,1],[-1,2],[-2,1],[1,-2],[2,-1],[-1,-2],[-2,-1]].forEach(([dr,dc]) => add(r+dr,c+dc)); } if (p.t === 'b' || p.t === 'r' || p.t === 'q'){ const dirs = []; if (p.t === 'b' || p.t === 'q') dirs.push([1,1],[1,-1],[-1,1],[-1,-1]); if (p.t === 'r' || p.t === 'q') dirs.push([1,0],[-1,0],[0,1],[0,-1]); for (const [dr,dc] of dirs){ let nr = r + dr, nc = c + dc; while(inside(nr,nc)){ const t = board[nr][nc]; if(!t) moves.push({r:nr,c:nc}); else { if(t.c!==side) moves.push({r:nr,c:nc}); break; } nr += dr; nc += dc; } } } if (p.t === 'k'){ for(let dr=-1;dr<=1;dr++) for(let dc=-1;dc<=1;dc++) if(dr||dc) add(r+dr,c+dc); } return moves; }
function isSquareAttacked(board, r, c, bySide){ for(let sr=0; sr<8; sr++) for(let sc=0; sc<8; sc++){ const p = board[sr][sc]; if (p && p.c === bySide){ const mv = pseudoChessMoves(board, sr, sc, true); if (mv.some(m => m.r===r && m.c===c)) return true; } } return false; }
function legalChessMoves(board, r, c){ const p = board[r][c]; if (!p) return []; const side = p.c; return pseudoChessMoves(board, r, c, false).filter(m => { const test = cloneChessBoard(board); test[m.r][m.c] = test[r][c]; test[r][c] = null; if (test[m.r][m.c].t === 'p' && (m.r === 0 || m.r === 7)) test[m.r][m.c].t = 'q'; const king = findKing(test, side); if (!king) return false; return !isSquareAttacked(test, king[0], king[1], side === 'w' ? 'b' : 'w'); }); }
function updateChessStatus(g){ const side = g.turnSeat === 'A' ? 'w' : 'b'; const opp = side === 'w' ? 'b' : 'w'; let any = false; for(let r=0;r<8;r++) for(let c=0;c<8;c++){ const p = g.board[r][c]; if (p && p.c === side && legalChessMoves(g.board, r, c).length) any = true; } const king = findKing(g.board, side); const check = king ? isSquareAttacked(g.board, king[0], king[1], opp) : false; g.status = `${side === 'w' ? 'White' : 'Black'} to move${check ? ' — check' : ''}`; if (!any) { g.winner = check ? (opp === 'w' ? 'A' : 'B') : 'D'; g.gameOver = true; g.rematch = {A:false,B:false}; g.rematchStarter = g.winner === 'A' ? 'B' : g.winner === 'B' ? 'A' : 'A'; } }
function chessMove(r,c){ const g = S.room.state; if (g.gameOver || g.turnSeat !== S.me) return; if (g.selected){ const [sr,sc] = g.selected; const move = g.legal.find(m => m.r===r && m.c===c); if (move){ g.board[r][c] = g.board[sr][sc]; g.board[sr][sc] = null; if (g.board[r][c].t === 'p' && (r === 0 || r === 7)) g.board[r][c].t = 'q'; g.turnSeat = otherSeat(g.turnSeat); g.selected = null; g.legal = []; updateChessStatus(g); saveRoomState().then(() => { render(); }).catch(()=>{}); return; } } const p = g.board[r][c]; if (p && ((S.me === 'A' && p.c === 'w') || (S.me === 'B' && p.c === 'b'))) { g.selected = [r,c]; g.legal = legalChessMoves(g.board, r, c); render(); } }
function battleshipToggleOrient(){ S.room.state.orient = S.room.state.orient === 'H' ? 'V' : 'H'; render(); }
function battleshipPlace(r,c){ const g = S.room.state; if (g.gameOver || g.turnSeat !== S.me) return; const sideKey = S.me; const side = g.sides[sideKey]; const size = g.shipSizes[g.shipIndex]; const coords = []; for (let i=0;i<size;i++){ const nr = r + (g.orient === 'V' ? i : 0); const nc = c + (g.orient === 'H' ? i : 0); if (!inside6(nr,nc)) return setStatus('Ship does not fit'); if (side.board[nr][nc]) return setStatus('Ships cannot overlap'); coords.push([nr,nc]); } coords.forEach(([nr,nc]) => side.board[nr][nc] = 'S'); side.ships.push(coords); g.shipIndex++; if (g.shipIndex >= g.shipSizes.length){ side.placed = true; g.shipIndex = 0; if (S.me === 'A') { g.turnSeat = 'B'; g.phase = 'placeB'; } else { g.turnSeat = 'A'; g.phase = 'battle'; } } saveRoomState().then(() => { render(); }).catch(()=>{}); }
function battleshipFire(r,c){ const g = S.room.state; if (g.gameOver || g.phase !== 'battle' || g.turnSeat !== S.me) return; const me = S.me; const opp = otherSeat(me); const target = g.sides[opp]; const shots = g.sides[me].shots; if (shots[r][c]) return setStatus('Already fired there'); if (target.board[r][c] === 'S'){ shots[r][c] = 'H'; target.board[r][c] = 'X'; if (target.board.flat().every(v => v !== 'S')) { g.winner = me; g.gameOver = true; g.rematch = {A:false,B:false}; g.rematchStarter = otherSeat(me); } else g.turnSeat = opp; setStatus('Hit'); } else { shots[r][c] = 'M'; g.turnSeat = opp; setStatus('Miss'); } saveRoomState().then(() => { render(); }).catch(()=>{}); }
function renderTtt(){ const g = S.room.state; return `<div class="game-board-wrap"><div class="notice">${g.gameOver ? (g.winner === 'D' ? 'Draw.' : `${seatName(g.winner)} wins.`) : `Turn: ${seatName(g.turnSeat)}.`}</div><div class="tic">${g.board.map((v,i)=>`<button class="cell" data-action="ttt-move" data-i="${i}">${v}</button>`).join('')}</div><div class="soft">Auto-sync is live. Only the seat whose turn it is can move.</div></div>`; }
function renderConnect4(){ const g = S.room.state; return `<div class="game-board-wrap"><div class="notice">${g.gameOver ? (g.winner === 'D' ? 'Draw.' : `${seatName(g.winner)} wins.`) : `Turn: ${seatName(g.turnSeat)}.`}</div><div class="connect">${[0,1,2,3,4,5,6].map(col=>`<button class="btn" style="grid-row:1" data-action="connect-move" data-col="${col}">▼</button>`).join('')}${g.board.flatMap(row=>row.map(v=>{ const cls = v === 'R' ? 'red' : v === 'Y' ? 'yellow' : ''; return `<div class="slot">${v ? `<div class="chip ${cls}"></div>` : ''}</div>`; })).join('')}</div></div>`; }
function renderCheckers(){ const g = S.room.state; return `<div class="game-board-wrap"><div class="notice">${g.gameOver ? (g.winner === 'D' ? 'Draw.' : `${seatName(g.winner)} wins.`) : `Turn: ${seatName(g.turnSeat)}.`}</div><div class="checkers" style="grid-template-columns:repeat(8, 56px)">${g.board.flatMap((row,r)=>row.map((p,c)=>{ const dark = (r+c)%2===1; const sel = g.selected && g.selected[0]===r && g.selected[1]===c; const txt = p ? `<span class="piece ${p === 'r' || p === 'R' ? 'red' : 'black'}">${p === 'r' ? '⛂' : p === 'R' ? '⛃' : p === 'b' ? '⛀' : '⛁'}</span>` : ''; return `<button class="cell ${dark?'dark':'light'} ${sel?'selected':''}" data-action="checkers-cell" data-r="${r}" data-c="${c}">${txt}</button>`; })).join('')}</div></div>`; }
function renderChess(){ const g = S.room.state; return `<div class="game-board-wrap"><div class="notice">${escapeHtml(g.status || '')}</div><div class="chess" style="grid-template-columns:repeat(8, 56px)">${g.board.flatMap((row,r)=>row.map((p,c)=>{ const dark = (r+c)%2===1; const sel = g.selected && g.selected[0]===r && g.selected[1]===c; const tgt = g.legal?.some(m=>m.r===r && m.c===c); return `<button class="cell ${dark?'dark':'light'} ${sel?'selected':''} ${tgt?'target':''}" data-action="chess-cell" data-r="${r}" data-c="${c}">${p ? `<span class="piece ${p.c}">${PIECES[p.c][p.t]}</span>` : ''}</button>`; })).join('')}</div><div class="soft">This implementation includes standard movement and promotion. The server keeps room state synced and rejects out-of-turn moves.</div></div>`; }
function renderBattleship(){ const g = S.room.state; const me = S.me; const my = me ? g.sides[me] : null; const opp = otherSeat(me); const phaseText = g.gameOver ? (g.winner === 'D' ? 'Draw.' : `${seatName(g.winner)} wins.`) : (g.phase === 'battle' ? `Battle phase — ${seatName(g.turnSeat)} to move` : `Placement phase — ${seatName(me)} placing ships`); const viewGrid = g.phase === 'battle' ? g.sides[opp].board : my.board; const action = g.phase === 'battle' ? 'battle-fire' : 'battle-place'; return `<div class="game-board-wrap"><div class="notice">${phaseText}${g.phase !== 'battle' ? ` • Ship size: <strong>${g.shipSizes[g.shipIndex]}</strong> • Orientation: <strong>${g.orient}</strong>` : ''}</div><div class="toolbar">${g.phase !== 'battle' ? `<button class="btn" data-action="battle-orient">Toggle orientation</button>` : ''}</div><div class="battle" style="grid-template-columns:repeat(6, 56px)">${viewGrid.flatMap((row,r)=>row.map((v,c)=>{ const show = g.phase === 'battle' ? (g.sides[opp].shots[r][c] || '') : (my.board[r][c] === 'S' ? '■' : ''); return `<button class="cell ${(r+c)%2===1?'dark':'light'}" data-action="${action}" data-r="${r}" data-c="${c}">${show || ''}</button>`; })).join('')}</div><div class="soft">Place three ships (sizes 3, 2, 2), then battle begins automatically.</div></div>`; }
function render(){ homeBtn.style.display = S.screen === 'home' ? 'none' : 'inline-flex'; let html = ''; if (S.screen === 'home') html = renderHome(); if (S.screen === 'solo') html = renderSolo(); if (S.screen === 'room') html = renderRoom(); app.innerHTML = html; if (S.screen === 'solo' && S.game === 'sudoku') { const diff = document.getElementById('soloDiff'); if (diff) diff.value = S.solo.sudoku.difficulty; } maybeStartRematch(); }
function attachRoomFromState(){ if (!S.room || !S.room.state) return; if (S.room.game === 'chess') updateChessStatus(S.room.state); }
document.addEventListener('click', async (e) => { const btn = e.target.closest('[data-action]'); if (!btn) return; const action = btn.dataset.action; if (action === 'solo-sudoku') return openLocal('sudoku'); if (action === 'solo-wordle') return openLocal('wordle'); if (action === 'solo-crossword') return openLocal('crossword'); if (action === 'multi-ttt') return openMulti('ttt'); if (action === 'multi-connect4') return openMulti('connect4'); if (action === 'multi-checkers') return openMulti('checkers'); if (action === 'multi-chess') return openMulti('chess'); if (action === 'multi-battleship') return openMulti('battleship'); if (action === 'copy-room') return S.room ? copy(roomLink(S.room.roomId)) : copy(location.href); if (action === 'refresh-room') return refreshRoom().catch(err => setStatus(err.message)); if (action === 'resume-room') { const roomId = qs('room'); if (roomId) { S.screen = 'room'; S.game = qs('game') || 'ttt'; render(); joinRoom(roomId).catch(err => setStatus(err.message)); } return; } if (action === 'reset-local') { S.solo = { sudoku:null, wordle:null, crossword:null }; setStatus('Local progress reset'); render(); return; } if (action === 'new-room') { if (S.game) openMulti(S.game); return; } if (action === 'new-solo') { const pick = S.game; if (pick === 'sudoku') initSudoku(document.getElementById('soloDiff')?.value || 'medium'); if (pick === 'wordle') initWordle(document.getElementById('soloDiff')?.value || 'medium'); if (pick === 'crossword') initCrossword(Number(document.getElementById('crosswordPick')?.value || 0)); render(); return; } if (action === 'vote-rematch') return voteRematch(true); if (action === 'clear-rematch') return voteRematch(false); if (action === 'sudoku-cell') { if (!e.target.matches('input')) { const r = Number(btn.dataset.r), c = Number(btn.dataset.c); S.solo.sudoku.selected = [r,c]; render(); } } if (action === 'sudoku-num') { sudokuSet(...S.solo.sudoku.selected, btn.dataset.n); render(); } if (action === 'sudoku-clear') { sudokuSet(...S.solo.sudoku.selected, ''); render(); } if (action === 'wordle-key') return wordleKey(btn.dataset.ch); if (action === 'wordle-back') return wordleBack(); if (action === 'wordle-enter') return wordleEnter(); if (action === 'ttt-move') return S.room && tttMove(Number(btn.dataset.i)); if (action === 'connect-move') return S.room && connectMove(Number(btn.dataset.col)); if (action === 'checkers-cell') return S.room && checkersMove(Number(btn.dataset.r), Number(btn.dataset.c)); if (action === 'chess-cell') return S.room && chessMove(Number(btn.dataset.r), Number(btn.dataset.c)); if (action === 'battle-orient') return S.room && battleshipToggleOrient(); if (action === 'battle-place') return S.room && battleshipPlace(Number(btn.dataset.r), Number(btn.dataset.c)); if (action === 'battle-fire') return S.room && battleshipFire(Number(btn.dataset.r), Number(btn.dataset.c)); });
document.addEventListener('change', (e) => { const el = e.target.closest('[data-action]'); if (!el) return; const action = el.dataset.action; if (action === 'difficulty-sudoku') initSudoku(el.value); if (action === 'difficulty-wordle') initWordle(el.value); if (action === 'crossword-puzzle') initCrossword(Number(el.value)); if (action === 'crossword-cell') crosswordSet(Number(el.dataset.r), Number(el.dataset.c), el.value); });
document.addEventListener('input', (e) => { const el = e.target; if (el.matches('input[data-r][data-c]') && S.screen === 'solo' && S.game === 'sudoku') { const r = Number(el.dataset.r), c = Number(el.dataset.c); const v = el.value.replace(/[^1-9]/g,'').slice(0,1); sudokuSet(r,c,v); } if (el.matches('input[data-action="crossword-cell"]')) { const r = Number(el.dataset.r), c = Number(el.dataset.c); crosswordSet(r,c,el.value); } });
document.addEventListener('keydown', (e) => { if (S.screen === 'solo' && S.game === 'sudoku') { if (/^[1-9]$/.test(e.key)) { e.preventDefault(); sudokuSet(...S.solo.sudoku.selected, e.key); return; } if (e.key === 'Backspace' || e.key === 'Delete') { e.preventDefault(); sudokuSet(...S.solo.sudoku.selected, ''); return; } if (e.key === 'ArrowUp') { e.preventDefault(); sudokuMove('up'); return; } if (e.key === 'ArrowDown') { e.preventDefault(); sudokuMove('down'); return; } if (e.key === 'ArrowLeft') { e.preventDefault(); sudokuMove('left'); return; } if (e.key === 'ArrowRight') { e.preventDefault(); sudokuMove('right'); return; } } if (S.screen === 'solo' && S.game === 'wordle') { if (/^[a-zA-Z]$/.test(e.key)) { e.preventDefault(); wordleKey(e.key.toUpperCase()); return; } if (e.key === 'Backspace') { e.preventDefault(); wordleBack(); return; } if (e.key === 'Enter') { e.preventDefault(); wordleEnter(); return; } } });
homeBtn.addEventListener('click', goHome);
async function boot(){ const roomId = qs('room'); const game = qs('game'); if (roomId && game){ S.screen = 'room'; S.game = game; render(); try { await joinRoom(roomId); } catch (err) { setStatus(err.message); } } else { S.screen = 'home'; render(); } startPolling(); }
boot();
window.addEventListener('visibilitychange', () => { if (!document.hidden && S.room) refreshRoom().catch(()=>{}); });
</script>
