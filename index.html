<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GameHub</title>
  <style>
    :root {
      --bg0:#07101f;
      --bg1:#0b1328;
      --bg2:#111b36;
      --card:rgba(255,255,255,.06);
      --line:rgba(255,255,255,.12);
      --line2:rgba(255,255,255,.20);
      --text:#eef3ff;
      --muted:#acb7e6;
      --accent:#7d9bff;
      --accent2:#76e0b8;
      --warning:#ffd166;
      --danger:#ff7b93;
      --shadow:0 24px 70px rgba(0,0,0,.35);
      --shadow2:0 12px 28px rgba(0,0,0,.22);
      --r:24px;
      --r2:16px;
      --cell:44px;
      color-scheme: dark;
    }
    * { box-sizing:border-box; }
    html, body { height:100%; }
    body {
      margin:0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      color:var(--text);
      background:
        radial-gradient(circle at 10% 8%, rgba(125,155,255,.22), transparent 26%),
        radial-gradient(circle at 90% 0%, rgba(118,224,184,.16), transparent 24%),
        radial-gradient(circle at 50% 110%, rgba(255,209,102,.08), transparent 22%),
        linear-gradient(180deg, var(--bg0), var(--bg1) 48%, var(--bg0));
      overflow-x:hidden;
    }
    body::before {
      content:"";
      position:fixed; inset:-30%;
      background:
        linear-gradient(115deg, transparent 0 48%, rgba(255,255,255,.02) 50%, transparent 52%),
        linear-gradient(25deg, transparent 0 45%, rgba(255,255,255,.02) 50%, transparent 55%);
      transform:rotate(-8deg);
      animation: drift 20s linear infinite;
      pointer-events:none;
      opacity:.5;
    }
    @keyframes drift { from { transform:translateX(-4%) rotate(-8deg); } to { transform:translateX(4%) rotate(-8deg); } }
    .app { position:relative; z-index:1; max-width:1460px; margin:0 auto; padding:18px; }
    .top { display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:18px; }
    .brand { display:flex; align-items:center; gap:14px; }
    .mark { width:52px; height:52px; border-radius:16px; display:grid; place-items:center; font-weight:900; color:#06111b; background:linear-gradient(135deg, rgba(125,155,255,1), rgba(118,224,184,1)); box-shadow:var(--shadow2); }
    .brand h1 { margin:0; font-size:1.2rem; }
    .brand p { margin:3px 0 0; color:var(--muted); font-size:.92rem; }
    .top-actions { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
    .pill, .btn, .field, .select, .badge, .tab {
      border-radius:14px;
      border:1px solid var(--line);
      background:rgba(255,255,255,.06);
      color:var(--text);
    }
    .pill { padding:10px 14px; color:#dfe7ff; background:rgba(255,255,255,.04); }
    .btn, .tab { padding:11px 14px; cursor:pointer; transition:transform .15s ease, border-color .15s ease, background .15s ease; }
    .btn:hover, .tab:hover { transform:translateY(-1px); border-color:var(--line2); }
    .btn.primary { background:linear-gradient(135deg, rgba(125,155,255,.95), rgba(117,135,255,.9)); border-color:rgba(125,155,255,.45); box-shadow:0 12px 30px rgba(125,155,255,.15); font-weight:700; }
    .btn.good { background:linear-gradient(135deg, rgba(118,224,184,.16), rgba(118,224,184,.07)); border-color:rgba(118,224,184,.28); }
    .btn.warn { background:linear-gradient(135deg, rgba(255,209,102,.12), rgba(255,209,102,.06)); border-color:rgba(255,209,102,.25); }
    .btn.danger { background:linear-gradient(135deg, rgba(255,123,147,.12), rgba(255,123,147,.06)); border-color:rgba(255,123,147,.25); }
    .field, .select { padding:11px 12px; min-width:0; outline:none; }
    .field:focus, .select:focus { border-color:rgba(125,155,255,.55); box-shadow:0 0 0 3px rgba(125,155,255,.14); }
    .grid { display:grid; gap:18px; }
    .home-grid, .layout { grid-template-columns: 1.08fr .92fr; }
    .hero, .panel, .main, .side {
      border:1px solid var(--line);
      box-shadow:var(--shadow2);
      border-radius:var(--r);
      overflow:hidden;
      background:linear-gradient(180deg, rgba(255,255,255,.055), rgba(255,255,255,.03));
    }
    .hero { box-shadow:var(--shadow); background:
      radial-gradient(circle at 8% 10%, rgba(125,155,255,.16), transparent 20%),
      radial-gradient(circle at 80% 0%, rgba(118,224,184,.16), transparent 22%),
      linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.03));
    }
    .hero-inner { padding:24px; }
    .hero h2 { margin:0 0 10px; font-size:clamp(1.8rem, 3vw, 3.35rem); line-height:1.03; }
    .hero p { margin:0; color:var(--muted); max-width:75ch; line-height:1.55; }
    .kicker { display:inline-flex; gap:8px; align-items:center; padding:8px 11px; border-radius:999px; margin-bottom:12px; background:rgba(125,155,255,.12); border:1px solid rgba(125,155,255,.25); color:#dfe7ff; font-size:.84rem; }
    .panel-h { padding:16px 16px 0; display:flex; justify-content:space-between; align-items:flex-end; gap:12px; flex-wrap:wrap; }
    .panel-b, .body { padding:16px; }
    .section-title { margin:0 0 12px; font-size:.95rem; letter-spacing:.12em; text-transform:uppercase; color:#d9e1ff; }
    .cards { display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:14px; }
    .card { padding:16px; min-height:158px; border-radius:22px; border:1px solid var(--line); background:rgba(255,255,255,.04); display:flex; flex-direction:column; gap:10px; transition:transform .16s ease, border-color .16s ease; }
    .card:hover { transform:translateY(-2px); border-color:rgba(125,155,255,.28); }
    .card h3 { margin:10px 0 8px; font-size:1.06rem; }
    .card p { margin:0; color:var(--muted); line-height:1.5; font-size:.95rem; }
    .card .row { margin-top:auto; display:flex; gap:8px; flex-wrap:wrap; }
    .badge { display:inline-flex; align-items:center; gap:6px; padding:7px 10px; font-size:.8rem; }
    .badge.solo { background:rgba(255,209,102,.12); border-color:rgba(255,209,102,.24); }
    .badge.multi { background:rgba(118,224,184,.12); border-color:rgba(118,224,184,.24); }
    .main { min-height:720px; }
    .head { padding:16px 18px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; background:linear-gradient(180deg, rgba(255,255,255,.04), transparent); }
    .head h2 { margin:0; font-size:1.22rem; }
    .head .sub { margin-top:4px; color:var(--muted); font-size:.92rem; }
    .toolbar, .stack { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
    .stack { flex-direction:column; align-items:stretch; }
    .notice { padding:12px 14px; border-radius:16px; border:1px solid rgba(255,209,102,.24); background:rgba(255,209,102,.08); color:#ffe8b0; line-height:1.45; }
    .soft { padding:12px 14px; border-radius:16px; border:1px solid var(--line); background:rgba(255,255,255,.04); color:var(--muted); line-height:1.5; }
    .hr { height:1px; background:var(--line); margin:12px 0; }
    .game-board-wrap { display:flex; flex-direction:column; gap:14px; }
    .board { display:grid; gap:0; width:fit-content; user-select:none; }
    .cell { width:var(--cell); height:var(--cell); border:1px solid rgba(255,255,255,.1); display:grid; place-items:center; background:rgba(255,255,255,.03); color:var(--text); font-weight:700; padding:0; }
    .cell.dark { background:rgba(255,255,255,.08); }
    .cell.light { background:rgba(255,255,255,.03); }
    .cell.selected { outline:2px solid rgba(125,155,255,.95); outline-offset:-2px; }
    .cell.target { background:rgba(118,224,184,.14); }
    .cell.hint { background:rgba(255,209,102,.12); }
    .cell.block { background:rgba(255,255,255,.08); color:transparent; }
    .cell.input { font-size:1rem; }
    .cell.input input { width:100%; height:100%; border:0; background:transparent; color:var(--text); text-align:center; font-size:1rem; font-weight:800; text-transform:uppercase; }
    .cell.input input:focus { outline:none; }
    .sudoku-grid { grid-template-columns:repeat(9, var(--cell)); }
    .word-grid { display:grid; grid-template-rows:repeat(6, 1fr); gap:8px; }
    .guess-row { display:grid; grid-template-columns:repeat(5, 52px); gap:8px; }
    .letter { width:52px; height:52px; border-radius:12px; border:1px solid var(--line); background:rgba(255,255,255,.04); display:grid; place-items:center; font-size:1.15rem; font-weight:900; }
    .letter.green { background:rgba(118,224,184,.18); border-color:rgba(118,224,184,.4); }
    .letter.gold { background:rgba(255,209,102,.16); border-color:rgba(255,209,102,.4); }
    .letter.gray { background:rgba(255,255,255,.08); color:#d2d8ee; }
    .mini-kbd { display:grid; grid-template-columns:repeat(10, minmax(0,1fr)); gap:6px; max-width:700px; }
    .mini-kbd button { min-height:38px; padding:0; font-size:.9rem; }
    .crossword { display:grid; gap:6px; width:fit-content; margin-bottom:14px; }
    .crossword .cell { width:42px; height:42px; border-radius:10px; overflow:hidden; }
    .crossword .cell input { width:100%; height:100%; border:0; background:transparent; color:var(--text); text-transform:uppercase; text-align:center; font-weight:900; font-size:1rem; }
    .clues { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    .clue { border:1px solid var(--line); border-radius:16px; padding:12px; background:rgba(255,255,255,.04); }
    .clue h4 { margin:0 0 8px; }
    .clue ol { margin:0; padding-left:20px; color:var(--muted); line-height:1.5; }
    .tic { display:grid; grid-template-columns:repeat(3, 94px); gap:10px; }
    .tic .cell { width:94px; height:94px; border-radius:18px; font-size:2rem; font-weight:900; }
    .connect { display:grid; grid-template-columns:repeat(7, 62px); gap:8px; background:rgba(15,22,44,.7); border:1px solid var(--line); padding:10px; border-radius:18px; width:fit-content; }
    .connect .slot { width:62px; height:62px; border-radius:999px; border:1px solid rgba(255,255,255,.08); background:rgba(255,255,255,.05); display:grid; place-items:center; overflow:hidden; }
    .chip { width:46px; height:46px; border-radius:999px; box-shadow:inset 0 2px 5px rgba(255,255,255,.18), inset 0 -8px 14px rgba(0,0,0,.35); border:1px solid rgba(255,255,255,.2); animation: chipPop .16s ease; }
    @keyframes chipPop { from { transform:scale(.55); opacity:.2; } to { transform:scale(1); opacity:1; } }
    .chip.red { background:radial-gradient(circle at 30% 30%, #ff8ea2, #ff365f 65%, #bf1439); }
    .chip.yellow { background:radial-gradient(circle at 30% 30%, #fff3aa, #ffd23b 65%, #bc8e00); }
    .checkers, .chess, .battle { display:grid; width:fit-content; border:1px solid var(--line); border-radius:18px; overflow:hidden; }
    .checkers .cell, .chess .cell, .battle .cell { width:56px; height:56px; border-radius:0; }
    .piece { width:100%; height:100%; display:grid; place-items:center; font-size:1.8rem; line-height:1; }
    .piece.red { color:#ff7a93; }
    .piece.black { color:#e8eeff; }
    .piece.w { color:#eef2ff; }
    .piece.b { color:#ff7a93; }
    .side { padding:16px; display:flex; flex-direction:column; gap:10px; }
    .side .cardish { border:1px solid var(--line); border-radius:18px; padding:12px; background:rgba(255,255,255,.04); }
    .room-link { width:100%; padding:11px 12px; border-radius:14px; border:1px solid var(--line); background:rgba(255,255,255,.05); color:var(--text); }
    .room-status { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
    .seat { display:inline-flex; align-items:center; gap:6px; padding:7px 10px; border-radius:999px; background:rgba(125,155,255,.12); border:1px solid rgba(125,155,255,.25); }
    .seat.good { background:rgba(118,224,184,.12); border-color:rgba(118,224,184,.25); }
    .seat.warn { background:rgba(255,209,102,.12); border-color:rgba(255,209,102,.25); }
    .overlay { position:absolute; inset:0; display:grid; place-items:center; background:linear-gradient(180deg, rgba(7,16,31,.36), rgba(7,16,31,.78)); backdrop-filter:blur(4px); z-index:5; border-radius:24px; }
    .overlay .box { min-width:min(92%, 420px); max-width:92%; border-radius:22px; background:rgba(15,22,44,.94); border:1px solid rgba(255,255,255,.12); padding:18px; box-shadow:var(--shadow); animation:popIn .22s ease; }
    @keyframes popIn { from { opacity:0; transform:translateY(8px) scale(.98); } to { opacity:1; transform:translateY(0) scale(1); } }
    .result-badges { display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
    .result-badge { display:inline-flex; align-items:center; gap:6px; padding:7px 10px; border-radius:999px; border:1px solid var(--line); background:rgba(255,255,255,.05); }
    .result-badge.win { background:rgba(118,224,184,.12); border-color:rgba(118,224,184,.25); }
    .result-badge.loss { background:rgba(255,123,147,.12); border-color:rgba(255,123,147,.25); }
    .result-badge.draw { background:rgba(255,209,102,.12); border-color:rgba(255,209,102,.25); }
    .home-grid { display:grid; grid-template-columns:1.08fr .92fr; gap:18px; }
    @media (max-width:1100px) { .home-grid, .layout { grid-template-columns:1fr; } .main { min-height:auto; } }
    @media (max-width:720px) {
      :root { --cell:36px; }
      .cards, .clues { grid-template-columns:1fr; }
      .guess-row { grid-template-columns:repeat(5, 48px); }
      .letter { width:48px; height:48px; }
      .tic { grid-template-columns:repeat(3, 78px); }
      .tic .cell { width:78px; height:78px; }
      .connect { grid-template-columns:repeat(7, 48px); }
      .connect .slot { width:48px; height:48px; }
      .checkers .cell, .chess .cell, .battle .cell { width:42px; height:42px; }
      .chip { width:34px; height:34px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="top">
      <div class="brand">
        <div class="mark">GH</div>
        <div>
          <h1>GameHub</h1>
          <p>Free GitHub Pages games with shared turn-based rooms</p>
        </div>
      </div>
      <div class="top-actions">
        <span id="status" class="pill">Ready</span>
        <button id="homeBtn" class="btn" style="display:none">Home</button>
      </div>
    </div>
    <div id="app"></div>
  </div>

<script>
const CONFIG = {
  backendUrl: "https://script.google.com/macros/s/AKfycby2U1FkwT81mcVy4w2XFDqlnOdylL8PfDDJUrkj9UjeMnOgxf41MMb9pWrz4e3innYp/exec"
};

const WORDS = {
  easy: ['PLANE','TRAIN','APPLE','STONE','GRASS','BREAD','SHORE','SMILE','CLOUD','WATER'],
  medium: ['CIPHER','PLANET','POCKET','MOTION','RIDDLE','ORANGE','MARKET','SPRING','VELVET','SHADOW'],
  hard: ['QUARTZ','JUNGLE','MURKY','EXHALE','VYING','OBJECT','WIZARD','TROPHY','PYTHON','TANGLE']
};

const CROSSWORDS = [
  { name:'City & Nature', grid:[[ 'C','L','O','U','D' ],[ 'A',null,'R',null,'R' ],[ 'N','E','S','T',null ],[ 'D',null,'T',null,'A' ],[ 'Y','A','R','D','S' ]], clues:{ across:['1. White thing in the sky after rain (5)','3. Bird home (4)','4. Outdoor space around a house (5)'], down:['1. Sweet treat / candy land (5)','2. Opposite of up, in some contexts (5)','3. To support or hold (5)'] } },
  { name:'Everyday Mix', grid:[[ 'S','T','A','R',null ],[ 'T',null,'O',null,'P' ],[ 'O','N','E',null,'E' ],[ null,null,'N',null,'A' ],[ 'R','A','I','N',null ]], clues:{ across:['1. Shines in the night sky (4)','2. The number before two (3)','3. Weather from the clouds (4)'], down:['1. A dramatic water body clue (5)','2. To move downward or to the side (4)','3. The center of a target (4)'] } }
];

const PIECES = { w:{k:'♔',q:'♕',r:'♖',b:'♗',n:'♘',p:'♙'}, b:{k:'♚',q:'♛',r:'♜',b:'♝',n:'♞',p:'♟'} };

const app = document.getElementById('app');
const statusEl = document.getElementById('status');
const homeBtn = document.getElementById('homeBtn');

const S = {
  screen:'home',
  game:null,
  solo:{ sudoku:null, wordle:null, crossword:null },
  room:null,
  me:null,
  token:null,
  pollTimer:null
};

function setStatus(msg){ statusEl.textContent = msg || 'Ready'; }
function escapeHtml(str){ return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function qs(name){ return new URLSearchParams(location.search).get(name); }
function setQuery(params){ const u = new URL(location.href); Object.entries(params).forEach(([k,v]) => { if (v === null || v === undefined || v === '') u.searchParams.delete(k); else u.searchParams.set(k, v); }); history.replaceState({}, '', u.toString()); }
function copy(text){ return navigator.clipboard.writeText(text).then(() => setStatus('Copied')).catch(() => setStatus('Copy failed')); }
function otherSeat(seat){ return seat === 'A' ? 'B' : 'A'; }
function seatName(seat){ return seat === 'A' ? 'Player A' : seat === 'B' ? 'Player B' : '—'; }
function gameLabel(game){ return ({ sudoku:'Sudoku', wordle:'Wordle', crossword:'Mini Crossword', ttt:'Tic-Tac-Toe', connect4:'Connect Four', checkers:'Checkers', chess:'Chess', battleship:'Battleship' })[game] || 'Game'; }
function inside(r,c){ return r>=0 && c>=0 && r<8 && c<8; }
function inside6(r,c){ return r>=0 && c>=0 && r<6 && c<6; }
function clone(obj){ return JSON.parse(JSON.stringify(obj)); }
function shuffle(arr){ const a = arr.slice(); for (let i=a.length-1; i>0; i--) { const j = Math.floor(Math.random()*(i+1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function choice(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

function api(params){
  return new Promise((resolve, reject) => {
    if (!CONFIG.backendUrl || CONFIG.backendUrl.includes('PASTE_YOUR_APPS_SCRIPT_WEB_APP_URL_HERE')) {
      reject(new Error('Set CONFIG.backendUrl to your Apps Script web app URL.'));
      return;
    }
    const cb = '__gh_' + Math.random().toString(36).slice(2);
    const s = document.createElement('script');
    const url = new URL(CONFIG.backendUrl);
    Object.entries(params).forEach(([k,v]) => url.searchParams.set(k, typeof v === 'string' ? v : JSON.stringify(v)));
    url.searchParams.set('callback', cb);
    window[cb] = (data) => { cleanup(); resolve(data); };
    function cleanup(){ delete window[cb]; if (s.parentNode) s.parentNode.removeChild(s); }
    s.onerror = () => { cleanup(); reject(new Error('Network request failed')); };
    s.src = url.toString();
    document.head.appendChild(s);
    setTimeout(() => { if (window[cb]) { cleanup(); reject(new Error('Request timed out')); } }, 12000);
  });
}

function updateUrl(){
  const u = new URL(location.href);
  if (S.screen === 'home') { u.searchParams.delete('room'); u.searchParams.delete('game'); }
  else {
    if (S.room?.roomId) u.searchParams.set('room', S.room.roomId);
    if (S.game) u.searchParams.set('game', S.game);
  }
  history.replaceState({}, '', u.toString());
}

function render(){
  homeBtn.style.display = S.screen === 'home' ? 'none' : 'inline-flex';
  let html = '';
  if (S.screen === 'home') html = renderHome();
  if (S.screen === 'solo') html = renderSolo();
  if (S.screen === 'room') html = renderRoom();
  app.innerHTML = html;
}

function goHome(){ S.screen = 'home'; S.game = null; S.room = null; S.me = null; S.token = null; stopPolling(); updateUrl(); render(); }
function startPolling(){ stopPolling(); S.pollTimer = setInterval(() => { if (!document.hidden && S.room?.roomId) refreshRoom().catch(()=>{}); }, 2200); }
function stopPolling(){ if (S.pollTimer) clearInterval(S.pollTimer); S.pollTimer = null; }
function updateRoomLink(){ return S.room ? `${location.origin}${location.pathname}?room=${encodeURIComponent(S.room.roomId)}&game=${encodeURIComponent(S.room.game)}` : location.href; }

function makeSudoku(){
  const base = 3, side = 9;
  const pattern = (r,c) => (base * (r % base) + Math.floor(r / base) + c) % side;
  const rBase = [0,1,2];
  const rows = shuffle(rBase).flatMap(g => shuffle(rBase).map(r => g * base + r));
  const cols = shuffle(rBase).flatMap(g => shuffle(rBase).map(c => g * base + c));
  const nums = shuffle([1,2,3,4,5,6,7,8,9]);
  return Array.from({length:side}, (_, r) => Array.from({length:side}, (_, c) => nums[pattern(rows[r], cols[c])]));
}
function sudokuSolved(s){ for (let r=0;r<9;r++) for (let c=0;c<9;c++) if (s.board[r][c] !== s.solution[r][c]) return false; return true; }
function initSudoku(diff='medium'){
  const solution = makeSudoku();
  const holes = { easy:34, medium:44, hard:52 }[diff] ?? 44;
  const board = solution.map(r => r.slice());
  shuffle([...Array(81).keys()]).slice(0, holes).forEach(i => board[Math.floor(i/9)][i%9] = null);
  S.solo.sudoku = { difficulty:diff, solution, board, fixed:board.map(r => r.map(v => v !== null)), selected:[0,0], complete:false };
}
function initWordle(diff='medium'){
  S.solo.wordle = { difficulty:diff, answer:choice(WORDS[diff]), rows:Array.from({length:6},()=>Array(5).fill('')), result:Array.from({length:6},()=>Array(5).fill('')), row:0, col:0, won:false, lost:false };
}
function initCrossword(idx=0){ S.solo.crossword = { idx, puzzle:clone(CROSSWORDS[idx]), cells:CROSSWORDS[idx].grid.map(row => row.map(v => v ? '' : null)), solved:false }; }

function roomState(game, starter='A'){
  if (game === 'ttt') return { game, board:Array(9).fill(''), turnSeat:starter, winner:null, gameOver:false, rematch:{A:false,B:false}, rematchStarter:'A' };
  if (game === 'connect4') return { game, board:Array.from({length:6},()=>Array(7).fill('')), turnSeat:starter, winner:null, gameOver:false, rematch:{A:false,B:false}, rematchStarter:'A' };
  if (game === 'checkers'){
    const board = Array.from({length:8},()=>Array(8).fill(null));
    for (let r=0;r<3;r++) for (let c=0;c<8;c++) if ((r+c)%2===1) board[r][c] = 'b';
    for (let r=5;r<8;r++) for (let c=0;c<8;c++) if ((r+c)%2===1) board[r][c] = 'r';
    return { game, board, turnSeat:starter, selected:null, winner:null, gameOver:false, rematch:{A:false,B:false}, rematchStarter:'A' };
  }
  if (game === 'chess'){
    const back = ['r','n','b','q','k','b','n','r'];
    const board = Array.from({length:8},()=>Array(8).fill(null));
    for (let c=0;c<8;c++){
      board[0][c] = {t:back[c], c:'b'};
      board[1][c] = {t:'p', c:'b'};
      board[6][c] = {t:'p', c:'w'};
      board[7][c] = {t:back[c], c:'w'};
    }
    return { game, board, turnSeat:starter, selected:null, legal:[], status:'White to move', winner:null, gameOver:false, rematch:{A:false,B:false}, rematchStarter:'A' };
  }
  if (game === 'battleship'){
    const side = () => ({ board:Array.from({length:6},()=>Array(6).fill('')), shots:Array.from({length:6},()=>Array(6).fill('')), ships:[], placed:false });
    return { game, phase:'placeA', turnSeat:starter, orient:'H', shipSizes:[3,2,2], shipIndex:0, sides:{A:side(), B:side()}, winner:null, gameOver:false, rematch:{A:false,B:false}, rematchStarter:'A' };
  }
  return { game, turnSeat:starter, winner:null, gameOver:false, rematch:{A:false,B:false}, rematchStarter:'A' };
}

async function createRoom(game){
  const res = await api({ action:'createRoom', game, state: JSON.stringify(roomState(game, 'A')) });
  if (!res.ok) throw new Error(res.error || 'Create room failed');
  S.room = res.room;
  S.me = res.seat || 'A';
  S.token = res.token;
  localStorage.setItem(`gh_token_${S.room.roomId}`, S.token);
  setQuery({ room:S.room.roomId, game:S.room.game });
  startPolling();
  render();
}

async function joinRoom(roomId){
  const cached = localStorage.getItem(`gh_token_${roomId}`);
  const res = await api({ action:'joinRoom', roomId, token:cached || '', name: localStorage.getItem('gh_name_pref') || 'Player' });
  if (!res.ok) throw new Error(res.error || 'Join failed');
  S.room = res.room;
  S.me = res.seat || null;
  S.token = res.token || cached || null;
  if (S.token) localStorage.setItem(`gh_token_${roomId}`, S.token);
  startPolling();
  render();
}

async function refreshRoom(){
  if (!S.room?.roomId) return;
  const res = await api({ action:'getRoom', roomId:S.room.roomId, token:S.token || '' });
  if (!res.ok) throw new Error(res.error || 'Fetch failed');
  S.room = res.room;
  if (res.seat) S.me = res.seat;
  render();
}

async function saveRoomState(){
  if (!S.room?.roomId || !S.token) return false;
  const res = await api({ action:'saveState', roomId:S.room.roomId, token:S.token, state: JSON.stringify(S.room.state) });
  if (!res.ok) {
    setStatus(res.error || 'Move rejected');
    await refreshRoom().catch(()=>{});
    return false;
  }
  S.room = res.room;
  return true;
}

function openSolo(game){
  S.screen = 'solo';
  S.game = game;
  if (game === 'sudoku' && !S.solo.sudoku) initSudoku('medium');
  if (game === 'wordle' && !S.solo.wordle) initWordle('medium');
  if (game === 'crossword' && !S.solo.crossword) initCrossword(0);
  updateUrl();
  render();
}

function openMulti(game){
  S.screen = 'room';
  S.game = game;
  const roomId = qs('room');
  if (roomId) joinRoom(roomId).catch(err => { setStatus(err.message); render(); });
  else createRoom(game).catch(err => { setStatus(err.message); render(); });
  updateUrl();
  render();
}

function wordleEnter(){ const w = S.solo.wordle; if (w.won || w.lost) return; if (w.col < 5) { setStatus('Need 5 letters'); return; } const guess = w.rows[w.row].join('').toUpperCase(); const ans = w.answer.toUpperCase(); const result = Array(5).fill('gray'); const pool = ans.split(''); for (let i=0;i<5;i++) if (guess[i] === ans[i]) { result[i] = 'green'; pool[i] = null; } for (let i=0;i<5;i++) { if (result[i] === 'green') continue; const idx = pool.indexOf(guess[i]); if (idx !== -1) { result[i] = 'gold'; pool[idx] = null; } } w.result[w.row] = result; if (guess === ans) w.won = true; else if (w.row === 5) w.lost = true; else { w.row++; w.col = 0; } render(); }

function renderTTT(){ const g = S.room.state; return `<div class="game-board-wrap"><div class="notice">${g.gameOver ? (g.winner === 'D' ? 'Draw.' : `${seatName(g.winner)} wins.`) : `Turn: ${seatName(g.turnSeat)}.`}</div><div class="tic">${g.board.map((v,i)=>`<button class="cell" data-action="ttt-move" data-i="${i}">${v}</button>`).join('')}</div></div>`; }
function tttMove(i){ const g = S.room.state; if (g.gameOver || g.board[i] || g.turnSeat !== S.me) return; g.board[i] = S.me === 'A' ? 'X' : 'O'; const lines = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]]; const winLine = lines.find(([a,b,c]) => g.board[a] && g.board[a] === g.board[b] && g.board[a] === g.board[c]); if (winLine) { g.winner = S.me; g.gameOver = true; g.rematch = {A:false,B:false}; g.rematchStarter = otherSeat(S.me); } else if (g.board.every(Boolean)) { g.winner = 'D'; g.gameOver = true; g.rematch = {A:false,B:false}; g.rematchStarter = 'A'; } else g.turnSeat = otherSeat(g.turnSeat); saveRoomState().then(() => render()).catch(()=>{}); }

function connectWinner(board, r, c, p){ const dirs = [[1,0],[0,1],[1,1],[1,-1]]; for (const [dr,dc] of dirs) { let count = 1; for (const sgn of [1,-1]) { let nr = r + dr*sgn, nc = c + dc*sgn; while (board[nr] && board[nr][nc] === p) { count++; nr += dr*sgn; nc += dc*sgn; } } if (count >= 4) return true; } return false; }
function renderConnect4(){ const g = S.room.state; return `<div class="game-board-wrap"><div class="notice">${g.gameOver ? (g.winner === 'D' ? 'Draw.' : `${seatName(g.winner)} wins.`) : `Turn: ${seatName(g.turnSeat)}.`}</div><div class="connect">${[0,1,2,3,4,5,6].map(col=>`<button class="btn" style="grid-row:1" data-action="connect-move" data-col="${col}">▼</button>`).join('')}${g.board.flatMap(row=>row.map(v=>`<div class="connect-cell">${v ? `<div class="chip ${v === 'R' ? 'red' : 'yellow'}"></div>` : ''}</div>`)).join('')}</div></div>`; }
function connectMove(col){ const g = S.room.state; if (g.gameOver || g.turnSeat !== S.me) return; for (let r=5;r>=0;r--) { if (!g.board[r][col]) { const disc = g.turnSeat === 'A' ? 'R' : 'Y'; g.board[r][col] = disc; if (connectWinner(g.board, r, col, disc)) { g.winner = S.me; g.gameOver = true; g.rematch = {A:false,B:false}; g.rematchStarter = otherSeat(S.me); } else if (g.board.every(row => row.every(Boolean))) { g.winner = 'D'; g.gameOver = true; g.rematch = {A:false,B:false}; g.rematchStarter = 'A'; } else g.turnSeat = otherSeat(g.turnSeat); saveRoomState().then(() => render()).catch(()=>{}); return; } } }

function pieceSide(piece){ return piece?.toLowerCase() === 'r' ? 'r' : piece?.toLowerCase() === 'b' ? 'b' : null; }
function checkersMovesFor(board, r, c){ const piece = board[r][c]; if (!piece) return []; const side = pieceSide(piece); const dirs = []; if (piece === 'r' || piece === 'R') dirs.push([-1,-1],[-1,1]); if (piece === 'b' || piece === 'B') dirs.push([1,-1],[1,1]); if (piece === 'R') dirs.push([1,-1],[1,1]); if (piece === 'B') dirs.push([-1,-1],[-1,1]); const out = []; for (const [dr,dc] of dirs) { const nr = r + dr, nc = c + dc; const jr = r + dr*2, jc = c + dc*2; if (inside(nr,nc) && !board[nr][nc]) out.push({r:nr,c:nc,capture:null}); if (inside(jr,jc) && board[nr][nc] && pieceSide(board[nr][nc]) !== side && !board[jr][jc]) out.push({r:jr,c:jc,capture:[nr,nc]}); } return out; }
function renderCheckers(){ const g = S.room.state; return `<div class="game-board-wrap"><div class="notice">${g.gameOver ? (g.winner === 'D' ? 'Draw.' : `${seatName(g.winner)} wins.`) : `Turn: ${seatName(g.turnSeat)}.`}</div><div class="checkers" style="grid-template-columns:repeat(8, 56px)">${g.board.flatMap((row,r)=>row.map((p,c)=>{ const dark = (r+c)%2===1; const sel = g.selected && g.selected[0]===r && g.selected[1]===c; const txt = p ? `<span class="piece ${p === 'r' || p === 'R' ? 'red' : 'black'}">${p === 'r' ? '⛂' : p === 'R' ? '⛃' : p === 'b' ? '⛀' : '⛁'}</span>` : ''; return `<button class="cell ${dark ? 'dark' : 'light'} ${sel ? 'selected' : ''}" data-action="checkers-cell" data-r="${r}" data-c="${c}">${txt}</button>`; })).join('')}</div></div>`; }
function checkersMove(r,c){ const g = S.room.state; if (g.gameOver || g.turnSeat !== S.me) return; const piece = g.board[r][c]; if (g.selected) { const [sr,sc] = g.selected; const move = checkersMovesFor(g.board, sr, sc).find(m => m.r===r && m.c===c); if (move) { g.board[r][c] = g.board[sr][sc]; g.board[sr][sc] = null; if (move.capture) g.board[move.capture[0]][move.capture[1]] = null; if (g.board[r][c] === 'r' && r === 0) g.board[r][c] = 'R'; if (g.board[r][c] === 'b' && r === 7) g.board[r][c] = 'B'; const moreCap = move.capture ? checkersMovesFor(g.board, r, c).some(m => m.capture) : false; if (moreCap) g.selected = [r,c]; else { g.selected = null; g.turnSeat = otherSeat(g.turnSeat); } const oppSide = pieceSide(g.board[r][c]) === 'r' ? 'b' : 'r'; if (!g.board.flat().some(p => p && pieceSide(p) === oppSide)) { g.winner = S.me; g.gameOver = true; g.rematch = {A:false,B:false}; g.rematchStarter = otherSeat(S.me); } saveRoomState().then(() => render()).catch(()=>{}); return; } } if (piece && ((S.me === 'A' && pieceSide(piece) === 'r') || (S.me === 'B' && pieceSide(piece) === 'b'))) { g.selected = [r,c]; render(); } }

function cloneChessBoard(board){ return board.map(row => row.map(p => p ? {t:p.t, c:p.c} : null)); }
function findKing(board, side){ for (let r=0;r<8;r++) for (let c=0;c<8;c++) { const p = board[r][c]; if (p && p.t === 'k' && p.c === side) return [r,c]; } return null; }
function pseudoChessMoves(board, r, c, attackOnly=false){ const p = board[r][c]; if (!p) return []; const side = p.c; const moves = []; const add = (nr,nc, captureOk=true) => { if (!inside(nr,nc)) return; const t = board[nr][nc]; if (!t) moves.push({r:nr,c:nc}); else if (captureOk && t.c !== side) moves.push({r:nr,c:nc}); }; if (p.t === 'p') { const dir = side === 'w' ? -1 : 1; const start = side === 'w' ? 6 : 1; if (!attackOnly && !board[r + dir]?.[c]) add(r+dir, c, false); if (!attackOnly && r === start && !board[r + dir]?.[c] && !board[r + dir*2]?.[c]) moves.push({r:r+dir*2,c}); for (const dc of [-1,1]) { const nr = r + dir, nc = c + dc; if (!inside(nr,nc)) continue; const t = board[nr][nc]; if (attackOnly) moves.push({r:nr,c:nc}); else if (t && t.c !== side) moves.push({r:nr,c:nc}); } } if (p.t === 'n') [[1,2],[2,1],[-1,2],[-2,1],[1,-2],[2,-1],[-1,-2],[-2,-1]].forEach(([dr,dc]) => add(r+dr,c+dc)); if (p.t === 'b' || p.t === 'r' || p.t === 'q') { const dirs = []; if (p.t === 'b' || p.t === 'q') dirs.push([1,1],[1,-1],[-1,1],[-1,-1]); if (p.t === 'r' || p.t === 'q') dirs.push([1,0],[-1,0],[0,1],[0,-1]); for (const [dr,dc] of dirs) { let nr = r + dr, nc = c + dc; while (inside(nr,nc)) { const t = board[nr][nc]; if (!t) moves.push({r:nr,c:nc}); else { if (t.c !== side) moves.push({r:nr,c:nc}); break; } nr += dr; nc += dc; } } } if (p.t === 'k') for (let dr=-1; dr<=1; dr++) for (let dc=-1; dc<=1; dc++) if (dr || dc) add(r+dr, c+dc); return moves; }
function isSquareAttacked(board, r, c, bySide){ for (let sr=0; sr<8; sr++) for (let sc=0; sc<8; sc++) { const p = board[sr][sc]; if (p && p.c === bySide) { const mv = pseudoChessMoves(board, sr, sc, true); if (mv.some(m => m.r === r && m.c === c)) return true; } } return false; }
function legalChessMoves(board, r, c){ const p = board[r][c]; if (!p) return []; const side = p.c; return pseudoChessMoves(board, r, c, false).filter(m => { const test = cloneChessBoard(board); test[m.r][m.c] = test[r][c]; test[r][c] = null; if (test[m.r][m.c].t === 'p' && (m.r === 0 || m.r === 7)) test[m.r][m.c].t = 'q'; const king = findKing(test, side); if (!king) return false; return !isSquareAttacked(test, king[0], king[1], side === 'w' ? 'b' : 'w'); }); }
function updateChessStatus(g){ const side = g.turnSeat === 'A' ? 'w' : 'b'; const opp = side === 'w' ? 'b' : 'w'; let any = false; for (let r=0;r<8;r++) for (let c=0;c<8;c++) { const p = g.board[r][c]; if (p && p.c === side && legalChessMoves(g.board, r, c).length) any = true; } const king = findKing(g.board, side); const check = king ? isSquareAttacked(g.board, king[0], king[1], opp) : false; g.status = `${side === 'w' ? 'White' : 'Black'} to move${check ? ' — check' : ''}`; if (!any) { g.winner = check ? (opp === 'w' ? 'A' : 'B') : 'D'; g.gameOver = true; g.rematch = {A:false,B:false}; g.rematchStarter = g.winner === 'A' ? 'B' : g.winner === 'B' ? 'A' : 'A'; } }
function renderChess(){ const g = S.room.state; return `<div class="game-board-wrap"><div class="notice">${escapeHtml(g.status || '')}</div><div class="chess" style="grid-template-columns:repeat(8, 56px)">${g.board.flatMap((row,r)=>row.map((p,c)=>{ const dark = (r+c)%2===1; const sel = g.selected && g.selected[0]===r && g.selected[1]===c; const tgt = g.legal?.some(m => m.r===r && m.c===c); return `<button class="cell ${dark ? 'dark' : 'light'} ${sel ? 'selected' : ''} ${tgt ? 'target' : ''}" data-action="chess-cell" data-r="${r}" data-c="${c}">${p ? `<span class="piece ${p.c}">${PIECES[p.c][p.t]}</span>` : ''}</button>`; })).join('')}</div><div class="footer-note">This implementation supports legal movement and promotion. Castling and en passant are omitted to keep the app fully static and lightweight.</div></div>`; }
function chessMove(r,c){ const g = S.room.state; if (g.gameOver || g.turnSeat !== S.me) return; if (g.selected) { const [sr,sc] = g.selected; const move = g.legal.find(m => m.r===r && m.c===c); if (move) { g.board[r][c] = g.board[sr][sc]; g.board[sr][sc] = null; if (g.board[r][c].t === 'p' && (r === 0 || r === 7)) g.board[r][c].t = 'q'; g.turnSeat = otherSeat(g.turnSeat); g.selected = null; g.legal = []; updateChessStatus(g); saveRoomState().then(() => render()).catch(()=>{}); return; } } const p = g.board[r][c]; if (p && ((S.me === 'A' && p.c === 'w') || (S.me === 'B' && p.c === 'b'))) { g.selected = [r,c]; g.legal = legalChessMoves(g.board, r, c); render(); } }

function renderBattleship(){ const g = S.room.state; const me = S.me; const my = me ? g.sides[me] : null; const opp = otherSeat(me); const phaseText = g.gameOver ? (g.winner === 'D' ? 'Draw.' : `${seatName(g.winner)} wins.`) : (g.phase === 'battle' ? `Battle phase — ${seatName(g.turnSeat)} to move` : `Placement phase — ${seatName(me)} placing ships`); const viewGrid = g.phase === 'battle' ? g.sides[opp].board : my.board; const action = g.phase === 'battle' ? 'battle-fire' : 'battle-place'; return `<div class="game-board-wrap"><div class="notice">${phaseText}${g.phase !== 'battle' ? ` • Ship size: <strong>${g.shipSizes[g.shipIndex]}</strong> • Orientation: <strong>${g.orient}</strong>` : ''}</div><div class="toolbar">${g.phase !== 'battle' ? `<button class="btn" data-action="battle-orient">Toggle orientation</button>` : ''}</div><div class="battle" style="grid-template-columns:repeat(6, 56px)">${viewGrid.flatMap((row,r)=>row.map((v,c)=>{ const show = g.phase === 'battle' ? (g.sides[opp].shots[r][c] || '') : (my.board[r][c] === 'S' ? '■' : ''); return `<button class="cell ${(r+c)%2===1 ? 'dark' : 'light'}" data-action="${action}" data-r="${r}" data-c="${c}">${show || ''}</button>`; })).join('')}</div><div class="footer-note">Place three ships (sizes 3, 2, 2), then battle begins automatically.</div></div>`; }
function battleshipToggleOrient(){ S.room.state.orient = S.room.state.orient === 'H' ? 'V' : 'H'; render(); }
function battleshipPlace(r,c){ const g = S.room.state; if (g.gameOver || g.phase !== 'place' || g.turnSeat !== S.me) return; const sideKey = S.me; const side = g.sides[sideKey]; const size = g.shipSizes[g.shipIndex]; const coords = []; for (let i=0;i<size;i++) { const nr = r + (g.orient === 'V' ? i : 0); const nc = c + (g.orient === 'H' ? i : 0); if (!inside6(nr,nc)) return setStatus('Ship does not fit'); if (side.board[nr][nc]) return setStatus('Ships cannot overlap'); coords.push([nr,nc]); } coords.forEach(([nr,nc]) => side.board[nr][nc] = 'S'); side.ships.push(coords); g.shipIndex++; if (g.shipIndex >= g.shipSizes.length) { side.placed = true; g.shipIndex = 0; if (S.me === 'A') { g.turnSeat = 'B'; g.phase = 'placeB'; } else { g.turnSeat = 'A'; g.phase = 'battle'; } } saveRoomState().then(() => render()).catch(()=>{}); }
function battleshipFire(r,c){ const g = S.room.state; if (g.gameOver || g.phase !== 'battle' || g.turnSeat !== S.me) return; const me = S.me; const opp = otherSeat(me); const target = g.sides[opp]; const shots = g.sides[me].shots; if (shots[r][c]) return setStatus('Already fired there'); if (target.board[r][c] === 'S') { shots[r][c] = 'H'; target.board[r][c] = 'X'; if (target.board.flat().every(v => v !== 'S')) { g.winner = me; g.gameOver = true; g.rematch = {A:false,B:false}; g.rematchStarter = otherSeat(me); } else g.turnSeat = opp; setStatus('Hit'); } else { shots[r][c] = 'M'; g.turnSeat = opp; setStatus('Miss'); } saveRoomState().then(() => render()).catch(()=>{}); }

function renderEndcard(){
  const g = S.room.state;
  const winnerSeat = g.winner;
  const loserSeat = winnerSeat === 'A' ? 'B' : winnerSeat === 'B' ? 'A' : null;
  const meResult = winnerSeat === 'D' ? 'draw' : (winnerSeat === S.me ? 'win' : 'loss');
  return `<div class="overlay"><div class="box"><div class="kicker">Match finished</div><h3 style="margin:0 0 8px; font-size:1.5rem">${winnerSeat === 'D' ? 'Draw' : `${seatName(winnerSeat)} wins`}</h3><div class="muted small">${winnerSeat === 'D' ? 'No winner this round.' : `Winner: ${seatName(winnerSeat)} • Loser: ${seatName(loserSeat)} • Next round starts with the loser if both players vote yes.`}</div><div class="result-badges"><span class="result-badge ${meResult}">${winnerSeat === 'D' ? 'Draw' : (meResult === 'win' ? 'You won' : 'You lost')}</span><span class="result-badge ${g.rematch?.A ? 'win' : ''}">Player A vote: ${g.rematch?.A ? 'Yes' : 'No'}</span><span class="result-badge ${g.rematch?.B ? 'win' : ''}">Player B vote: ${g.rematch?.B ? 'Yes' : 'No'}</span></div><div class="hr"></div><div class="toolbar"><button class="btn good" data-action="vote-rematch">Vote to replay</button><button class="btn warn" data-action="clear-rematch">Clear my vote</button></div><div class="soft" style="margin-top:10px">${g.rematch?.A && g.rematch?.B ? `Both players voted. A new round will start now with ${seatName(g.rematchStarter)} going first.` : 'The room stays here until both players vote or the room goes inactive.'}</div></div></div>`;
}
function resetGameForRematch(){ const g = S.room.state; const starter = g.rematchStarter || 'A'; S.room.state = roomState(S.room.game, starter); S.room.state.rematch = {A:false, B:false}; S.room.state.rematchStarter = otherSeat(starter); }
async function voteRematch(vote){ if (!S.room || !S.me) return; const g = S.room.state; if (!g.gameOver) return; g.rematch[S.me] = vote; await saveRoomState().catch(()=>{}); if (g.rematch.A && g.rematch.B) { resetGameForRematch(); await saveRoomState().catch(()=>{}); await refreshRoom().catch(()=>{}); } render(); }

function renderRoom(){ const g = S.game; const header = `<div class="head"><div><h2>${gameLabel(g)}</h2><div class="sub">Live room: <strong>${S.room ? S.room.roomId : '...'}</strong></div></div><div class="toolbar"><button class="btn good" data-action="copy-link">Copy room link</button><button class="btn warn" data-action="new-room">New room</button></div></div>`; let body = ''; if (!S.room) body = `<div class="soft">Joining room…</div>`; else if (g === 'ttt') body = renderTTT(); else if (g === 'connect4') body = renderConnect4(); else if (g === 'checkers') body = renderCheckers(); else if (g === 'chess') body = renderChess(); else if (g === 'battleship') body = renderBattleship(); return `<div class="layout"><div class="main" style="position:relative">${S.room && S.room.state?.gameOver ? renderEndcard() : ''}${header}<div class="body">${body}</div></div>${sidePanel()}</div>`; }

function render(){ homeBtn.style.display = S.screen === 'home' ? 'none' : 'inline-flex'; app.innerHTML = S.screen === 'home' ? renderHome() : S.screen === 'solo' ? renderSolo() : renderRoom(); if (S.screen === 'solo' && S.game === 'sudoku' && S.solo.sudoku) { const diff = document.getElementById('soloDiff'); if (diff) diff.value = S.solo.sudoku.difficulty; } }

function renderChess(){ const g = S.room.state; return `<div class="game-board-wrap"><div class="notice">${escapeHtml(g.status || '')}</div><div class="chess" style="grid-template-columns:repeat(8, 56px)">${g.board.flatMap((row,r)=>row.map((p,c)=>{ const dark = (r+c)%2===1; const sel = g.selected && g.selected[0]===r && g.selected[1]===c; const tgt = g.legal?.some(m => m.r===r && m.c===c); return `<button class="cell ${dark ? 'dark' : 'light'} ${sel ? 'selected' : ''} ${tgt ? 'target' : ''}" data-action="chess-cell" data-r="${r}" data-c="${c}">${p ? `<span class="piece ${p.c}">${PIECES[p.c][p.t]}</span>` : ''}</button>`; })).join('')}</div><div class="footer-note">This implementation supports legal movement and promotion. Castling and en passant are omitted to keep the app fully static and lightweight.</div></div>`; }
function renderBattleship(){ const g = S.room.state; const me = S.me; const my = me ? g.sides[me] : null; const opp = otherSeat(me); const phaseText = g.gameOver ? (g.winner === 'D' ? 'Draw.' : `${seatName(g.winner)} wins.`) : (g.phase === 'battle' ? `Battle phase — ${seatName(g.turnSeat)} to move` : `Placement phase — ${seatName(me)} placing ships`); const viewGrid = g.phase === 'battle' ? g.sides[opp].board : my.board; const action = g.phase === 'battle' ? 'battle-fire' : 'battle-place'; return `<div class="game-board-wrap"><div class="notice">${phaseText}${g.phase !== 'battle' ? ` • Ship size: <strong>${g.shipSizes[g.shipIndex]}</strong> • Orientation: <strong>${g.orient}</strong>` : ''}</div><div class="toolbar">${g.phase !== 'battle' ? `<button class="btn" data-action="battle-orient">Toggle orientation</button>` : ''}</div><div class="battle" style="grid-template-columns:repeat(6, 56px)">${viewGrid.flatMap((row,r)=>row.map((v,c)=>{ const show = g.phase === 'battle' ? (g.sides[opp].shots[r][c] || '') : (my.board[r][c] === 'S' ? '■' : ''); return `<button class="cell ${(r+c)%2===1 ? 'dark' : 'light'}" data-action="${action}" data-r="${r}" data-c="${c}">${show || ''}</button>`; })).join('')}</div><div class="footer-note">Place three ships (sizes 3, 2, 2), then battle begins automatically.</div></div>`; }

function cardButton(action){ const map = { 'solo-sudoku':'sudoku', 'solo-wordle':'wordle', 'solo-crossword':'crossword', 'multi-ttt':'ttt', 'multi-connect4':'connect4', 'multi-checkers':'checkers', 'multi-chess':'chess', 'multi-battleship':'battleship' }; return map[action]; }

function restoreFromUrl(){ const roomId = qs('room'); const game = qs('game'); if (roomId && game) { S.screen = 'room'; S.game = game; setQuery({room:roomId, game}); joinRoom(roomId).catch(err => setStatus(err.message)); } }

function resetLocal(){ S.solo = { sudoku:null, wordle:null, crossword:null }; setStatus('Local progress reset'); render(); }

function maybeRejoin(){ const roomId = qs('room'); const game = qs('game'); if (roomId && game && !S.room) { S.screen = 'room'; S.game = game; render(); joinRoom(roomId).catch(err => setStatus(err.message)); } }

function handleClick(action, el){
  if (action === 'home') return goHome();
  if (action === 'reset-all') return resetLocal();
  if (action === 'copy-link') return copy(updateRoomLink());
  if (action === 'resume-room') { const roomId = qs('room'); const game = qs('game'); if (roomId && game) { S.screen = 'room'; S.game = game; render(); joinRoom(roomId).catch(err => setStatus(err.message)); } return; }
  if (action === 'refresh-room') return refreshRoom().catch(err => setStatus(err.message));
  if (action === 'solo-sudoku') return openSolo('sudoku');
  if (action === 'solo-wordle') return openSolo('wordle');
  if (action === 'solo-crossword') return openSolo('crossword');
  if (action === 'multi-ttt') return openMulti('ttt');
  if (action === 'multi-connect4') return openMulti('connect4');
  if (action === 'multi-checkers') return openMulti('checkers');
  if (action === 'multi-chess') return openMulti('chess');
  if (action === 'multi-battleship') return openMulti('battleship');
  if (action === 'new-room') return openMulti(S.game);
  if (action === 'new-solo') {
    const diff = document.getElementById('soloDiff')?.value || 'medium';
    if (S.game === 'sudoku') initSudoku(diff);
    if (S.game === 'wordle') initWordle(diff);
    if (S.game === 'crossword') initCrossword(Number(document.getElementById('crosswordPick')?.value || 0));
    render();
    return;
  }
  if (action === 'vote-rematch') return voteRematch(true);
  if (action === 'clear-rematch') return voteRematch(false);
  if (action === 'sudoku-cell') { if (!el.querySelector('input')) { S.solo.sudoku.selected = [Number(el.dataset.r), Number(el.dataset.c)]; render(); } return; }
  if (action === 'sudoku-num') { sudokuSet(...S.solo.sudoku.selected, el.dataset.n); return; }
  if (action === 'sudoku-clear') { sudokuSet(...S.solo.sudoku.selected, ''); return; }
  if (action === 'wordle-key') return wordleKey(el.dataset.ch);
  if (action === 'wordle-back') return wordleBack();
  if (action === 'wordle-enter') return wordleEnter();
  if (action === 'ttt-move') return tttMove(Number(el.dataset.i));
  if (action === 'connect-move') return connectMove(Number(el.dataset.col));
  if (action === 'checkers-cell') return checkersMove(Number(el.dataset.r), Number(el.dataset.c));
  if (action === 'chess-cell') return chessMove(Number(el.dataset.r), Number(el.dataset.c));
  if (action === 'battle-orient') return battleshipToggleOrient();
  if (action === 'battle-place') return battleshipPlace(Number(el.dataset.r), Number(el.dataset.c));
  if (action === 'battle-fire') return battleshipFire(Number(el.dataset.r), Number(el.dataset.c));
}

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  handleClick(el.dataset.action, el);
});

document.addEventListener('change', (e) => {
  const el = e.target;
  if (el.id === 'soloDiff' && S.screen === 'solo' && S.game === 'sudoku') { initSudoku(el.value); render(); }
  if (el.id === 'soloDiff' && S.screen === 'solo' && S.game === 'wordle') { initWordle(el.value); render(); }
  if (el.id === 'crosswordPick') { initCrossword(Number(el.value)); render(); }
  if (el.matches('input[data-action="crossword-cell"]')) { crosswordSet(Number(el.dataset.r), Number(el.dataset.c), el.value); }
});

document.addEventListener('input', (e) => {
  const el = e.target;
  if (el.matches('input[data-action="crossword-cell"]')) { crosswordSet(Number(el.dataset.r), Number(el.dataset.c), el.value); }
  if (el.matches('input[data-r][data-c]') && S.screen === 'solo' && S.game === 'sudoku') {
    const r = Number(el.dataset.r), c = Number(el.dataset.c);
    const v = el.value.replace(/[^1-9]/g,'').slice(0,1);
    sudokuSet(r,c,v);
  }
});

document.addEventListener('keydown', (e) => {
  if (S.screen === 'solo' && S.game === 'sudoku') {
    if (/^[1-9]$/.test(e.key)) { e.preventDefault(); sudokuSet(...S.solo.sudoku.selected, e.key); }
    if (e.key === 'Backspace' || e.key === 'Delete') { e.preventDefault(); sudokuSet(...S.solo.sudoku.selected, ''); }
    if (e.key === 'ArrowUp') { e.preventDefault(); sudokuMove('up'); }
    if (e.key === 'ArrowDown') { e.preventDefault(); sudokuMove('down'); }
    if (e.key === 'ArrowLeft') { e.preventDefault(); sudokuMove('left'); }
    if (e.key === 'ArrowRight') { e.preventDefault(); sudokuMove('right'); }
  }
  if (S.screen === 'solo' && S.game === 'wordle') {
    if (/^[a-zA-Z]$/.test(e.key)) { e.preventDefault(); wordleKey(e.key.toUpperCase()); }
    if (e.key === 'Backspace') { e.preventDefault(); wordleBack(); }
    if (e.key === 'Enter') { e.preventDefault(); wordleEnter(); }
  }
});

homeBtn.addEventListener('click', goHome);

function renderHome(){
  return `<div class="home-grid"><div class="hero"><div class="hero-inner"><div class="kicker">Free static front end + shared room backend</div><h2>One platform for solo puzzles and live turn-based rooms.</h2><p>Solo games run in the browser. Multiplayer rooms use a free shared backend so the board syncs automatically, turns are enforced, and nobody has to keep sending a fresh link after every move.</p><div class="toolbar" style="margin-top:16px"><button class="btn primary" data-action="resume-room">Resume room</button><button class="btn" data-action="reset-all">Reset local solo progress</button></div><div class="hr"></div><div class="notice">For multiplayer, deploy the Apps Script backend, paste its web app URL into CONFIG.backendUrl, then host this file on GitHub Pages.</div></div></div><div class="panel"><div class="panel-h"><div><div class="section-title">Game library</div><div class="muted small">Pick a solo puzzle or start a shared room</div></div></div><div class="panel-b"><div class="cards">${card('Solo','Sudoku','Choose easy, medium, or hard and fill the grid.','Start','solo-sudoku')}${card('Solo','Wordle','6 guesses with difficulty-based word pools.','Start','solo-wordle')}${card('Solo','Mini Crossword','Compact crossword-style board with clues.','Start','solo-crossword')}${card('Multiplayer','Tic-Tac-Toe','Fast room play with enforced turns.','Create room','multi-ttt')}${card('Multiplayer','Connect Four','Red and yellow chips, live sync.','Create room','multi-connect4')}${card('Multiplayer','Checkers','Turn-based board with captures.','Create room','multi-checkers')}${card('Multiplayer','Chess','Legal moves, highlights, and promotion.','Create room','multi-chess')}${card('Multiplayer','Battleship','Place ships, then fire in battle mode.','Create room','multi-battleship')}</div></div></div></div>`;
}

function renderRoom(){
  const g = S.game;
  const header = `<div class="head"><div><h2>${gameLabel(g)}</h2><div class="sub">Live room: <strong>${S.room ? S.room.roomId : '...'}</strong></div></div><div class="toolbar"><button class="btn good" data-action="copy-link">Copy room link</button><button class="btn warn" data-action="new-room">New room</button></div></div>`;
  let body = '';
  if (!S.room) body = `<div class="soft">Joining room…</div>`;
  else if (g === 'ttt') body = renderTTT();
  else if (g === 'connect4') body = renderConnect4();
  else if (g === 'checkers') body = renderCheckers();
  else if (g === 'chess') body = renderChess();
  else if (g === 'battleship') body = renderBattleship();
  return `<div class="layout"><div class="main" style="position:relative">${S.room && S.room.state?.gameOver ? renderEndcard() : ''}${header}<div class="body">${body}</div></div>${sidePanel()}</div>`;
}

function maybeRefreshAfterUpdate(){ if (S.room?.roomId) refreshRoom().catch(()=>{}); }

async function voteRematch(vote){
  if (!S.room || !S.me) return;
  const g = S.room.state;
  if (!g.gameOver) return;
  if (!g.rematch) g.rematch = { A:false, B:false };
  g.rematch[S.me] = vote;
  await saveRoomState().catch(()=>{});
  if (g.rematch.A && g.rematch.B) {
    const starter = g.rematchStarter || 'A';
    S.room.state = roomState(S.room.game, starter);
    S.room.state.rematch = { A:false, B:false };
    S.room.state.rematchStarter = otherSeat(starter);
    await saveRoomState().catch(()=>{});
    await refreshRoom().catch(()=>{});
  }
  render();
}

function updateRoomLink(){ return S.room ? `${location.origin}${location.pathname}?room=${encodeURIComponent(S.room.roomId)}&game=${encodeURIComponent(S.room.game)}` : location.href; }

function resetLocal(){ S.solo = { sudoku:null, wordle:null, crossword:null }; setStatus('Local progress reset'); render(); }

function renderRoomOrHome(){ render(); }

async function boot(){
  restoreFromUrl();
  const roomId = qs('room');
  const game = qs('game');
  if (roomId && game) {
    S.screen = 'room';
    S.game = game;
    render();
    try { await joinRoom(roomId); } catch (err) { setStatus(err.message); }
  } else {
    S.screen = 'home';
    render();
  }
  startPolling();
}

window.addEventListener('visibilitychange', () => { if (!document.hidden && S.room) refreshRoom().catch(()=>{}); });
window.addEventListener('load', boot);
</script>
</body>
</html>
