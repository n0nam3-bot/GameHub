<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Game Hub</title>
  <style>
    :root{
      --bg0:#070b14;
      --bg1:#0a1124;
      --bg2:#111c3a;
      --card:rgba(255,255,255,.07);
      --card2:rgba(255,255,255,.04);
      --line:rgba(255,255,255,.12);
      --line2:rgba(255,255,255,.18);
      --txt:#eef3ff;
      --muted:#aeb9e8;
      --accent:#7d9bff;
      --accent2:#7ce6b4;
      --warn:#ffd166;
      --danger:#ff7a93;
      --shadow:0 24px 70px rgba(0,0,0,.35);
      --shadow2:0 10px 30px rgba(0,0,0,.22);
      --r:22px;
      --r2:16px;
      --cell:44px;
      color-scheme: dark;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color:var(--txt);
      background:
        radial-gradient(circle at 10% 10%, rgba(125,155,255,.22), transparent 30%),
        radial-gradient(circle at 90% 0%, rgba(124,230,180,.14), transparent 28%),
        radial-gradient(circle at 50% 110%, rgba(255,209,102,.08), transparent 30%),
        linear-gradient(180deg, var(--bg0), var(--bg1) 44%, var(--bg0));
      overflow-x:hidden;
    }
    body::before{
      content:"";
      position:fixed; inset:-40%;
      background:
        linear-gradient(115deg, transparent 0 48%, rgba(255,255,255,.02) 50%, transparent 52%),
        linear-gradient(25deg, transparent 0 45%, rgba(255,255,255,.02) 50%, transparent 55%);
      transform:rotate(-8deg);
      animation: drift 18s linear infinite;
      pointer-events:none;
      opacity:.55;
    }
    @keyframes drift{ from{transform:translateX(-4%) rotate(-8deg)} to{transform:translateX(4%) rotate(-8deg)} }
    .app{position:relative; z-index:1; max-width:1460px; margin:0 auto; padding:18px;}
    .top{
      display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;
      margin-bottom:18px;
    }
    .brand{
      display:flex; align-items:center; gap:14px;
    }
    .mark{
      width:52px; height:52px; border-radius:16px;
      background: linear-gradient(135deg, rgba(125,155,255,1), rgba(124,230,180,1));
      color:#06111b; font-weight:900; display:grid; place-items:center;
      box-shadow: var(--shadow2);
    }
    .brand h1{margin:0; font-size:1.2rem; letter-spacing:.02em}
    .brand p{margin:3px 0 0; color:var(--muted); font-size:.92rem}
    .top-actions{display:flex; gap:10px; align-items:center; flex-wrap:wrap}
    .pill,.btn,.tab,.field,.select,.badge{
      border-radius:14px;
      border:1px solid var(--line);
      background:rgba(255,255,255,.06);
      color:var(--txt);
    }
    .pill{
      padding:10px 14px; color:#dfe7ff; background:rgba(255,255,255,.04);
    }
    .btn,.tab{
      padding:11px 14px;
      cursor:pointer;
      transition:transform .15s ease, background .15s ease, border-color .15s ease, box-shadow .15s ease;
      box-shadow: none;
    }
    .btn:hover,.tab:hover{transform:translateY(-1px); border-color:var(--line2)}
    .btn.primary{
      background:linear-gradient(135deg, rgba(125,155,255,.95), rgba(117,135,255,.9));
      border-color:rgba(125,155,255,.45);
      box-shadow: 0 12px 30px rgba(125,155,255,.15);
      font-weight:700;
    }
    .btn.good{
      background:linear-gradient(135deg, rgba(124,230,180,.16), rgba(124,230,180,.07));
      border-color:rgba(124,230,180,.28);
    }
    .btn.warn{
      background:linear-gradient(135deg, rgba(255,209,102,.12), rgba(255,209,102,.06));
      border-color:rgba(255,209,102,.25);
    }
    .btn.danger{
      background:linear-gradient(135deg, rgba(255,122,147,.12), rgba(255,122,147,.06));
      border-color:rgba(255,122,147,.25);
    }
    .field,.select{
      padding:11px 12px;
      min-width:0;
      outline:none;
    }
    .field:focus,.select:focus{border-color:rgba(125,155,255,.5); box-shadow:0 0 0 3px rgba(125,155,255,.14)}
    .hero{
      border:1px solid var(--line);
      border-radius: 28px;
      box-shadow: var(--shadow);
      overflow:hidden;
      background:
        radial-gradient(circle at 5% 10%, rgba(125,155,255,.16), transparent 22%),
        radial-gradient(circle at 80% 0%, rgba(124,230,180,.16), transparent 24%),
        linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.03));
    }
    .hero-inner{padding:24px}
    .hero h2{margin:0 0 10px; font-size: clamp(1.8rem, 3vw, 3.35rem); line-height:1.02}
    .hero p{margin:0; color:var(--muted); max-width:75ch; line-height:1.55}
    .hero-grid{
      display:grid; grid-template-columns: 1.15fr .85fr; gap:18px; margin-top:18px;
    }
    .panel{
      border:1px solid var(--line);
      border-radius: var(--r);
      background: linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.03));
      box-shadow: var(--shadow2);
      overflow:hidden;
    }
    .panel-h{
      padding:16px 16px 0;
      display:flex; align-items:flex-end; justify-content:space-between; gap:12px; flex-wrap:wrap;
    }
    .panel-b{padding:16px}
    .kicker{
      display:inline-flex; gap:8px; align-items:center;
      padding:8px 11px; border-radius:999px; margin-bottom:12px;
      background:rgba(125,155,255,.12); border:1px solid rgba(125,155,255,.25); color:#dfe7ff;
      font-size:.84rem;
    }
    .section-title{
      margin:0 0 12px; font-size: .95rem; letter-spacing:.12em; text-transform:uppercase; color:#d9e1ff;
    }
    .grid{
      display:grid; gap:14px;
    }
    .cards{grid-template-columns: repeat(2, minmax(0,1fr));}
    .card{
      position:relative; overflow:hidden;
      padding:16px; min-height:158px;
      border-radius:22px; border:1px solid var(--line);
      background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.03));
      transition: transform .16s ease, border-color .16s ease, background .16s ease;
    }
    .card:hover{transform:translateY(-2px); border-color:rgba(125,155,255,.28)}
    .card h3{margin:10px 0 8px; font-size:1.06rem}
    .card p{margin:0; color:var(--muted); line-height:1.5; font-size:.95rem}
    .card .row{margin-top:14px; display:flex; gap:8px; flex-wrap:wrap}
    .badge{display:inline-flex; align-items:center; gap:6px; padding:7px 10px; font-size:.8rem}
    .badge.solo{background:rgba(255,209,102,.12); border-color:rgba(255,209,102,.24)}
    .badge.multi{background:rgba(124,230,180,.12); border-color:rgba(124,230,180,.22)}
    .badge.room{background:rgba(125,155,255,.12); border-color:rgba(125,155,255,.25)}
    .layout{display:grid; grid-template-columns: 1fr 330px; gap:18px; margin-top:18px}
    .main, .side{
      border:1px solid var(--line);
      border-radius: 24px;
      background: linear-gradient(180deg, rgba(255,255,255,.055), rgba(255,255,255,.03));
      box-shadow: var(--shadow2);
      overflow:hidden;
    }
    .main{min-height:720px}
    .head{
      display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; align-items:center;
      padding:16px 18px; border-bottom:1px solid var(--line);
      background: linear-gradient(180deg, rgba(255,255,255,.04), transparent);
    }
    .head h2{margin:0; font-size:1.2rem}
    .head .sub{margin-top:4px; color:var(--muted); font-size:.92rem}
    .body{padding:18px}
    .toolbar{display:flex; gap:10px; flex-wrap:wrap; align-items:center}
    .stack{display:flex; flex-direction:column; gap:10px}
    .notice{
      padding:12px 14px; border-radius:16px;
      border:1px solid rgba(255,209,102,.24);
      background: rgba(255,209,102,.08);
      color:#ffe8b0; line-height:1.45;
    }
    .soft{
      padding:12px 14px; border-radius:16px;
      border:1px solid var(--line);
      background:rgba(255,255,255,.04);
      color:var(--muted); line-height:1.5;
    }
    .hr{height:1px; background:var(--line); margin:12px 0}
    .muted{color:var(--muted)}
    .small{font-size:.92rem}
    .game-board-wrap{display:flex; flex-direction:column; gap:14px}
    .board{display:grid; gap:0; width:fit-content; user-select:none}
    .cell{
      border:1px solid rgba(255,255,255,.08);
      background:rgba(255,255,255,.04);
      color:var(--txt);
      display:grid; place-items:center;
      padding:0;
      transition:transform .12s ease, background .12s ease, border-color .12s ease;
    }
    .cell:hover{transform:translateY(-1px); border-color:rgba(125,155,255,.3)}
    .cell.dark{background:rgba(255,255,255,.08)}
    .cell.light{background:rgba(255,255,255,.03)}
    .cell.selected{outline:2px solid rgba(125,155,255,.95); outline-offset:-2px}
    .cell.target{background:rgba(124,230,180,.14)}
    .cell.hint{background:rgba(255,209,102,.12)}
    .cell.block{background:rgba(255,255,255,.08)}
    .cell.input{font-size:1rem}
    .cell.input input{
      width:100%; height:100%; border:0; background:transparent; color:var(--txt);
      text-align:center; font-weight:800; font-size:1rem; text-transform:uppercase;
    }
    .cell.input input:focus{outline:none}
    .sudoku-grid{grid-template-columns: repeat(9, var(--cell))}
    .sudoku-grid .cell:nth-child(3n){border-right-color:rgba(255,255,255,.3)}
    .sudoku-grid .cell:nth-child(n+19):nth-child(-n+27),
    .sudoku-grid .cell:nth-child(n+46):nth-child(-n+54){border-bottom-color:rgba(255,255,255,.3)}
    .word-grid{display:grid; grid-template-rows: repeat(6, 1fr); gap:8px}
    .guess-row{display:grid; grid-template-columns: repeat(5, 54px); gap:8px}
    .letter{
      width:54px; height:54px; border-radius:14px;
      border:1px solid var(--line); background:rgba(255,255,255,.04);
      display:grid; place-items:center; font-size:1.15rem; font-weight:900;
      transition:transform .14s ease, background .14s ease;
    }
    .letter.green{background:rgba(124,230,180,.18); border-color:rgba(124,230,180,.4)}
    .letter.gold{background:rgba(255,209,102,.16); border-color:rgba(255,209,102,.42)}
    .letter.gray{background:rgba(255,255,255,.07); color:#d5dbef}
    .kbd{
      display:grid; grid-template-columns: repeat(10, minmax(0,1fr)); gap:6px; max-width:720px;
    }
    .kbd button{min-height:40px; padding:0}
    .crossword{
      display:grid; gap:6px; width:fit-content;
      padding:4px 0 10px;
    }
    .crossword .cell{width:42px; height:42px; border-radius:11px}
    .crossword .cell input{font-size:1rem}
    .clues{display:grid; grid-template-columns:1fr 1fr; gap:12px}
    .clue{
      border:1px solid var(--line); border-radius:18px; padding:12px;
      background:rgba(255,255,255,.04)
    }
    .clue h4{margin:0 0 8px}
    .clue ol{margin:0; padding-left:20px; color:var(--muted); line-height:1.5}
    .tic{display:grid; grid-template-columns: repeat(3, 94px); gap:10px}
    .tic .cell{width:94px; height:94px; border-radius:18px; font-size:2rem; font-weight:900}
    .connect{
      display:grid; grid-template-columns: repeat(7, 62px); gap:8px;
      background: rgba(15,22,44,.7);
      border:1px solid var(--line);
      padding:10px; border-radius:18px; width:fit-content
    }
    .connect .slot{
      width:62px; height:62px; border-radius:999px;
      border:1px solid rgba(255,255,255,.08);
      background:rgba(255,255,255,.05);
      display:grid; place-items:center; font-size:1.8rem; font-weight:900
    }
    .checkers,.chess,.battle{
      display:grid; width:fit-content; border:1px solid var(--line);
      border-radius:18px; overflow:hidden;
    }
    .checkers .cell,.chess .cell,.battle .cell{width:56px; height:56px; border-radius:0}
    .piece{display:grid; place-items:center; width:100%; height:100%; font-size:1.75rem; line-height:1}
    .piece.red{color:#ff7a93}
    .piece.black{color:#e8eeff}
    .piece.w{color:#eef2ff}
    .piece.b{color:#ff7a93}
    .side{padding:16px; display:flex; flex-direction:column; gap:10px}
    .side .cardish{
      border:1px solid var(--line); border-radius:18px; padding:12px;
      background:rgba(255,255,255,.04)
    }
    .room-link{
      width:100%;
      padding:11px 12px; border-radius:14px;
      border:1px solid var(--line); background:rgba(255,255,255,.05); color:var(--txt)
    }
    .room-status{
      display:flex; gap:8px; flex-wrap:wrap; align-items:center;
    }
    .seat{
      display:inline-flex; align-items:center; gap:6px;
      padding:7px 10px; border-radius:999px;
      background:rgba(125,155,255,.12); border:1px solid rgba(125,155,255,.25)
    }
    .seat.good{background:rgba(124,230,180,.12); border-color:rgba(124,230,180,.25)}
    .seat.warn{background:rgba(255,209,102,.12); border-color:rgba(255,209,102,.25)}
    .seat.bad{background:rgba(255,122,147,.12); border-color:rgba(255,122,147,.25)}
    .overlay{
      position:absolute; inset:0; display:grid; place-items:center;
      background:linear-gradient(180deg, rgba(7,11,20,.42), rgba(7,11,20,.72));
      backdrop-filter: blur(4px);
      z-index:5; border-radius: 24px;
    }
    .overlay .box{
      min-width:min(92%, 380px);
      max-width:92%;
      border-radius:22px;
      background:rgba(15,22,44,.92);
      border:1px solid rgba(255,255,255,.12);
      padding:18px;
      box-shadow: var(--shadow)
    }
    .fade{animation: fadeIn .22s ease}
    @keyframes fadeIn{from{opacity:0; transform:translateY(6px)}to{opacity:1; transform:translateY(0)}}
    .pulse{animation:pulse 2.5s ease-in-out infinite}
    @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(125,155,255,.1)}50%{box-shadow:0 0 0 10px rgba(125,155,255,0)}}
    .home-grid{display:grid; grid-template-columns: 1.08fr .92fr; gap:18px}
    @media (max-width: 1100px){
      .layout,.home-grid,.hero-grid{grid-template-columns:1fr}
      .main{min-height:auto}
    }
    @media (max-width: 720px){
      :root{--cell:36px}
      .cards,.clues{grid-template-columns:1fr}
      .guess-row{grid-template-columns:repeat(5, 48px)}
      .letter{width:48px; height:48px}
      .tic{grid-template-columns:repeat(3, 78px)}
      .tic .cell{width:78px;height:78px}
      .connect{grid-template-columns:repeat(7,48px)}
      .connect .slot{width:48px;height:48px}
      .checkers .cell,.chess .cell,.battle .cell{width:42px;height:42px}
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="top">
      <div class="brand">
        <div class="mark">AH</div>
        <div>
          <h1>Game Hub</h1>
          <p>GitHub Pages front end with free shared rooms and turn enforcement</p>
        </div>
      </div>
      <div class="top-actions">
        <span id="status" class="pill">Ready</span>
        <button id="homeBtn" class="btn" style="display:none">Home</button>
      </div>
    </div>

    <div id="app"></div>
  </div>

<script>
const CONFIG = {
  backendUrl: "https://script.google.com/macros/s/AKfycby2U1FkwT81mcVy4w2XFDqlnOdylL8PfDDJUrkj9UjeMnOgxf41MMb9pWrz4e3innYp/exec"
};

const SOLO_WORDS = {
  easy: ['PLANE','TRAIN','APPLE','STONE','GRASS','BREAD','SHORE','SMILE','CLOUD','WATER'],
  medium: ['CIPHER','PLANET','POCKET','MOTION','RIDDLE','ORANGE','MARKET','SPRING','VELVET','SHADOW'],
  hard: ['QUARTZ','JUNGLE','MURKY','EXHALE','VYING','OBJECT','WIZARD','TROPHY','PYTHON','TANGLE']
};

const CROSSWORDS = [
  {
    name: 'City & Nature',
    grid: [
      ['C','L','O','U','D'],
      ['A',null,'R',null,'R'],
      ['N','E','S','T',null],
      ['D',null,'T',null,'A'],
      ['Y','A','R','D','S']
    ],
    clues: {
      across: ['White thing in the sky after rain (5)','Bird home (4)','Outdoor space around a house (5)'],
      down: ['Sweet treat / candy land (5)','Opposite of up, in some contexts (5)','To support or hold (5)']
    }
  },
  {
    name: 'Everyday Mix',
    grid: [
      ['S','T','A','R',null],
      ['T',null,'O',null,'P'],
      ['O','N','E',null,'E'],
      [null,null,'N',null,'A'],
      ['R','A','I','N',null]
    ],
    clues: {
      across: ['Shines in the night sky (4)','The number before two (3)','Weather from the clouds (4)'],
      down: ['A dramatic water body clue (5)','To move downward or to the side (4)','The center of a target (4)']
    }
  }
];

const PIECES = { w:{k:'♔', q:'♕', r:'♖', b:'♗', n:'♘', p:'♙'}, b:{k:'♚', q:'♛', r:'♜', b:'♝', n:'♞', p:'♟'} };
const app = document.getElementById('app');
const statusEl = document.getElementById('status');
const homeBtn = document.getElementById('homeBtn');

const S = {
  screen: 'home',
  game: null,
  mode: null,
  solo: { sudoku:null, wordle:null, crossword:null },
  room: null,
  me: null,
  token: null,
  pollTimer: null,
  busy: false
};

function setStatus(msg){ statusEl.textContent = msg || 'Ready'; }

function escapeHtml(str){
  return String(str)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function uid(prefix='room'){
  return prefix + '-' + Math.random().toString(36).slice(2,8) + Date.now().toString(36).slice(-4);
}

function copy(text){
  return navigator.clipboard.writeText(text).then(() => setStatus('Copied')).catch(() => setStatus('Copy failed'));
}

function qs(name){
  return new URLSearchParams(location.search).get(name);
}

function setQuery(params){
  const u = new URL(location.href);
  Object.entries(params).forEach(([k,v]) => {
    if (v === null || v === undefined || v === '') u.searchParams.delete(k);
    else u.searchParams.set(k, v);
  });
  history.replaceState({}, '', u.toString());
}

function api(params){
  return new Promise((resolve, reject) => {
    if (!CONFIG.backendUrl || CONFIG.backendUrl.includes('PASTE_YOUR_APPS_SCRIPT_WEB_APP_URL_HERE')) {
      reject(new Error('Set the Apps Script web app URL in CONFIG.backendUrl.'));
      return;
    }
    const cb = '__ah_' + Math.random().toString(36).slice(2);
    const s = document.createElement('script');
    const url = new URL(CONFIG.backendUrl);
    Object.entries(params).forEach(([k,v]) => url.searchParams.set(k, typeof v === 'string' ? v : JSON.stringify(v)));
    url.searchParams.set('callback', cb);
    window[cb] = (data) => {
      cleanup();
      resolve(data);
    };
    function cleanup(){
      delete window[cb];
      if (s.parentNode) s.parentNode.removeChild(s);
    }
    s.onerror = () => { cleanup(); reject(new Error('Network request failed')); };
    s.src = url.toString();
    document.head.appendChild(s);
    setTimeout(() => {
      if (window[cb]) { cleanup(); reject(new Error('Request timed out')); }
    }, 12000);
  });
}

function roomLink(roomId){
  const u = new URL(location.href);
  u.searchParams.set('room', roomId);
  return u.toString();
}

function mySeatLabel(){ return S.me === 'A' ? 'Player A' : S.me === 'B' ? 'Player B' : 'Spectator'; }

function currentRoleBadge(){
  if (!S.room) return '';
  const mine = S.me ? `<span class="seat good">${mySeatLabel()}</span>` : `<span class="seat warn">Joining</span>`;
  const turn = S.room.state?.turnSeat ? `<span class="seat">${S.room.state.turnSeat === 'A' ? 'Turn: Player A' : 'Turn: Player B'}</span>` : '';
  const game = `<span class="seat">${gameLabel(S.room.game)}</span>`;
  return mine + turn + game;
}

function gameLabel(game){
  return ({
    sudoku:'Sudoku', wordle:'Wordle', crossword:'Crossword', ttt:'Tic-Tac-Toe',
    connect4:'Connect Four', checkers:'Checkers', chess:'Chess', battleship:'Battleship'
  })[game] || 'Game';
}

function soloPuzzleLabel(game){
  return ({
    sudoku:'Logic grid',
    wordle:'Word game',
    crossword:'Mini crossword'
  })[game] || 'Solo game';
}

function inside(r,c){ return r>=0 && c>=0 && r<8 && c<8; }
function inside6(r,c){ return r>=0 && c>=0 && r<6 && c<6; }

function shuffle(arr){
  const a = arr.slice();
  for (let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
function choice(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

function makeSudoku(){
  const base = 3, side = 9;
  const pattern = (r,c) => (base * (r % base) + Math.floor(r / base) + c) % side;
  const rBase = [0,1,2];
  const rows = shuffle(rBase).flatMap(g => shuffle(rBase).map(r => g*base+r));
  const cols = shuffle(rBase).flatMap(g => shuffle(rBase).map(c => g*base+c));
  const nums = shuffle([1,2,3,4,5,6,7,8,9]);
  return Array.from({length:side}, (_, r) => Array.from({length:side}, (_, c) => nums[pattern(rows[r], cols[c])]));
}

function initSudoku(difficulty='medium'){
  const solution = makeSudoku();
  const holes = { easy: 34, medium: 44, hard: 52 }[difficulty] ?? 44;
  const board = solution.map(row => row.slice());
  shuffle([...Array(81).keys()]).slice(0, holes).forEach(i => board[Math.floor(i/9)][i%9] = null);
  S.solo.sudoku = {
    difficulty, solution, board,
    fixed: board.map(row => row.map(v => v !== null)),
    selected: [0,0],
    complete: false
  };
}

function tttState(){ return { board:Array(9).fill(''), turnSeat:'A', winner:null, gameOver:false }; }
function connectState(){ return { board:Array.from({length:6},()=>Array(7).fill('')), turnSeat:'A', winner:null, gameOver:false }; }
function checkersState(){
  const board = Array.from({length:8},()=>Array(8).fill(null));
  for(let r=0;r<3;r++) for(let c=0;c<8;c++) if((r+c)%2===1) board[r][c]='b';
  for(let r=5;r<8;r++) for(let c=0;c<8;c++) if((r+c)%2===1) board[r][c]='r';
  return { board, turnSeat:'A', selected:null, winner:null, gameOver:false, forcedCapture:false };
}
function chessState(){
  const back = ['r','n','b','q','k','b','n','r'];
  const board = Array.from({length:8},()=>Array(8).fill(null));
  for(let c=0;c<8;c++){
    board[0][c] = {t:back[c], c:'b'};
    board[1][c] = {t:'p', c:'b'};
    board[6][c] = {t:'p', c:'w'};
    board[7][c] = {t:back[c], c:'w'};
  }
  return { board, turnSeat:'A', selected:null, legal:[], winner:null, gameOver:false, status:'White to move' };
}
function battleshipState(){
  const side = () => ({ board:Array.from({length:6},()=>Array(6).fill('')), shots:Array.from({length:6},()=>Array(6).fill('')), ships:[], placed:false });
  return {
    phase:'placeA',
    turnSeat:'A',
    orient:'H',
    shipSizes:[3,2,2],
    shipIndex:0,
    sides:{A:side(), B:side()},
    winner:null,
    gameOver:false
  };
}

function roomInitialState(game){
  if (game==='ttt') return tttState();
  if (game==='connect4') return connectState();
  if (game==='checkers') return checkersState();
  if (game==='chess') return chessState();
  if (game==='battleship') return battleshipState();
  return {turnSeat:'A'};
}

async function createRoom(game){
  const res = await api({action:'createRoom', game, state: JSON.stringify(roomInitialState(game))});
  if (!res.ok) throw new Error(res.error || 'Create room failed');
  S.room = res.room;
  S.me = res.seat || 'A';
  S.token = res.token;
  localStorage.setItem(`ah_token_${S.room.roomId}`, S.token);
  localStorage.setItem(`ah_name_${S.room.roomId}`, S.room.players?.[S.me]?.name || '');
  setQuery({room:S.room.roomId, game:S.room.game, mode:'multi'});
  attachRoomFromState();
  startPolling();
  render();
}

async function joinRoom(roomId){
  const cached = localStorage.getItem(`ah_token_${roomId}`);
  const name = localStorage.getItem('ah_name_pref') || 'Player';
  const res = await api({action:'joinRoom', roomId, token: cached || '', name});
  if (!res.ok) throw new Error(res.error || 'Join failed');
  S.room = res.room;
  S.me = res.seat || null;
  S.token = res.token || cached || null;
  if (S.token) localStorage.setItem(`ah_token_${roomId}`, S.token);
  startPolling();
  render();
}

async function refreshRoom(){
  if (!S.room || !S.room.roomId) return;
  const res = await api({action:'getRoom', roomId:S.room.roomId, token:S.token || ''});
  if (!res.ok) throw new Error(res.error || 'Fetch failed');
  S.room = res.room;
  if (res.seat) S.me = res.seat;
  render();
}

async function saveRoomState(){
  if (!S.room || !S.room.roomId || !S.token) return;
  if (S.room.state?.gameOver) return;
  const res = await api({action:'saveState', roomId:S.room.roomId, token:S.token, state: JSON.stringify(S.room.state)});
  if (!res.ok) {
    setStatus(res.error || 'Move rejected');
    await refreshRoom().catch(()=>{});
    return false;
  }
  S.room = res.room;
  return true;
}

function startPolling(){
  stopPolling();
  S.pollTimer = setInterval(() => {
    if (document.hidden) return;
    if (S.room && S.room.roomId) refreshRoom().catch(()=>{});
  }, 2200);
}

function stopPolling(){
  if (S.pollTimer) clearInterval(S.pollTimer);
  S.pollTimer = null;
}

function goHome(){
  S.screen = 'home'; S.game = null; S.room = null; S.me = null; S.token = null;
  stopPolling();
  setQuery({room:'', game:'', mode:''});
  render();
}

function openLocalOrRoom(game, multiplayer=false){
  if (!multiplayer) return initLocalSolo(game);
  S.screen = 'room';

  const roomId = qs('room');
  if (roomId) {
    joinRoom(roomId).catch(err => { setStatus(err.message); render(); });

function handleCreateRoom(game){

function clone(obj){ return JSON.parse(JSON.stringify(obj)); }

function isWinnerLine(board, line){
  const [a,b,c] = line;
  return board[a] && board[a] === board[b] && board[a] === board[c];
}

function updateTtt(winOnly=false){
  const g = S.room.state;
  const lines = [
    [0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]
  ];
  const win = lines.find(l => isWinnerLine(g.board, l));
  if (win) { g.winner = g.turnSeat; g.gameOver = true; }
  else if (g.board.every(Boolean)) { g.winner = 'D'; g.gameOver = true; }
  else g.turnSeat = g.turnSeat === 'A' ? 'B' : 'A';
}

function tttMove(i){
  const g = S.room.state;
  if (g.gameOver || g.board[i] || g.turnSeat !== S.me) return;
  g.board[i] = S.me === 'A' ? 'X' : 'O';
  updateTtt();
  saveRoomState();
  render();
}

function connectWinner(board, r, c, p){
  const dirs = [[1,0],[0,1],[1,1],[1,-1]];
  for (const [dr,dc] of dirs){
    let count = 1;
    for (const sgn of [1,-1]){
      let nr = r + dr*sgn, nc = c + dc*sgn;
      while (board[nr] && board[nr][nc] === p) { count++; nr += dr*sgn; nc += dc*sgn; }
    }
    if (count >= 4) return true;
  }
  return false;
}

function connectMove(col){
  const g = S.room.state;
  if (g.gameOver || g.turnSeat !== S.me) return;
  for(let r=5;r>=0;r--){
    if(!g.board[r][col]){
      g.board[r][col] = g.turnSeat === 'A' ? 'R' : 'Y';
      if (connectWinner(g.board, r, col, g.board[r][col])) { g.winner = g.turnSeat; g.gameOver = true; }
      else if (g.board.every(row => row.every(Boolean))) { g.winner = 'D'; g.gameOver = true; }
      else g.turnSeat = g.turnSeat === 'A' ? 'B' : 'A';
      saveRoomState();
      render();
      return;
    }
  }
}

function pieceSide(piece){ return piece?.toLowerCase() === 'r' ? 'r' : piece?.toLowerCase() === 'b' ? 'b' : null; }
function pieceIsKing(piece){ return piece === piece?.toUpperCase() && piece; }
function checkersMovesFor(board, r, c){
  const p = board[r][c];
  if (!p) return [];
  const side = pieceSide(p);
  const dirs = [];
  if (p === 'r' || p === 'R') dirs.push([-1,-1],[-1,1]);
  if (p === 'b' || p === 'B') dirs.push([1,-1],[1,1]);
  if (p === 'R') dirs.push([1,-1],[1,1]);
  if (p === 'B') dirs.push([-1,-1],[-1,1]);
  const out = [];
  for (const [dr,dc] of dirs){
    const nr = r+dr, nc = c+dc;
    const jr = r+dr*2, jc = c+dc*2;
    if (inside(nr,nc) && !board[nr][nc]) out.push({r:nr,c:nc,capture:null});
    if (inside(jr,jc) && board[nr][nc] && pieceSide(board[nr][nc]) !== side && !board[jr][jc]) out.push({r:jr,c:jc,capture:[nr,nc]});
  }
  return out;
}

function checkersMove(r,c){
  const g = S.room.state;
  if (g.gameOver || g.turnSeat !== S.me) return;
  const piece = g.board[r][c];
  if (g.selected){
    const [sr,sc] = g.selected;
    const move = checkersMovesFor(g.board, sr, sc).find(m => m.r===r && m.c===c);
    if (move){
      g.board[r][c] = g.board[sr][sc];
      g.board[sr][sc] = null;
      if (move.capture) g.board[move.capture[0]][move.capture[1]] = null;
      if (g.board[r][c] === 'r' && r === 0) g.board[r][c] = 'R';
      if (g.board[r][c] === 'b' && r === 7) g.board[r][c] = 'B';
      const meSide = pieceSide(g.board[r][c]);
      const moreCap = move.capture ? checkersMovesFor(g.board, r, c).some(m => m.capture) : false;
      if (moreCap) {
        g.selected = [r,c];
      } else {
        g.selected = null;
        g.turnSeat = g.turnSeat === 'A' ? 'B' : 'A';
      }
      const all = g.board.flat();
      const oppSide = meSide === 'r' ? 'b' : 'r';
      if (!all.some(p => p && pieceSide(p) === oppSide)) { g.winner = S.me; g.gameOver = true; }
      saveRoomState(); render(); return;
    }
  }
  if (piece && ((S.me === 'A' && pieceSide(piece) === 'r') || (S.me === 'B' && pieceSide(piece) === 'b'))) {
    g.selected = [r,c];
    render();
  }
}

function cloneChessBoard(board){ return board.map(row => row.map(p => p ? {t:p.t,c:p.c} : null)); }
function findKing(board, side){
  for(let r=0;r<8;r++) for(let c=0;c<8;c++){
    const p = board[r][c];
    if (p && p.t==='k' && p.c===side) return [r,c];
  }
  return null;
}
function pseudoChessMoves(board, r, c, attackOnly=false){
  const p = board[r][c];
  if (!p) return [];
  const side = p.c;
  const add = (nr,nc, captureOk=true) => {
    if (!inside(nr,nc)) return;
    const t = board[nr][nc];
    if (!t) moves.push({r:nr,c:nc});
    else if (captureOk && t.c !== side) moves.push({r:nr,c:nc});
  };
  const moves = [];
  if (p.t === 'p'){
    const dir = side === 'w' ? -1 : 1;
    const start = side === 'w' ? 6 : 1;
    if (!attackOnly && !board[r+dir]?.[c]) add(r+dir,c,false);
    if (!attackOnly && r === start && !board[r+dir]?.[c] && !board[r+dir*2]?.[c]) moves.push({r:r+dir*2,c});
    for(const dc of [-1,1]){
      const nr=r+dir, nc=c+dc;
      if (!inside(nr,nc)) continue;
      const t = board[nr][nc];
      if (attackOnly) moves.push({r:nr,c:nc});
      else if (t && t.c !== side) moves.push({r:nr,c:nc});
    }
  }
  if (p.t === 'n'){
    [[1,2],[2,1],[-1,2],[-2,1],[1,-2],[2,-1],[-1,-2],[-2,-1]].forEach(([dr,dc])=>add(r+dr,c+dc));
  }
  if (p.t === 'b' || p.t === 'r' || p.t === 'q'){
    const dirs = [];
    if (p.t === 'b' || p.t === 'q') dirs.push([1,1],[1,-1],[-1,1],[-1,-1]);
    if (p.t === 'r' || p.t === 'q') dirs.push([1,0],[-1,0],[0,1],[0,-1]);
    for(const [dr,dc] of dirs){
      let nr=r+dr, nc=c+dc;
      while(inside(nr,nc)){
        const t=board[nr][nc];
        if(!t) moves.push({r:nr,c:nc});
        else { if(t.c!==side) moves.push({r:nr,c:nc}); break; }
        nr += dr; nc += dc;
      }
    }
  }
  if (p.t === 'k'){
    for(let dr=-1;dr<=1;dr++) for(let dc=-1;dc<=1;dc++) if(dr||dc) add(r+dr,c+dc);
  }
  return moves;
}
function isSquareAttacked(board, r, c, bySide){
  for(let sr=0; sr<8; sr++) for(let sc=0; sc<8; sc++){
    const p = board[sr][sc];
    if (p && p.c === bySide){
      const mv = pseudoChessMoves(board, sr, sc, true);
      if (mv.some(m => m.r===r && m.c===c)) return true;
    }
  }
  return false;
}
function legalChessMoves(board, r, c){
  const p = board[r][c];
  if (!p) return [];
  const side = p.c;
  return pseudoChessMoves(board, r, c, false).filter(m => {
    const test = cloneChessBoard(board);
    test[m.r][m.c] = test[r][c];
    test[r][c] = null;
    if (test[m.r][m.c].t === 'p' && (m.r === 0 || m.r === 7)) test[m.r][m.c].t = 'q';
    const king = findKing(test, side);
    if (!king) return false;
    return !isSquareAttacked(test, king[0], king[1], side === 'w' ? 'b' : 'w');
  });
}
function updateChessStatus(g){
  const side = g.turnSeat === 'A' ? 'w' : 'b';
  const opp = side === 'w' ? 'b' : 'w';
  let any = false;
  for(let r=0;r<8;r++) for(let c=0;c<8;c++){
    const p = g.board[r][c];
    if (p && p.c === side && legalChessMoves(g.board, r, c).length) any = true;
  }
  const king = findKing(g.board, side);
  const check = king ? isSquareAttacked(g.board, king[0], king[1], opp) : false;
  g.status = `${side === 'w' ? 'White' : 'Black'} to move${check ? ' — check' : ''}`;
  if (!any) { g.winner = check ? (opp === 'w' ? 'A' : 'B') : 'D'; g.gameOver = true; g.status = g.winner === 'D' ? 'Stalemate' : `${g.winner === 'A' ? 'Player A' : 'Player B'} wins`; }
}
function chessMove(r,c){
  const g = S.room.state;
  if (g.gameOver || g.turnSeat !== S.me) return;
  if (g.selected){
    const [sr,sc] = g.selected;
    const move = g.legal.find(m => m.r===r && m.c===c);
    if (move){
      g.board[r][c] = g.board[sr][sc];
      g.board[sr][sc] = null;
      if (g.board[r][c].t === 'p' && (r === 0 || r === 7)) g.board[r][c].t = 'q';
      g.turnSeat = g.turnSeat === 'A' ? 'B' : 'A';
      g.selected = null;
      g.legal = [];
      updateChessStatus(g);
      saveRoomState(); render(); return;
    }
  }
  const p = g.board[r][c];
  if (p && ((S.me === 'A' && p.c === 'w') || (S.me === 'B' && p.c === 'b'))) {
    g.selected = [r,c];
    g.legal = legalChessMoves(g.board, r, c);
    render();
  }
}

function battleshipToggleOrient(){
  S.room.state.orient = S.room.state.orient === 'H' ? 'V' : 'H';
  render();
}
function battleshipPlace(r,c){
  const g = S.room.state;
  if (g.gameOver || g.turnSeat !== S.me) return;
  const sideKey = S.me;
  const side = g.sides[sideKey];
  const size = g.shipSizes[g.shipIndex];
  const coords = [];
  for (let i=0;i<size;i++){
    const nr = r + (g.orient === 'V' ? i : 0);
    const nc = c + (g.orient === 'H' ? i : 0);
    if (!inside6(nr,nc)) return setStatus('Ship does not fit');
    if (side.board[nr][nc]) return setStatus('Ships cannot overlap');
    coords.push([nr,nc]);
  }
  coords.forEach(([nr,nc]) => side.board[nr][nc] = 'S');
  side.ships.push(coords);
  g.shipIndex++;
  if (g.shipIndex >= g.shipSizes.length){
    side.placed = true;
    g.shipIndex = 0;
    if (S.me === 'A') { g.turnSeat = 'B'; g.phase = 'placeB'; }
    else { g.turnSeat = 'A'; g.phase = 'battle'; }
  }
  saveRoomState(); render();
}
function battleshipFire(r,c){
  const g = S.room.state;
  if (g.gameOver || g.phase !== 'battle' || g.turnSeat !== S.me) return;
  const me = S.me;
  const opp = me === 'A' ? 'B' : 'A';
  const target = g.sides[opp];
  const shots = g.sides[me].shots;
  if (shots[r][c]) return setStatus('Already fired there');
  if (target.board[r][c] === 'S'){
    shots[r][c] = 'H';
    target.board[r][c] = 'X';
    if (target.board.flat().every(v => v !== 'S')) { g.winner = me; g.gameOver = true; }
    else g.turnSeat = opp;
    setStatus('Hit');
  } else {
    shots[r][c] = 'M';
    g.turnSeat = opp;
    setStatus('Miss');
  }
  saveRoomState(); render();
}

  return !S.room || !S.me || (S.room.state?.turnSeat && S.room.state.turnSeat !== S.me) || S.room.state?.gameOver;

      ${g === 'sudoku' ? `<select id="soloDiff" class="select"><option>easy</option><option selected>medium</option><option>hard</option></select>` : ''}
      ${g === 'wordle' ? `<select id="soloDiff" class="select"><option>easy</option><option selected>medium</option><option>hard</option></select>` : ''}
      ${g === 'crossword' ? `<select id="crosswordPick" class="select">${CROSSWORDS.map((c,i)=>`<option value="${i}" ${i===0?'selected':''}>${c.name}</option>`).join('')}</select>` : ''}
      <button class="btn warn" data-action="new-solo">New</button>
    </div>
  `;
  let content = '';
  if (g === 'sudoku') content = renderSudoku();
  if (g === 'wordle') content = renderWordle();
  if (g === 'crossword') content = renderCrossword();
  return `
    <div class="layout">
      <div class="main">
        <div class="head">
          <div>
            <h2>${gameLabel(g)}</h2>
            <div class="sub">${soloPuzzleLabel(g)} — local only</div>
          </div>
          ${topControls}
        </div>
        <div class="body">${content}</div>
      </div>
      ${sidePanel()}
    </div>
  `;
}

function renderRoomScreen(){
  const g = S.game;
  const room = S.room;
  const topControls = `
    <div class="toolbar">
      <button class="btn good" data-action="copy-room">Copy room link</button>
      <button class="btn warn" data-action="new-room">New room</button>
    </div>
  `;
  let content = '';
  if (!room) content = `<div class="soft">Joining room…</div>`;
  else if (g === 'ttt') content = renderTtt();
  else if (g === 'connect4') content = renderConnect4();
  else if (g === 'checkers') content = renderCheckers();
  else if (g === 'chess') content = renderChess();
  else if (g === 'battleship') content = renderBattleship();
  return `
    <div class="layout">
      <div class="main" style="position:relative">
        ${room && room.state?.gameOver ? `<div class="overlay"><div class="box"><h3 style="margin-top:0">Match complete</h3><div class="soft">${room.state.winner === 'D' ? 'Draw' : `${room.state.winner === 'A' ? 'Player A' : 'Player B'} wins`}</div><div style="height:10px"></div><button class="btn primary" data-action="new-room">Start a new room</button></div></div>` : ''}
        <div class="head">
          <div>
            <h2>${gameLabel(g)}</h2>
            <div class="sub">Live room: <strong>${room ? room.roomId : '...'}</strong></div>
          </div>
          ${topControls}
        </div>
        <div class="body">${content}</div>
      </div>
      ${sidePanel()}
    </div>
  `;
}

function renderSudoku(){
  const s = S.solo.sudoku;
  return `
    <div class="game-board-wrap">
      <div class="notice">Select a cell and type a number. The puzzle is checked against the generated solution.</div>
      <div class="board sudoku-grid">
        ${s.board.flatMap((row,r)=>row.map((v,c)=>{
          const fixed = s.fixed[r][c];
          const sel = s.selected[0]===r && s.selected[1]===c;
          return fixed
            ? `<div class="cell input hint ${sel?'selected':''}">${v}</div>`
            : `<div class="cell input ${sel?'selected':''}" data-r="${r}" data-c="${c}" data-action="sudoku-cell"><input maxlength="1" value="${v ?? ''}" data-r="${r}" data-c="${c}" /></div>`;
        })).join('')}
      </div>
      <div class="kbd">
        ${[1,2,3,4,5,6,7,8,9].map(n=>`<button class="btn" data-action="sudoku-num" data-n="${n}">${n}</button>`).join('')}
        <button class="btn danger" data-action="sudoku-clear">⌫</button>
      </div>
      <div class="soft">${s.complete ? 'Solved.' : 'Use the number pad or keyboard. 9×9 board, difficulty changes the amount of removed cells.'}</div>
    </div>
  `;
}

function sudokuSolved(){
  const s = S.solo.sudoku;
  for(let r=0;r<9;r++) for(let c=0;c<9;c++) if(s.board[r][c] !== s.solution[r][c]) return false;
  return true;
}
function sudokuSet(r,c,val){
  const s = S.solo.sudoku;
  if (s.fixed[r][c]) return;
  s.board[r][c] = val ? Number(val) : null;
  s.complete = sudokuSolved();
  render();
}
function sudokuMove(dir){
  const s = S.solo.sudoku;
  const [r,c] = s.selected;
  const nr = Math.max(0, Math.min(8, r + (dir==='down'?1:dir==='up'?-1:0)));
  const nc = Math.max(0, Math.min(8, c + (dir==='right'?1:dir==='left'?-1:0)));
  s.selected = [nr,nc];
  render();
}

function renderWordle(){
  const w = S.solo.wordle;
  return `
    <div class="game-board-wrap">
      <div class="toolbar">
        <button class="btn" data-action="wordle-enter">Enter</button>
        <button class="btn danger" data-action="wordle-back">Delete</button>
      </div>
      <div class="word-grid">
        ${w.rows.map((row,r)=>`
          <div class="guess-row">
            ${row.map((ch,c)=>`<div class="letter ${w.result[r][c] || ''}">${ch || ''}</div>`).join('')}
          </div>
        `).join('')}
      </div>
      <div class="kbd">
        ${'QWERTYUIOPASDFGHJKLZXCVBNM'.split('').map(ch=>`<button class="btn" data-action="wordle-key" data-ch="${ch}">${ch}</button>`).join('')}
      </div>
      ${w.won ? `<div class="notice" style="margin-top:14px">Solved.</div>` : ''}
      ${w.lost ? `<div class="notice" style="margin-top:14px">Answer: <strong>${w.answer}</strong></div>` : ''}
    </div>
  `;
}
function wordleKey(ch){
  const w = S.solo.wordle;
  if (w.won || w.lost) return;
  if (w.col < 5){
    w.rows[w.row][w.col] = ch;
    w.col++;
    render();
  }
}
function wordleBack(){
  const w = S.solo.wordle;
  if (w.won || w.lost) return;
  if (w.col > 0){
    w.col--;
    w.rows[w.row][w.col] = '';
    render();
  }
}
function wordleEnter(){
  const w = S.solo.wordle;
  if (w.won || w.lost) return;
  if (w.col < 5) { setStatus('Need 5 letters'); return; }
  const guess = w.rows[w.row].join('').toUpperCase();
  const ans = w.answer.toUpperCase();
  const result = Array(5).fill('gray');
  const pool = ans.split('');
  for(let i=0;i<5;i++){
    if (guess[i] === ans[i]) { result[i] = 'green'; pool[i] = null; }
  }
  for(let i=0;i<5;i++){
    if (result[i] === 'green') continue;
    const idx = pool.indexOf(guess[i]);
    if (idx !== -1){ result[i] = 'gold'; pool[idx] = null; }
  }
  w.result[w.row] = result;
  if (guess === ans) w.won = true;
  else if (w.row === 5) w.lost = true;
  else { w.row++; w.col = 0; }
  render();
}

function renderCrossword(){
  const x = S.solo.crossword;
  return `
    <div class="game-board-wrap">
      <div class="notice">Compact crossword-style board. Click any cell and type one letter.</div>
      <div class="crossword" style="grid-template-columns: repeat(${x.puzzle.grid[0].length}, 42px)">
        ${x.puzzle.grid.flatMap((row,r)=>row.map((cell,c)=>{
          if (cell === null) return `<div class="cell block">#</div>`;
          return `<div class="cell"><input maxlength="1" value="${x.cells[r][c] || ''}" data-r="${r}" data-c="${c}" data-action="crossword-cell" /></div>`;
        })).join('')}
      </div>
      <div class="clues">
        <div class="clue"><h4>Across</h4><ol>${x.puzzle.clues.across.map(cl=>`<li>${escapeHtml(cl)}</li>`).join('')}</ol></div>
        <div class="clue"><h4>Down</h4><ol>${x.puzzle.clues.down.map(cl=>`<li>${escapeHtml(cl)}</li>`).join('')}</ol></div>
      </div>
      ${x.solved ? `<div class="notice" style="margin-top:14px">Solved.</div>` : ''}
    </div>
  `;
}
function crosswordSet(r,c,val){
  const x = S.solo.crossword;
  if (x.puzzle.grid[r][c] === null) return;
  x.cells[r][c] = (val || '').toUpperCase().slice(0,1);
  x.solved = x.puzzle.grid.every((row,rr)=>row.every((cell,cc)=>cell === null || x.cells[rr][cc] === cell));
  render();
}

function renderTtt(){
  const g = S.room.state;
  const turnLabel = g.turnSeat === 'A' ? 'Player A' : 'Player B';
  return `
    <div class="game-board-wrap">
      <div class="notice">${g.gameOver ? (g.winner === 'D' ? 'Draw.' : `${g.winner === 'A' ? 'Player A' : 'Player B'} wins.`) : `Turn: ${turnLabel}.`}</div>
      <div class="tic">
        ${g.board.map((v,i)=>`<button class="cell" data-action="ttt-move" data-i="${i}">${v}</button>`).join('')}
      </div>
      <div class="soft">Auto-sync is live. Only the seat whose turn it is can move.</div>
    </div>
  `;
}
function renderConnect4(){
  const g = S.room.state;
  return `
    <div class="game-board-wrap">
      <div class="notice">${g.gameOver ? (g.winner === 'D' ? 'Draw.' : `${g.winner === 'A' ? 'Player A' : 'Player B'} wins.`) : `Turn: ${g.turnSeat === 'A' ? 'Player A' : 'Player B'}.`}</div>
      <div class="connect">
        ${[0,1,2,3,4,5,6].map(col=>`<button class="btn" style="grid-row:1" data-action="connect-move" data-col="${col}">▼</button>`).join('')}
        ${g.board.flatMap(row=>row.map(v=>`<div class="slot">${v || ''}</div>`)).join('')}
      </div>
    </div>
  `;
}
function renderCheckers(){
  const g = S.room.state;
  return `
    <div class="game-board-wrap">
      <div class="notice">${g.gameOver ? (g.winner === 'D' ? 'Draw.' : `${g.winner === 'A' ? 'Player A' : 'Player B'} wins.`) : `Turn: ${g.turnSeat === 'A' ? 'Player A' : 'Player B'}.`}</div>
      <div class="checkers" style="grid-template-columns: repeat(8, 56px)">
        ${g.board.flatMap((row,r)=>row.map((p,c)=>{
          const dark = (r+c)%2===1;
          const sel = g.selected && g.selected[0]===r && g.selected[1]===c;
          const txt = p ? `<span class="piece ${p === 'r' || p === 'R' ? 'red' : 'black'}">${p === 'r' ? '⛂' : p === 'R' ? '⛃' : p === 'b' ? '⛀' : '⛁'}</span>` : '';
          return `<button class="cell ${dark?'dark':'light'} ${sel?'selected':''}" data-action="checkers-cell" data-r="${r}" data-c="${c}">${txt}</button>`;
        })).join('')}
      </div>
    </div>
  `;
}
function renderChess(){
  const g = S.room.state;
  return `
    <div class="game-board-wrap">
      <div class="notice">${escapeHtml(g.status || '')}</div>
      <div class="chess" style="grid-template-columns: repeat(8, 56px)">
        ${g.board.flatMap((row,r)=>row.map((p,c)=>{
          const dark = (r+c)%2===1;
          const sel = g.selected && g.selected[0]===r && g.selected[1]===c;
          const tgt = g.legal?.some(m=>m.r===r && m.c===c);
          return `<button class="cell ${dark?'dark':'light'} ${sel?'selected':''} ${tgt?'target':''}" data-action="chess-cell" data-r="${r}" data-c="${c}">${p ? `<span class="piece ${p.c}">${PIECES[p.c][p.t]}</span>` : ''}</button>`;
        })).join('')}
      </div>
      <div class="soft">This version includes standard movement and promotion. It is designed to stay fully static on the front end while the backend enforces turns.</div>
    </div>
  `;
}
function renderBattleship(){
  const g = S.room.state;
  const me = S.me;
  const my = me ? g.sides[me] : null;
  const opp = me === 'A' ? 'B' : 'A';
  const phaseText = g.gameOver ? (g.winner === 'D' ? 'Draw.' : `${g.winner === 'A' ? 'Player A' : 'Player B'} wins.`) : (g.phase === 'battle' ? `Battle phase — ${g.turnSeat === 'A' ? 'Player A' : 'Player B'} to move` : `Placement phase — ${me === 'A' ? 'Player A' : 'Player B'} placing ships`);
  const viewGrid = g.phase === 'battle' ? g.sides[opp].board : my.board;
  const action = g.phase === 'battle' ? 'battle-fire' : 'battle-place';
  return `
    <div class="game-board-wrap">
      <div class="notice">${phaseText}${g.phase !== 'battle' ? ` • Ship size: <strong>${g.shipSizes[g.shipIndex]}</strong> • Orientation: <strong>${g.orient}</strong>` : ''}</div>
      <div class="toolbar">
        ${g.phase !== 'battle' ? `<button class="btn" data-action="battle-orient">Toggle orientation</button>` : ''}
      </div>
      <div class="battle" style="grid-template-columns: repeat(6, 56px)">
        ${viewGrid.flatMap((row,r)=>row.map((v,c)=>{
          const show = g.phase === 'battle' ? g.sides[opp].shots[r][c] : (my.board[r][c] === 'S' ? '■' : '');
          return `<button class="cell ${(r+c)%2===1?'dark':'light'}" data-action="${action}" data-r="${r}" data-c="${c}">${show || ''}</button>`;
        })).join('')}
      </div>
      <div class="soft">Place three ships (sizes 3, 2, 2), then battle begins automatically.</div>
    </div>
  `;
}

function render(){
  homeBtn.style.display = S.screen === 'home' ? 'none' : 'inline-flex';
  let html = '';
  if (S.screen === 'home') html = renderHome();
  if (S.screen === 'solo') html = renderSoloScreen();
  if (S.screen === 'room') html = renderRoomScreen();
  app.innerHTML = html;
  if (S.screen === 'solo' && S.game === 'sudoku') {
    const diff = document.getElementById('soloDiff');
    if (diff) diff.value = S.solo.sudoku.difficulty;
  }
}

function attachRoomFromState(){
  if (!S.room || !S.room.state) return;
  if (S.room.game === 'chess') updateChessStatus(S.room.state);
}

document.addEventListener('click', async (e) => {
  const btn = e.target.closest('[data-action]');
  if (!btn) return;
  const action = btn.dataset.action;

  if (action === 'solo-sudoku') return initLocalSolo('sudoku');
  if (action === 'solo-wordle') return initLocalSolo('wordle');
  if (action === 'solo-crossword') return initLocalSolo('crossword');

  if (action === 'multi-ttt') return handleCreateRoom('ttt');
  if (action === 'multi-connect4') return handleCreateRoom('connect4');
  if (action === 'multi-checkers') return handleCreateRoom('checkers');
  if (action === 'multi-chess') return handleCreateRoom('chess');
  if (action === 'multi-battleship') return handleCreateRoom('battleship');

  if (action === 'copy-room') return S.room ? copy(roomLink(S.room.roomId)) : copy(location.href);
  if (action === 'refresh-room') return refreshRoom().catch(err => setStatus(err.message));
  if (action === 'resume-room') {
    const roomId = qs('room');
    if (roomId) {
      S.screen = 'room';
      S.game = qs('game') || 'ttt';
      render();
      joinRoom(roomId).catch(err => setStatus(err.message));
    }
    return;
  }
  if (action === 'reset-local') {
    S.solo = { sudoku:null, wordle:null, crossword:null };
    setStatus('Local progress reset');
    render();
    return;
  }

  if (action === 'new-room') {
    if (S.game) handleCreateRoom(S.game);
    return;
  }
  if (action === 'new-solo') {
    const pick = S.game;
    if (pick === 'sudoku') initSudoku(document.getElementById('soloDiff')?.value || 'medium');
    if (pick === 'wordle') initWordle(document.getElementById('soloDiff')?.value || 'medium');
    if (pick === 'crossword') initCrossword(Number(document.getElementById('crosswordPick')?.value || 0));
    render();
    return;
  }

  if (action === 'sudoku-cell') {
    if (!e.target.matches('input')) {
      const r = Number(btn.dataset.r), c = Number(btn.dataset.c);
      S.solo.sudoku.selected = [r,c];
      render();
    }
  }
  if (action === 'sudoku-num') {
    sudokuSet(...S.solo.sudoku.selected, btn.dataset.n);
    if (sudokuSolved()) S.solo.sudoku.complete = true;
    render();
  }
  if (action === 'sudoku-clear') {
    sudokuSet(...S.solo.sudoku.selected, '');
    render();
  }
  if (action === 'wordle-key') return wordleKey(btn.dataset.ch);
  if (action === 'wordle-back') return wordleBack();
  if (action === 'wordle-enter') return wordleEnter();
  if (action === 'crossword-cell') return;

  if (action === 'ttt-move') return S.room && tttMove(Number(btn.dataset.i));
  if (action === 'connect-move') return S.room && connectMove(Number(btn.dataset.col));
  if (action === 'checkers-cell') return S.room && checkersMove(Number(btn.dataset.r), Number(btn.dataset.c));
  if (action === 'chess-cell') return S.room && chessMove(Number(btn.dataset.r), Number(btn.dataset.c));
  if (action === 'battle-orient') return S.room && battleshipToggleOrient();
  if (action === 'battle-place') return S.room && battleshipPlace(Number(btn.dataset.r), Number(btn.dataset.c));
  if (action === 'battle-fire') return S.room && battleshipFire(Number(btn.dataset.r), Number(btn.dataset.c));
});

document.addEventListener('change', (e) => {
  const el = e.target;
  if (el.id === 'soloDiff' && S.screen === 'solo' && S.game === 'sudoku') {
    initSudoku(el.value);
    render();
  }
  if (el.id === 'soloDiff' && S.screen === 'solo' && S.game === 'wordle') {
    initWordle(el.value);
    render();
  }
  if (el.id === 'crosswordPick') {
    initCrossword(Number(el.value));
    render();
  }
  if (el.matches('input[data-action="crossword-cell"]')) {
    const r = Number(el.dataset.r), c = Number(el.dataset.c);
    crosswordSet(r,c,el.value);
  }
});

document.addEventListener('input', (e) => {
  const el = e.target;
  if (el.matches('input[data-r][data-c]') && S.screen === 'solo' && S.game === 'sudoku') {
    const r = Number(el.dataset.r), c = Number(el.dataset.c);
    const v = el.value.replace(/[^1-9]/g,'').slice(0,1);
    sudokuSet(r,c,v);
  }
  if (el.matches('input[data-action="crossword-cell"]')) {
    const r = Number(el.dataset.r), c = Number(el.dataset.c);
    crosswordSet(r,c,el.value);
  }
});

document.addEventListener('keydown', (e) => {
  if (S.screen === 'solo' && S.game === 'sudoku') {
    if (/^[1-9]$/.test(e.key)) { e.preventDefault(); sudokuSet(...S.solo.sudoku.selected, e.key); return; }
    if (e.key === 'Backspace' || e.key === 'Delete') { e.preventDefault(); sudokuSet(...S.solo.sudoku.selected, ''); return; }
    if (e.key === 'ArrowUp') { e.preventDefault(); sudokuMove('up'); return; }
    if (e.key === 'ArrowDown') { e.preventDefault(); sudokuMove('down'); return; }
    if (e.key === 'ArrowLeft') { e.preventDefault(); sudokuMove('left'); return; }
    if (e.key === 'ArrowRight') { e.preventDefault(); sudokuMove('right'); return; }
  }
  if (S.screen === 'solo' && S.game === 'wordle') {
    if (/^[a-zA-Z]$/.test(e.key)) { e.preventDefault(); wordleKey(e.key.toUpperCase()); return; }
    if (e.key === 'Backspace') { e.preventDefault(); wordleBack(); return; }
    if (e.key === 'Enter') { e.preventDefault(); wordleEnter(); return; }
  }
});

homeBtn.addEventListener('click', goHome);

async function boot(){
  const roomId = qs('room');
  const game = qs('game');
  if (roomId && game){
    S.screen = 'room';
    S.game = game;
    render();
    try { await joinRoom(roomId); } catch (err) { setStatus(err.message); }
  } else {
    S.screen = 'home';
    render();
  }
  startPolling();
}
boot();

window.addEventListener('visibilitychange', () => {
  if (!document.hidden && S.room) refreshRoom().catch(()=>{});
});
</script>
</body>
</html>
