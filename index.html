<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GameHub</title>
  <style>
    :root{
      --bg0:#030912;--bg1:#060f1c;--bg2:#0a1628;--bg3:#0e1d34;
      --blue:#5b8aff;--teal:#00e5cc;--purple:#a87fff;--pink:#ff6b9d;--gold:#ffb627;--green:#00d4a0;
      --t1:#f0f4ff;--t2:#7a8eb8;--t3:#3d4e72;
      --gls:rgba(255,255,255,.04);--glb:rgba(255,255,255,.08);
      --bdr:rgba(255,255,255,.08);--bdr2:rgba(255,255,255,.18);
      --sm:0 2px 12px rgba(0,0,0,.35);--md:0 8px 32px rgba(0,0,0,.45);--lg:0 20px 60px rgba(0,0,0,.55);
      --r:16px;--r2:24px;color-scheme:dark;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    html,body{height:100%;overscroll-behavior:none;}
    body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg0);color:var(--t1);overflow-x:hidden;line-height:1.5;}
    body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(91,138,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(91,138,255,.04) 1px,transparent 1px);background-size:52px 52px;animation:gridMove 28s linear infinite;pointer-events:none;z-index:0;}
    body::after{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 15% 0%,rgba(91,138,255,.13) 0%,transparent 45%),radial-gradient(ellipse at 85% 100%,rgba(0,229,204,.09) 0%,transparent 45%),radial-gradient(ellipse at 65% 50%,rgba(168,127,255,.06) 0%,transparent 40%);pointer-events:none;z-index:0;}
    @keyframes gridMove{from{background-position:0 0;}to{background-position:0 52px;}}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes pop{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}
    @keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
    @keyframes tileShake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
    @keyframes chipDrop{from{transform:translateY(-170px);opacity:0}to{transform:translateY(0);opacity:1}}
    @keyframes tileNew{from{transform:scale(.1);opacity:0}to{transform:scale(1);opacity:1}}
    @keyframes forceRing{0%,100%{box-shadow:0 0 0 2px rgba(255,182,39,.4)}50%{box-shadow:0 0 0 4px rgba(255,182,39,.9)}}
    @keyframes confettiFall{0%{transform:translateY(-20px) rotate(0deg);opacity:1}100%{transform:translateY(120vh) rotate(720deg);opacity:0}}
    @keyframes winGlow{0%,100%{opacity:1}50%{opacity:.75}}
    @keyframes snakePulse{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
    @keyframes cardReveal{0%{transform:rotateY(90deg);opacity:0}100%{transform:rotateY(0);opacity:1}}
    @keyframes slideIn{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:translateX(0)}}
    .guess-row.shake{animation:tileShake .35s ease}
    .chip.drop{animation:chipDrop .28s cubic-bezier(.2,1.4,.6,1)}
    .tile-new{animation:tileNew .14s ease-out}
    .force-capture .piece{animation:forceRing .75s ease infinite;border-radius:50%;}
    .confetti-piece{position:fixed;width:9px;height:9px;border-radius:2px;pointer-events:none;z-index:9999}
    .win-glow{animation:winGlow 1.8s ease infinite;}
    /* ── Layout ── */
    .app{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;}
    /* ── Nav ── */
    .nav{display:flex;justify-content:space-between;align-items:center;padding:12px 20px;gap:10px;position:sticky;top:0;z-index:100;background:rgba(3,9,18,.88);backdrop-filter:blur(18px) saturate(160%);border-bottom:1px solid var(--bdr);}
    .brand{display:flex;align-items:center;gap:11px;}
    .logo{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-weight:900;font-size:.85rem;background:linear-gradient(135deg,var(--blue),var(--teal));color:#030912;flex-shrink:0;box-shadow:0 0 18px rgba(91,138,255,.5);}
    .brand-name{font-size:1rem;font-weight:800;letter-spacing:-.02em;}
    .brand-sub{font-size:.72rem;color:var(--t2);margin-top:1px;}
    .nav-right{display:flex;align-items:center;gap:8px;}
    /* ── Buttons ── */
    button,input,select{font-family:inherit;font-size:.88rem;}
    .btn{display:inline-flex;align-items:center;gap:5px;padding:9px 15px;border-radius:11px;border:1px solid var(--bdr);background:var(--gls);color:var(--t1);cursor:pointer;font-weight:600;transition:all .15s;white-space:nowrap;}
    .btn:hover{border-color:var(--bdr2);background:var(--glb);transform:translateY(-1px);}
    .btn:active{transform:scale(.96);}
    .btn.primary{background:linear-gradient(135deg,rgba(91,138,255,.95),rgba(72,112,255,.88));border-color:rgba(91,138,255,.5);box-shadow:0 4px 16px rgba(91,138,255,.3);}
    .btn.primary:hover{box-shadow:0 6px 22px rgba(91,138,255,.45);}
    .btn.teal{background:rgba(0,229,204,.1);border-color:rgba(0,229,204,.3);color:var(--teal);}
    .btn.teal:hover{background:rgba(0,229,204,.18);border-color:rgba(0,229,204,.5);}
    .btn.gold{background:rgba(255,182,39,.1);border-color:rgba(255,182,39,.3);color:var(--gold);}
    .btn.gold:hover{background:rgba(255,182,39,.18);}
    .btn.danger{background:rgba(255,107,157,.08);border-color:rgba(255,107,157,.3);color:var(--pink);}
    .btn.sm{padding:7px 12px;font-size:.8rem;border-radius:9px;}
    .pill{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:10px;border:1px solid var(--bdr);background:var(--gls);color:var(--t2);font-size:.82rem;}
    input.field,input.room-link{padding:9px 13px;border-radius:11px;border:1px solid var(--bdr);background:rgba(255,255,255,.05);color:var(--t1);}
    input.field:focus,input.room-link:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(91,138,255,.18);}
    select.sel{padding:9px 13px;border-radius:11px;border:1px solid var(--bdr);background:var(--bg2);color:var(--t1);}
    /* ── Page ── */
    .page{flex:1;padding:22px 20px;max-width:1380px;margin:0 auto;width:100%;animation:fadeUp .22s ease;}
    /* ── Home ── */
    .home-hero{margin-bottom:28px;}
    .home-title{font-size:clamp(2.2rem,5vw,3.8rem);font-weight:900;letter-spacing:-.04em;line-height:1.02;background:linear-gradient(135deg,var(--t1) 50%,var(--t2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
    .home-sub{color:var(--t2);font-size:.95rem;margin-top:7px;max-width:520px;}
    .section-hdr{display:flex;align-items:center;gap:8px;margin-bottom:14px;}
    .sdot{width:8px;height:8px;border-radius:50%;}
    .sdot-gold{background:var(--gold);box-shadow:0 0 8px rgba(255,182,39,.6);}
    .sdot-teal{background:var(--teal);box-shadow:0 0 8px rgba(0,229,204,.6);}
    .shdr-label{font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--t2);}
    .game-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(172px,1fr));gap:12px;margin-bottom:32px;}
    /* Game cards */
    .gcard{background:var(--gls);border:1px solid var(--bdr);border-radius:var(--r2);overflow:hidden;cursor:pointer;text-align:left;color:var(--t1);display:flex;flex-direction:column;transition:transform .18s,border-color .18s,box-shadow .18s;}
    .gcard:hover{transform:translateY(-5px);}
    .gcard.solo:hover{border-color:rgba(255,182,39,.4);box-shadow:0 14px 40px rgba(0,0,0,.5),0 0 0 1px rgba(255,182,39,.15);}
    .gcard.multi:hover{border-color:rgba(0,229,204,.4);box-shadow:0 14px 40px rgba(0,0,0,.5),0 0 0 1px rgba(0,229,204,.15);}
    .gcard-ico{font-size:2.2rem;padding:22px 18px 14px;border-bottom:1px solid var(--bdr);}
    .gcard.solo .gcard-ico{background:linear-gradient(135deg,rgba(255,182,39,.1),rgba(255,182,39,.02));}
    .gcard.multi .gcard-ico{background:linear-gradient(135deg,rgba(0,229,204,.1),rgba(0,229,204,.02));}
    .gcard-body{padding:13px 15px 15px;flex:1;display:flex;flex-direction:column;}
    .gcard-name{font-size:.95rem;font-weight:800;letter-spacing:-.02em;margin-bottom:4px;}
    .gcard-desc{font-size:.78rem;color:var(--t2);line-height:1.45;flex:1;margin-bottom:11px;}
    .gcard-foot{display:flex;align-items:center;justify-content:space-between;}
    .gbadge{font-size:.68rem;font-weight:700;padding:3px 8px;border-radius:7px;letter-spacing:.04em;text-transform:uppercase;}
    .gbadge-solo{background:rgba(255,182,39,.14);color:var(--gold);border:1px solid rgba(255,182,39,.28);}
    .gbadge-multi{background:rgba(0,229,204,.1);color:var(--teal);border:1px solid rgba(0,229,204,.25);}
    .gcard-cta{font-size:.8rem;font-weight:700;color:var(--t3);transition:color .15s;}
    .gcard:hover .gcard-cta{color:var(--t1);}
    /* Config card */
    .cfg-card{background:var(--gls);border:1px solid var(--bdr);border-radius:var(--r2);padding:18px;margin-bottom:28px;}
    .cfg-label{font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--t3);margin-bottom:10px;}
    .cfg-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
    #backendStatus{font-size:.78rem;color:var(--t2);margin-top:8px;}
    /* ── Game shell ── */
    .gshell{display:grid;grid-template-columns:1fr 272px;gap:14px;align-items:start;}
    .gmain{background:var(--gls);border:1px solid var(--bdr);border-radius:var(--r2);overflow:hidden;}
    .gtopbar{display:flex;align-items:center;justify-content:space-between;padding:13px 18px;border-bottom:1px solid var(--bdr);gap:10px;flex-wrap:wrap;background:rgba(255,255,255,.02);}
    .gtitle{font-size:1.02rem;font-weight:800;letter-spacing:-.02em;}
    .gsub{font-size:.75rem;color:var(--t2);margin-top:2px;}
    .gbody{padding:22px;display:grid;place-items:center;min-height:480px;}
    .scene{display:grid;justify-items:center;gap:14px;width:100%;}
    .gsidebar{display:flex;flex-direction:column;gap:12px;position:sticky;top:66px;}
    .scard{background:var(--gls);border:1px solid var(--bdr);border-radius:var(--r);padding:14px;}
    .slbl{font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--t3);margin-bottom:9px;}
    .seat-row{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:9px;}
    .stag{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:8px;font-size:.78rem;font-weight:600;border:1px solid var(--bdr);}
    .stag.mine{background:rgba(91,138,255,.12);border-color:rgba(91,138,255,.3);color:var(--blue);}
    .stag.turn{background:rgba(0,229,204,.1);border-color:rgba(0,229,204,.3);color:var(--teal);}
    .sync-row{display:flex;align-items:center;gap:7px;font-size:.76rem;color:var(--t2);}
    /* Notices */
    .notice{padding:11px 15px;border-radius:13px;border:1px solid rgba(255,182,39,.25);background:rgba(255,182,39,.07);color:#ffe8a0;font-size:.88rem;line-height:1.5;width:100%;}
    .notice.err{border-color:rgba(255,107,157,.3);background:rgba(255,107,157,.07);color:#ffb8cc;}
    .notice.ok{border-color:rgba(0,212,160,.3);background:rgba(0,212,160,.07);color:#80ffdc;}
    .soft{padding:11px 14px;border-radius:13px;border:1px solid var(--bdr);background:var(--gls);color:var(--t2);font-size:.85rem;line-height:1.5;}
    .footer-note{color:var(--t2);font-size:.8rem;line-height:1.55;text-align:center;max-width:540px;}
    .toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
    .boardbox{width:fit-content;max-width:100%;overflow:auto;}
    .muted{color:var(--t2);}
    .hr{height:1px;background:var(--bdr);margin:13px 0;}
    code{font-family:ui-monospace,monospace;font-size:.8em;background:rgba(255,255,255,.07);padding:2px 5px;border-radius:5px;}
    /* ── Sudoku ── */
    .sudoku-grid{display:grid;grid-template-columns:repeat(9,44px);border:2px solid rgba(255,255,255,.22);background:var(--bg2);border-radius:4px;box-shadow:var(--md);}
    .sudoku-grid .cell{width:44px;height:44px;border:1px solid rgba(255,255,255,.08);display:grid;place-items:center;cursor:pointer;font-weight:700;font-size:.95rem;transition:background .1s;}
    .sudoku-grid .cell:nth-child(3n):not(:nth-child(9n)){border-right:2px solid rgba(255,255,255,.28);}
    .sudoku-grid .cell:nth-child(n+19):nth-child(-n+27),.sudoku-grid .cell:nth-child(n+46):nth-child(-n+54){border-bottom:2px solid rgba(255,255,255,.28);}
    .sudoku-grid .cell:nth-child(9n+1){border-left:2px solid rgba(255,255,255,.28);}
    .sudoku-grid .cell:nth-child(-n+9){border-top:2px solid rgba(255,255,255,.28);}
    .cell.given{background:rgba(255,255,255,.06);color:var(--t2);cursor:default;}
    .cell.selected{background:rgba(91,138,255,.16)!important;outline:2px solid var(--blue);outline-offset:-2px;}
    .cell.target{background:rgba(0,229,204,.17)!important;cursor:pointer;}
    .cell.target:hover{background:rgba(0,229,204,.28)!important;}
    .cell.blk{background:rgba(255,255,255,.08);cursor:default;}
    .notes-on{border-color:rgba(0,229,204,.4)!important;background:rgba(0,229,204,.1)!important;color:var(--teal)!important;}
    .tiny-note{font-size:8px;display:grid;grid-template-columns:repeat(3,1fr);width:36px;opacity:.65;line-height:1.2;}
    .tiny-note span{text-align:center;}
    /* ── Wordle ── */
    .word-grid{display:grid;gap:8px;}
    .guess-row{display:grid;grid-template-columns:repeat(5,52px);gap:7px;}
    .letter{width:52px;height:52px;border-radius:12px;border:1px solid var(--bdr);background:rgba(255,255,255,.04);display:grid;place-items:center;font-size:1.1rem;font-weight:900;transition:all .15s;}
    .letter.filled{border-color:rgba(255,255,255,.25);}
    .letter.green{background:rgba(0,212,160,.2);border-color:rgba(0,212,160,.5);color:var(--green);}
    .letter.gold{background:rgba(255,182,39,.18);border-color:rgba(255,182,39,.5);color:var(--gold);}
    .letter.gray{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.12);color:var(--t2);}
    .kbd{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:5px;width:min(560px,100%);}
    .kbd .btn{min-height:42px;padding:0;font-size:.82rem;font-weight:700;}
    .kbd .btn.used.absent{opacity:.35;}
    .kbd .btn.used.present{border-color:rgba(255,182,39,.5);background:rgba(255,182,39,.14);color:var(--gold);}
    .kbd .btn.used.correct{border-color:rgba(0,212,160,.5);background:rgba(0,212,160,.14);color:var(--green);}
    /* ── Crossword ── */
    .crossword{display:grid;gap:4px;width:fit-content;}
    .crossword .cell{width:40px;height:40px;border-radius:8px;overflow:hidden;}
    .crossword .cell input{width:100%;height:100%;border:0;background:transparent;color:var(--t1);text-transform:uppercase;text-align:center;font-weight:900;font-size:1rem;}
    .clues{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:min(600px,100%);}
    .clue-box{border:1px solid var(--bdr);border-radius:14px;padding:13px;background:var(--gls);}
    .clue-box h4{font-size:.78rem;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.09em;margin-bottom:8px;}
    .clue-box ol{margin:0;padding-left:17px;color:var(--t2);line-height:1.6;font-size:.83rem;}
    /* ── TTT ── */
    .tic{display:grid;grid-template-columns:repeat(3,92px);gap:10px;}
    .tic .cell{width:92px;height:92px;border-radius:20px;background:rgba(255,255,255,.06);border:1px solid var(--bdr);font-size:2.4rem;font-weight:900;display:grid;place-items:center;cursor:pointer;transition:all .15s;}
    .tic .cell:hover:not(.given){background:rgba(255,255,255,.1);}
    .tic .cell.selected{background:rgba(0,229,204,.15);border-color:rgba(0,229,204,.4);}
    /* ── Connect 4 ── */
    .c4-wrap{display:flex;flex-direction:column;gap:8px;align-items:center;}
    .c4-arrows{display:grid;grid-template-columns:repeat(7,56px);gap:8px;}
    .c4-arr{height:28px;width:56px;border-radius:9px;border:1px solid var(--bdr);background:var(--gls);color:var(--t2);cursor:pointer;display:grid;place-items:center;transition:all .15s;font-size:.95rem;}
    .c4-arr.active:hover{background:rgba(91,138,255,.14);border-color:rgba(91,138,255,.35);color:var(--blue);}
    .c4-board{background:linear-gradient(180deg,rgba(8,22,50,.97),rgba(4,12,32,.97));border:1px solid rgba(91,138,255,.18);border-radius:20px;padding:12px;box-shadow:0 8px 40px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.04);}
    .c4-grid{display:grid;grid-template-columns:repeat(7,56px);gap:8px;}
    .c4-slot{width:56px;height:56px;border-radius:50%;border:1px solid rgba(0,0,0,.4);background:rgba(0,0,0,.45);display:grid;place-items:center;overflow:hidden;box-shadow:inset 0 3px 8px rgba(0,0,0,.6);}
    .chip{width:42px;height:42px;border-radius:50%;animation:pop .15s ease;}
    .chip.R{background:radial-gradient(circle at 33% 33%,#ff8fab,#ff1744 65%,#b71c1c);box-shadow:0 2px 10px rgba(255,23,68,.55);}
    .chip.Y{background:radial-gradient(circle at 33% 33%,#fff59d,#ffd600 65%,#f57f17);box-shadow:0 2px 10px rgba(255,214,0,.55);}
    .chip.drop{animation:chipDrop .28s cubic-bezier(.2,1.4,.6,1);}
    /* ── Chess & Checkers ── */
    .chess-board,.checkers-board{display:grid;border-radius:16px;overflow:hidden;box-shadow:var(--md);border:2px solid rgba(255,255,255,.1);}
    .chess-board{grid-template-columns:repeat(8,56px);}
    .checkers-board{grid-template-columns:repeat(8,56px);}
    .sq{width:56px;height:56px;display:grid;place-items:center;position:relative;cursor:pointer;transition:all .1s;}
    .sq.lt{background:#1c2d45;}
    .sq.dk{background:#0a1828;}
    .sq.selected{outline:2px solid var(--blue);outline-offset:-2px;z-index:1;}
    .sq.target::after{content:'';position:absolute;width:22px;height:22px;border-radius:50%;background:rgba(0,229,204,.35);border:2px solid rgba(0,229,204,.7);pointer-events:none;}
    .sq.target.occ::after{display:none;}
    .sq.target.occ{outline:2px solid rgba(0,229,204,.65);outline-offset:-2px;}
    .sq.force-capture .piece{animation:forceRing .75s ease infinite;border-radius:50%;}
    .piece{font-size:1.75rem;line-height:1;pointer-events:none;user-select:none;}
    .piece.w{color:#eef2ff;filter:drop-shadow(0 1px 3px rgba(0,0,0,.9));}
    .piece.b{color:#ff6b9d;filter:drop-shadow(0 1px 3px rgba(0,0,0,.9));}
    .piece.red{color:#ff6b9d;filter:drop-shadow(0 1px 2px rgba(0,0,0,.8));}
    .piece.black{color:#c8d4f0;filter:drop-shadow(0 1px 2px rgba(0,0,0,.8));}
    /* ── Battleship ── */
    .bat-board{display:grid;border-radius:16px;overflow:hidden;box-shadow:var(--md);border:1px solid rgba(91,138,255,.12);}
    .bat-board.fire-grid{grid-template-columns:repeat(6,56px);}
    .bat-board.my-grid{grid-template-columns:repeat(6,42px);}
    .bsq{display:grid;place-items:center;cursor:pointer;border:1px solid rgba(255,255,255,.05);transition:background .1s;}
    .bat-board.fire-grid .bsq{width:56px;height:56px;}
    .bat-board.my-grid .bsq{width:42px;height:42px;}
    .bsq.lt{background:rgba(8,22,52,.75);}
    .bsq.dk{background:rgba(4,13,34,.75);}
    .bsq:hover:not([disabled]):not(.hit-marker):not(.miss-marker){background:rgba(91,138,255,.18)!important;}
    .bsq.has-ship{background:rgba(91,138,255,.2)!important;border-color:rgba(91,138,255,.35)!important;}
    .bsq.ship-preview{background:rgba(0,229,204,.2)!important;border-color:rgba(0,229,204,.5)!important;}
    .bsq.ship-preview-invalid{background:rgba(255,107,157,.18)!important;border-color:rgba(255,107,157,.45)!important;}
    .bsq.hit-marker{background:rgba(255,107,157,.22)!important;}
    .bsq.miss-marker{background:rgba(255,255,255,.05)!important;}
    .bsq[disabled]{cursor:default;}
    /* ── 2048 ── */
    .grid-2048{display:grid;grid-template-columns:repeat(4,78px);gap:10px;background:rgba(255,255,255,.07);border-radius:18px;padding:12px;width:fit-content;border:1px solid var(--bdr);box-shadow:var(--md);touch-action:none;}
    .tile-2048{width:78px;height:78px;border-radius:12px;display:grid;place-items:center;font-weight:900;font-size:1.4rem;user-select:none;}

function setStatus(msg,pending=false){statusEl.textContent=msg||'Ready';S.pending=pending;renderSync();}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function qs(k){return new URLSearchParams(location.search).get(k);}
function seatName(s){return s==='A'?'Player A':s==='B'?'Player B':'—';}
function otherSeat(s){return s==='A'?'B':'A';}
function gameLabel(g){return ({sudoku:'Sudoku',wordle:'Wordle',crossword:'Mini Crossword',ttt:'Tic-Tac-Toe',connect4:'Connect Four',checkers:'Checkers',chess:'Chess',battleship:'Battleship',twenty48:'2048',minesweeper:'Minesweeper',snake:'Snake',memory:'Memory Match'})[g]||'Game';}
function inside(r,c){return r>=0&&c>=0&&r<8&&c<8;}
function inside6(r,c){return r>=0&&c>=0&&r<6&&c<6;}
function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=0|Math.random()*(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;}
function pick(arr){return arr[0|Math.random()*arr.length];}
function cloneBoard(b){return b.map(r=>r.map(c=>c?{...c}:null));}

}

/* ════════════════════════════════════════════════════════
   API  (JSONP)
════════════════════════════════════════════════════════ */
function getBackendUrl(){return localStorage.getItem('gh_backend_url')||CONFIG.backendUrl;}
function api(params){
  return new Promise((resolve,reject)=>{
    const cb='__gh_'+Math.random().toString(36).slice(2);
    const s=document.createElement('script');
    const url=new URL(getBackendUrl());
    Object.entries(params).forEach(([k,v])=>url.searchParams.set(k,typeof v==='string'?v:JSON.stringify(v)));
    url.searchParams.set('callback',cb);
    window[cb]=(data)=>{cleanup();resolve(data);};
    function cleanup(){delete window[cb];if(s.parentNode)s.parentNode.removeChild(s);}
    s.onerror=()=>{cleanup();reject(new Error('Network request failed'));};
    s.src=url.toString();document.head.appendChild(s);
    setTimeout(()=>{if(window[cb]){cleanup();reject(new Error('Request timed out'));}},12000);
  });
}

/* ════════════════════════════════════════════════════════
   ROOM PLUMBING
════════════════════════════════════════════════════════ */
function syncText(){return S.lastSynced?`Synced ${S.lastSynced}`:'Not synced';}
function renderSync(){const el=document.getElementById('sync');if(el)el.innerHTML=`${S.pending?'<span class="spinner"></span>':'<span style="width:16px;height:16px;display:inline-block"></span>'}<span>${esc(syncText())}</span>`;}
function setSyncedNow(){S.lastSynced=fmtNow();setStatus(syncText(),false);renderSync();}
function updateUrl(){const u=new URL(location.href);S.room?.roomId?u.searchParams.set('room',S.room.roomId):u.searchParams.delete('room');S.game?u.searchParams.set('game',S.game):u.searchParams.delete('game');history.replaceState({},'',u);}
function shareUrl(){return S.room?`${location.origin}${location.pathname}?room=${encodeURIComponent(S.room.roomId)}&game=${encodeURIComponent(S.room.game)}`:location.href;}
function startPolling(){stopPolling();S.pollTimer=setInterval(()=>{!document.hidden&&S.room?.roomId&&refreshRoom().catch(()=>{});},2200);}
function stopPolling(){clearInterval(S.pollTimer);S.pollTimer=null;}

async function createRoom(game){const res=await api({action:'createRoom',game,state:JSON.stringify(roomState(game,'A'))});if(!res.ok)throw new Error(res.error||'Create failed');S.room=res.room;S.me=res.seat||'A';S.token=res.token;localStorage.setItem(`gh_token_${S.room.roomId}`,S.token);updateUrl();setSyncedNow();startPolling();render();}
async function joinRoom(roomId){const cached=localStorage.getItem(`gh_token_${roomId}`);const res=await api({action:'joinRoom',roomId,token:cached||'',name:localStorage.getItem('gh_name_pref')||'Player'});if(!res.ok)throw new Error(res.error||'Join failed');S.room=res.room;S.me=res.seat||null;S.token=res.token||cached||null;if(S.token)localStorage.setItem(`gh_token_${roomId}`,S.token);setSyncedNow();startPolling();render();}
async function refreshRoom(){
  if(!S.room?.roomId||S.pending)return;
  const prevStr=JSON.stringify(S.room.state);
  const res=await api({action:'getRoom',roomId:S.room.roomId,token:S.token||''});
  if(!res.ok)throw new Error(res.error||'Fetch failed');
  const newStr=JSON.stringify(res.room.state);
  S.room=res.room;if(res.seat)S.me=res.seat;
  if(S.room.state?.turnSeat!==S.me){S.localSelect=null;S.localLegal=[];}
  setSyncedNow();
  if(newStr!==prevStr)render();else renderSync();
}
async function saveRoomState(){
  if(!S.room?.roomId||!S.token)return false;
  S.pending=true;renderSync();
  const res=await api({action:'saveState',roomId:S.room.roomId,token:S.token,state:JSON.stringify(S.room.state)});
  S.pending=false;
  if(!res.ok){setStatus(res.error||'Move rejected',false);await refreshRoom().catch(()=>{});return false;}
  S.room=res.room;setSyncedNow();return true;
}

  if(game==='memory'&&!S.solo.memory)initMemory('easy');

function openMulti(game){
  S.screen='room';S.game=game;resetLocalState();
  const roomId=qs('room');
  if(roomId)joinRoom(roomId).catch(err=>{S.roomError=err.message;setStatus(err.message,false);render();});
  else createRoom(game).catch(err=>{S.roomError=err.message;setStatus(err.message,false);render();});
  updateUrl();render();
}

/* ════════════════════════════════════════════════════════
   ROOM STATE TEMPLATES
════════════════════════════════════════════════════════ */
function roomState(game,starter='A'){
  if(game==='ttt')return{game,board:Array(9).fill(''),turnSeat:starter,winner:null,gameOver:false,rematch:{A:false,B:false},rematchStarter:'A',quit:{A:false,B:false},version:0};
  if(game==='connect4')return{game,board:Array.from({length:6},()=>Array(7).fill('')),turnSeat:starter,winner:null,gameOver:false,rematch:{A:false,B:false},rematchStarter:'A',quit:{A:false,B:false},version:0};
  if(game==='checkers'){
    const board=Array.from({length:8},()=>Array(8).fill(null));
    for(let r=0;r<3;r++)for(let c=0;c<8;c++)if((r+c)%2===1)board[r][c]='b';
    for(let r=5;r<8;r++)for(let c=0;c<8;c++)if((r+c)%2===1)board[r][c]='r';
    return{game,board,turnSeat:starter,winner:null,gameOver:false,rematch:{A:false,B:false},rematchStarter:'A',quit:{A:false,B:false},version:0};
  }
  if(game==='chess'){
    const back=['r','n','b','q','k','b','n','r'];
    const board=Array.from({length:8},()=>Array(8).fill(null));
    for(let c=0;c<8;c++){board[0][c]={t:back[c],c:'b'};board[1][c]={t:'p',c:'b'};board[6][c]={t:'p',c:'w'};board[7][c]={t:back[c],c:'w'};}
    return{game,board,turnSeat:starter,status:'White to move',winner:null,gameOver:false,rematch:{A:false,B:false},rematchStarter:'A',quit:{A:false,B:false},version:0};
  }
  if(game==='battleship'){
    const side=()=>({board:Array.from({length:6},()=>Array(6).fill('')),shots:Array.from({length:6},()=>Array(6).fill('')),ships:[],placed:false});
    return{game,phase:'placeA',turnSeat:starter,shipSizes:[3,2,2],shipIndex:0,sides:{A:side(),B:side()},winner:null,gameOver:false,rematch:{A:false,B:false},rematchStarter:'A',quit:{A:false,B:false},version:0};
  }
  return{game,turnSeat:starter,winner:null,gameOver:false,rematch:{A:false,B:false},rematchStarter:'A',version:0};
}

/* ════════════════════════════════════════════════════════
   SUDOKU
════════════════════════════════════════════════════════ */
function makeSudoku(){const b=3,s=9,pat=(r,c)=>(b*(r%b)+Math.floor(r/b)+c)%s;const rb=[0,1,2];const rows=shuffle(rb).flatMap(g=>shuffle(rb).map(r=>g*b+r));const cols=shuffle(rb).flatMap(g=>shuffle(rb).map(c=>g*b+c));const nums=shuffle([1,2,3,4,5,6,7,8,9]);return Array.from({length:s},(_,r)=>Array.from({length:s},(_,c)=>nums[pat(rows[r],cols[c])]));}
function initSudoku(diff='medium'){const sol=makeSudoku();const holes={easy:34,medium:44,hard:52}[diff]||44;const board=sol.map(r=>[...r]);shuffle([...Array(81).keys()]).slice(0,holes).forEach(i=>board[0|i/9][i%9]=null);S.solo.sudoku={diff,sol,board,fixed:board.map(r=>r.map(v=>v!==null)),sel:[0,0],done:false,notes:Array.from({length:9},()=>Array.from({length:9},()=>new Set()))};}
function sudokuDone(s){for(let r=0;r<9;r++)for(let c=0;c<9;c++)if(s.board[r][c]!==s.sol[r][c])return false;return true;}
function sudokuSet(r,c,v){const s=S.solo.sudoku;if(s.fixed[r][c])return;if(S.notesMode&&v){const n=+v;s.notes[r][c].has(n)?s.notes[r][c].delete(n):s.notes[r][c].add(n);}else{s.board[r][c]=v?+v:null;if(!v)s.notes[r][c].clear();s.done=sudokuDone(s);if(s.done)setTimeout(showConfetti,100);}render();}
function sudokuMove(dir){const s=S.solo.sudoku;let[r,c]=s.sel;if(dir==='up')r--;if(dir==='down')r++;if(dir==='left')c--;if(dir==='right')c++;s.sel=[Math.max(0,Math.min(8,r)),Math.max(0,Math.min(8,c))];render();}
function renderSudoku(){
  const s=S.solo.sudoku;
  const cells=s.board.flatMap((row,r)=>row.map((v,c)=>{
    const fix=s.fixed[r][c],sel=s.sel[0]===r&&s.sel[1]===c;
    if(fix)return `<div class="cell given${sel?' selected':''}">${v}</div>`;
    const notes=s.notes[r][c];
    const nh=S.notesMode&&notes.size?`<div class="tiny-note">${[1,2,3,4,5,6,7,8,9].map(n=>`<span>${notes.has(n)?n:''}</span>`).join('')}</div>`:'';
    return `<div class="cell${sel?' selected':''}" data-action="sudoku-sel" data-r="${r}" data-c="${c}">${nh||''}${!nh&&v?v:''}</div>`;
  })).join('');
  return `<div class="scene"><div class="notice${s.done?' ok':''}">${s.done?'&#127881; Puzzle solved!':'Select a cell then type a number. Press N to toggle notes.'}</div><div class="boardbox"><div class="sudoku-grid">${cells}</div></div><div class="toolbar">${[1,2,3,4,5,6,7,8,9].map(n=>`<button class="btn sm" data-action="sudoku-num" data-n="${n}">${n}</button>`).join('')}<button class="btn sm danger" data-action="sudoku-clr">&#9003;</button></div><div class="footer-note">Arrow keys to navigate &nbsp;&bull;&nbsp; N toggles note mode</div></div>`;
}

/* ════════════════════════════════════════════════════════
   WORDLE  (fixed: 5-letter words only, A-Z keyboard, word validation)
════════════════════════════════════════════════════════ */
function initWordle(diff='medium'){S.solo.wordle={diff,answer:pick(WORDS[diff]),rows:Array.from({length:6},()=>Array(5).fill('')),result:Array.from({length:6},()=>Array(5).fill('')),row:0,col:0,won:false,lost:false,keys:{}};}
function wKey(ch){const w=S.solo.wordle;if(w.won||w.lost||w.col>=5)return;w.rows[w.row][w.col++]=ch;render();}
function wBack(){const w=S.solo.wordle;if(w.won||w.lost||w.col<=0)return;w.rows[w.row][--w.col]='';render();}
function wSetKey(ch,st){const w=S.solo.wordle;const ord={absent:0,present:1,correct:2};if(!w.keys[ch]||ord[st]>ord[w.keys[ch]])w.keys[ch]=st;}
function wEnter(){
  const w=S.solo.wordle;if(w.won||w.lost)return;
  if(w.col<5){const row=document.querySelectorAll('.guess-row')[w.row];if(row){row.classList.remove('shake');void row.offsetWidth;row.classList.add('shake');}setStatus('Need 5 letters',false);return;}
  const guess=w.rows[w.row].join('').toUpperCase();
  if(!VALID_WORDS.has(guess)){const row=document.querySelectorAll('.guess-row')[w.row];if(row){row.classList.remove('shake');void row.offsetWidth;row.classList.add('shake');}setStatus('Not a valid word — try another!',false);return;}
  const ans=w.answer.toUpperCase();
  const result=Array(5).fill('absent');const pool=ans.split('');
  for(let i=0;i<5;i++)if(guess[i]===ans[i]){result[i]='correct';pool[i]=null;}
  for(let i=0;i<5;i++){if(result[i]==='correct')continue;const idx=pool.indexOf(guess[i]);if(idx!==-1){result[i]='present';pool[idx]=null;}}
  const cm={correct:'green',present:'gold',absent:'gray'};
  w.result[w.row]=result.map(x=>cm[x]);
  guess.split('').forEach((ch,i)=>wSetKey(ch,result[i]));
  if(guess===ans){w.won=true;setTimeout(showConfetti,300);}
  else if(w.row===5)w.lost=true;
  else{w.row++;w.col=0;}
  render();
}
function renderWordle(){
  const w=S.solo.wordle;
  const rows=w.rows.map((row,r)=>`<div class="guess-row">${row.map((ch,c)=>`<div class="letter ${w.result[r][c]||''}${ch&&!w.result[r][c]?' filled':''}">${ch||''}</div>`).join('')}</div>`).join('');
  const keys='ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').map(ch=>`<button class="btn${w.keys[ch]?' used '+w.keys[ch]:''}" data-action="wkey" data-ch="${ch}">${ch}</button>`).join('');
  const status=w.won?'&#127881; You got it!':w.lost?`The word was <strong>${w.answer}</strong>`:'Guess the 5-letter word in 6 tries.';
  return `<div class="scene"><div class="notice${w.won?' ok':w.lost?' err':''}">${status}</div><div class="word-grid">${rows}</div><div class="kbd">${keys}</div><div class="toolbar"><button class="btn primary" data-action="wenter">Enter</button><button class="btn danger" data-action="wback">&#9003; Delete</button></div></div>`;
}

function initCrossword(idx=0){S.solo.crossword={idx,puzzle:JSON.parse(JSON.stringify(CROSSWORDS[idx])),cells:CROSSWORDS[idx].grid.map(r=>r.map(v=>v?'':null)),solved:false};}
function cwSet(r,c,v){const x=S.solo.crossword;if(x.puzzle.grid[r][c]===null)return;x.cells[r][c]=(v||'').toUpperCase().slice(0,1);x.solved=x.puzzle.grid.every((row,rr)=>row.every((cell,cc)=>cell===null||x.cells[rr][cc]===cell));if(x.solved)setTimeout(showConfetti,100);render();}

  const x=S.solo.crossword;
  const grid=x.puzzle.grid.flatMap((row,r)=>row.map((cell,c)=>cell===null?`<div class="cell blk"></div>`:`<div class="cell"><input maxlength="1" value="${x.cells[r][c]||''}" data-action="cw-cell" data-r="${r}" data-c="${c}" /></div>`)).join('');
  return `<div class="scene"><div class="notice${x.solved?' ok':''}">${x.solved?'&#127881; Solved!':'Click a cell and type one letter.'}</div><div class="boardbox"><div class="crossword" style="grid-template-columns:repeat(${x.puzzle.grid[0].length},40px)">${grid}</div></div><div class="clues"><div class="clue-box"><h4>Across</h4><ol>${x.puzzle.clues.across.map(cl=>`<li>${esc(cl)}</li>`).join('')}</ol></div><div class="clue-box"><h4>Down</h4><ol>${x.puzzle.clues.down.map(cl=>`<li>${esc(cl)}</li>`).join('')}</ol></div></div></div>`;
}

/* ════════════════════════════════════════════════════════
   2048
════════════════════════════════════════════════════════ */
function init2048(){const g=Array.from({length:4},()=>Array(4).fill(0));const best=+(localStorage.getItem('gh_2048_best')||0);S.solo.twenty48={g,score:0,best,won:false,continued:false,over:false,newCells:[]};addTile48(S.solo.twenty48);addTile48(S.solo.twenty48);}
function addTile48(s){const e=[];for(let r=0;r<4;r++)for(let c=0;c<4;c++)if(!s.g[r][c])e.push([r,c]);if(!e.length)return;const[r,c]=pick(e);s.g[r][c]=Math.random()<.9?2:4;s.newCells=[[r,c]];}
function rotateCW(g){return Array.from({length:4},(_,r)=>Array.from({length:4},(_,c)=>g[3-c][r]));}
function canMove48(g){for(let r=0;r<4;r++)for(let c=0;c<4;c++){if(!g[r][c])return true;if(c<3&&g[r][c]===g[r][c+1])return true;if(r<3&&g[r][c]===g[r+1][c])return true;}return false;}
function move2048(dir){
  const s=S.solo.twenty48;if(s.over)return;
  const rots={up:3,right:2,down:1,left:0};let g=s.g.map(r=>[...r]);
  for(let i=0;i<rots[dir];i++)g=rotateCW(g);
  let moved=false;s.newCells=[];
  for(let r=0;r<4;r++){const row=g[r].filter(v=>v);const merged=[];for(let i=0;i<row.length;i++){if(i+1<row.length&&row[i]===row[i+1]){merged.push(row[i]*2);s.score+=row[i]*2;i++;}else merged.push(row[i]);}while(merged.length<4)merged.push(0);if(merged.join()!==g[r].join())moved=true;g[r]=merged;}
  const back=(4-rots[dir])%4;for(let i=0;i<back;i++)g=rotateCW(g);
  if(moved){s.g=g;if(s.score>s.best){s.best=s.score;localStorage.setItem('gh_2048_best',s.best);}if(!s.won&&g.flat().includes(2048)){s.won=true;setTimeout(showConfetti,200);}addTile48(s);if(!canMove48(s.g))s.over=true;render();}
}
function render2048(){
  const s=S.solo.twenty48;
  const tiles=s.g.map((row,r)=>row.map((v,c)=>`<div class="tile-2048 t${v>4096?4096:v}${s.newCells.some(([nr,nc])=>nr===r&&nc===c)?' tile-new':''}">${v||''}</div>`).join('')).join('');
  const wb=s.won&&!s.continued?`<div class="notice ok" style="width:100%;text-align:center">&#127942; 2048 reached! <button class="btn sm teal" data-action="t48-continue" style="margin-left:8px">Keep going &#8594;</button></div>`:'';
  const ob=s.over?`<div class="notice err" style="width:100%;text-align:center">Game Over!</div>`:'';
  return `<div class="scene"><div class="sboxes"><div class="sbox"><div class="slbl">Score</div><div class="sval">${s.score}</div></div><div class="sbox"><div class="slbl">Best</div><div class="sval">${s.best}</div></div></div>${wb}${ob}<div class="grid-2048">${tiles}</div><div class="footer-note">Arrow keys or swipe to slide &nbsp;&bull;&nbsp; Merge tiles to reach 2048!</div></div>`;
}

/* ════════════════════════════════════════════════════════
   MINESWEEPER
════════════════════════════════════════════════════════ */
function initMinesweeper(diff='easy'){
  const cfg={easy:[9,9,10],medium:[16,9,25],hard:[16,16,40]}[diff]||[9,9,10];
  const[cols,rows,mines]=cfg;
  const board=Array.from({length:rows},()=>Array.from({length:cols},()=>({mine:false,revealed:false,flagged:false,adj:0,hit:false})));
  S.solo.minesweeper={diff,rows,cols,mines,board,flagMode:false,gameOver:false,won:false,firstClick:true,remaining:rows*cols-mines,flagCount:0,t0:null};
}
function mineGen(sr,sc){
  const s=S.solo.minesweeper;const{rows,cols,mines,board}=s;
  const safe=new Set();for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){const nr=sr+dr,nc=sc+dc;if(nr>=0&&nc>=0&&nr<rows&&nc<cols)safe.add(`${nr},${nc}`);}
  const pos=[];for(let r=0;r<rows;r++)for(let c=0;c<cols;c++)if(!safe.has(`${r},${c}`))pos.push([r,c]);
  shuffle(pos).slice(0,mines).forEach(([r,c])=>board[r][c].mine=true);
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){if(board[r][c].mine)continue;let cnt=0;for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){const nr=r+dr,nc=c+dc;if(nr>=0&&nc>=0&&nr<rows&&nc<cols&&board[nr][nc].mine)cnt++;}board[r][c].adj=cnt;}
  s.firstClick=false;s.t0=Date.now();
}
function mineReveal(r,c){
  const s=S.solo.minesweeper;if(s.gameOver||s.won)return;
  const cell=s.board[r][c];if(cell.flagged)return;
  if(s.flagMode){mineFlag(r,c);return;}
  if(s.firstClick)mineGen(r,c);
  if(cell.revealed)return;
  if(cell.mine){cell.hit=true;s.board.forEach(row=>row.forEach(cl=>{if(cl.mine)cl.revealed=true;}));s.gameOver=true;render();return;}
  const q=[[r,c]];const vis=new Set();
  while(q.length){const[cr,cc]=q.shift();const k=`${cr},${cc}`;if(vis.has(k))continue;vis.add(k);const cur=s.board[cr][cc];if(cur.revealed||cur.flagged||cur.mine)continue;cur.revealed=true;s.remaining--;if(cur.adj===0)for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){const nr=cr+dr,nc=cc+dc;if(nr>=0&&nc>=0&&nr<s.rows&&nc<s.cols&&!vis.has(`${nr},${nc}`))q.push([nr,nc]);}}
  if(s.remaining<=0){s.won=true;setTimeout(showConfetti,200);}render();
}
function mineFlag(r,c){const s=S.solo.minesweeper;if(s.gameOver||s.won)return;const cell=s.board[r][c];if(cell.revealed)return;if(cell.flagged){cell.flagged=false;s.flagCount--;}else{cell.flagged=true;s.flagCount++;}render();}
function renderMinesweeper(){
  const s=S.solo.minesweeper;
  const elapsed=s.t0?Math.floor((Date.now()-s.t0)/1000):0;
  const cSz=s.cols>9?'width:28px;height:28px;font-size:.74rem':'width:38px;height:38px;font-size:.9rem';
  const gap=s.cols>9?'2px':'3px';
  const cells=s.board.flatMap((row,r)=>row.map((cell,c)=>{
    let cls='mine-cell';let con='';
    if(cell.revealed){cls+=' revealed';if(cell.mine){cls+=cell.hit?' mine-hit':' mine-shown';con='&#128163;';}else if(cell.adj>0)con=`<span class="m${cell.adj}">${cell.adj}</span>`;}
    else if(cell.flagged){cls+=' flagged';con='&#128681;';}
    return `<button class="${cls}" style="${cSz}" data-action="mine-reveal" data-r="${r}" data-c="${c}">${con}</button>`;
  })).join('');
  const rem=s.mines-s.flagCount;
  const st=s.won?'&#127881; Field cleared!':s.gameOver?'&#128165; Boom! Game over.':'&#128163; '+rem+' mines &nbsp;&bull;&nbsp; &#9201; '+elapsed+'s'+(s.firstClick?' &mdash; tap to start':'');
  return `<div class="scene"><div class="notice${s.won?' ok':s.gameOver?' err':''}">${st}</div><div class="toolbar"><button class="btn sm${s.flagMode?' teal':''}" data-action="mine-flag-toggle">&#128681; ${s.flagMode?'Flag ON':'Flag'}</button></div><div class="boardbox"><div class="mine-grid" style="grid-template-columns:repeat(${s.cols},${s.cols>9?'28px':'38px'});gap:${gap}">${cells}</div></div><div class="footer-note">Tap to reveal &nbsp;&bull;&nbsp; Flag Mode / long-press to flag</div></div>`;
}


/* ════════════════════════════════════════════════════════
   SNAKE
════════════════════════════════════════════════════════ */
function spawnFood(snake,grid){const occ=new Set(snake.map(([r,c])=>`${r},${c}`));const e=[];for(let r=0;r<grid;r++)for(let c=0;c<grid;c++)if(!occ.has(`${r},${c}`))e.push([r,c]);return e.length?pick(e):[0,0];}
function initSnake(){
  stopSnake();
  const best=+(localStorage.getItem('gh_snake_best')||0);
  const snake=[[10,10],[10,9],[10,8]];
  S.solo.snake={grid:20,snake,dir:[0,1],nextDir:[0,1],food:spawnFood(snake,20),score:0,best,over:false,started:false,timer:null,speed:180};
}
function snakeTick(){
  const s=S.solo.snake;if(!s||s.over)return;
  s.dir=s.nextDir;
  const h=s.snake[0];
  const nh=[(h[0]+s.dir[0]+s.grid)%s.grid,(h[1]+s.dir[1]+s.grid)%s.grid];
  if(s.snake.some(([r,c])=>r===nh[0]&&c===nh[1])){
    s.over=true;if(s.score>s.best){s.best=s.score;localStorage.setItem('gh_snake_best',s.best);}
    clearInterval(s.timer);s.timer=null;render();return;
  }
  s.snake.unshift(nh);
  if(nh[0]===s.food[0]&&nh[1]===s.food[1]){
    s.score+=10;if(s.score>s.best){s.best=s.score;localStorage.setItem('gh_snake_best',s.best);}
    s.food=spawnFood(s.snake,s.grid);
    if(s.score%60===0&&s.speed>80){clearInterval(s.timer);s.speed=Math.max(80,s.speed-18);s.timer=setInterval(snakeTick,s.speed);}
  }else{s.snake.pop();}
  render();
}
function snakeDir(dr,dc){
  const s=S.solo.snake;if(!s||s.over)return;
  if(dr===-s.dir[0]&&dc===-s.dir[1])return;
  s.nextDir=[dr,dc];
  if(!s.started){s.started=true;s.timer=setInterval(snakeTick,s.speed);}
}
function renderSnake(){
  const s=S.solo.snake;
  const cells=Array(s.grid*s.grid).fill('');
  s.snake.forEach(([r,c],i)=>cells[r*s.grid+c]=i===0?'head':i===s.snake.length-1?'tail':'body');
  cells[s.food[0]*s.grid+s.food[1]]='food';
  const grid=cells.map(v=>`<div class="sc${v?' '+v:''}"></div>`).join('');
  return `<div class="scene"><div class="sboxes"><div class="sbox"><div class="slbl">Score</div><div class="sval">${s.score}</div></div><div class="sbox"><div class="slbl">Best</div><div class="sval">${s.best}</div></div></div>${s.over?`<div class="notice err" style="text-align:center">&#128165; Game Over &mdash; score: ${s.score}! <button class="btn sm teal" data-action="new-solo">&#8635; Play Again</button></div>`:''}${!s.started&&!s.over?`<div class="soft" style="text-align:center;font-size:.82rem">Tap the board or press an arrow key to start &mdash; avoid your own tail!</div>`:''}<div class="snake-wrap"><div class="snake-board" id="snakeBoard" data-action="snake-tap">${grid}</div></div><div class="footer-note">Arrow keys or swipe to move &bull; Eating food speeds you up!</div></div>`;
}

/* ════════════════════════════════════════════════════════
   MEMORY MATCH
════════════════════════════════════════════════════════ */
const MEM_EMOJIS=['&#127918;','&#127919;','&#127920;','&#127922;','&#127932;','&#127881;','&#11088;','&#127912;','&#127794;','&#127752;','&#127881;','&#128640;','&#128758;','&#127942;'];
function initMemory(diff='easy'){
  stopSnake();
  const sizes={easy:16,medium:20,hard:24};const total=sizes[diff]||16;const pairs=total/2;
  const syms=MEM_EMOJIS.slice(0,pairs);
  const cards=shuffle([...syms,...syms]).map((sym,i)=>({id:i,sym,up:false,matched:false}));
  S.solo.memory={diff,cards,cols:4,rows:total/4,pairs,matched:0,moves:0,flip:[],won:false,t0:null};
}
function memFlip(id){

  if(!s.t0)s.t0=Date.now();

  if(s.flip.length===2){
    s.moves++;

function tttLines(){return[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];}
function tttWin(board){return tttLines().find(([a,b,c])=>board[a]&&board[a]===board[b]&&board[a]===board[c]);}

/* ════════════════════════════════════════════════════════
   CHECKERS  (fixed: local selection, no refreshRoom on click)
════════════════════════════════════════════════════════ */
function hasAnyCapture(board,side){for(let r=0;r<8;r++)for(let c=0;c<8;c++){const p=board[r][c];if(p&&pSide(p)===side&&checkMoves(board,r,c).some(m=>m.cap))return true;}return false;}
function legalCheckMoves(board,r,c){const p=board[r][c];if(!p)return[];const side=pSide(p);const all=checkMoves(board,r,c);if(hasAnyCapture(board,side))return all.filter(m=>m.cap);return all;}
function pSide(p){if(!p)return null;const l=p.toLowerCase();return l==='r'?'r':l==='b'?'b':null;}
function checkMoves(board,r,c){
  const p=board[r][c];if(!p)return[];const side=pSide(p);
  const dirs=[];if(p==='r'||p==='R')dirs.push([-1,-1],[-1,1]);if(p==='b'||p==='B')dirs.push([1,-1],[1,1]);if(p==='R')dirs.push([1,-1],[1,1]);if(p==='B')dirs.push([-1,-1],[-1,1]);
  const out=[];
  for(const[dr,dc]of dirs){const nr=r+dr,nc=c+dc,jr=r+2*dr,jc=c+2*dc;if(inside(nr,nc)&&!board[nr][nc])out.push({r:nr,c:nc,cap:null});if(inside(jr,jc)&&board[nr][nc]&&pSide(board[nr][nc])!==side&&!board[jr][jc])out.push({r:jr,c:jc,cap:[nr,nc]});}
  return out;
}
async function checkersMove(r,c){
  const g=S.room.state;if(!g||g.gameOver||g.turnSeat!==S.me)return;
  const mySide=S.me==='A'?'r':'b';const p=g.board[r][c];
  if(S.localSelect){
    const[sr,sc]=S.localSelect;const mv=legalCheckMoves(g.board,sr,sc).find(m=>m.r===r&&m.c===c);
    if(mv){
      g.board[r][c]=g.board[sr][sc];g.board[sr][sc]=null;
      if(mv.cap)g.board[mv.cap[0]][mv.cap[1]]=null;
      if(g.board[r][c]==='r'&&r===0)g.board[r][c]='R';
      if(g.board[r][c]==='b'&&r===7)g.board[r][c]='B';
      const moreCap=mv.cap&&checkMoves(g.board,r,c).some(m=>m.cap);
      if(moreCap){S.localSelect=[r,c];}
      else{S.localSelect=null;g.turnSeat=otherSeat(g.turnSeat);}
      const side=pSide(g.board[r][c]);const opp=side==='r'?'b':'r';
      if(!g.board.flat().some(x=>x&&pSide(x)===opp)){g.winner=S.me;g.gameOver=true;g.rematch={A:false,B:false};g.rematchStarter=otherSeat(S.me);setTimeout(showConfetti,200);}
      S.room.state=g;await saveRoomState().catch(()=>{});render();return;
    }
    if(p&&pSide(p)===mySide&&legalCheckMoves(g.board,r,c).length){S.localSelect=[r,c];render();}
    else{S.localSelect=null;render();}
    return;
  }
  if(p&&pSide(p)===mySide&&legalCheckMoves(g.board,r,c).length){S.localSelect=[r,c];render();}
}
function renderCheckers(){
  const g=S.room.state;
  const mySide2=S.me==='A'?'r':'b';
  const forcedCapture=g.turnSeat===S.me&&hasAnyCapture(g.board,mySide2);
  const tgts=S.localSelect?legalCheckMoves(g.board,S.localSelect[0],S.localSelect[1]):[];
  const status=g.gameOver?(g.winner==='D'?'Draw!':`${seatName(g.winner)} wins! &#127881;`):`${seatName(g.turnSeat)}'s turn${forcedCapture?' &mdash; &#9889; capture required!':''}`;
  const cells=g.board.flatMap((row,r)=>row.map((p,c)=>{
    const dk=(r+c)%2===1;const sel=S.localSelect&&S.localSelect[0]===r&&S.localSelect[1]===c;
    const tgt=tgts.some(m=>m.r===r&&m.c===c);
    const mustCapt=forcedCapture&&p&&pSide(p)===mySide2&&checkMoves(g.board,r,c).some(m=>m.cap);
    const icon=p?`<span class="piece ${p==='r'||p==='R'?'red':'black'}">${p==='r'?'&#9920;':p==='R'?'&#9921;':p==='b'?'&#9922;':'&#9923;'}</span>`:'';
    return `<button class="sq ${dk?'dk':'lt'}${sel?' selected':''}${tgt?' target'+(p?' occ':''):''}${mustCapt?' force-capture':''}" data-action="ck-cell" data-r="${r}" data-c="${c}">${icon}</button>`;
  })).join('');
  return `<div class="scene"><div class="notice ${g.gameOver?'ok':''}">${status}</div><div class="boardbox"><div class="checkers-board">${cells}</div></div><div class="footer-note">A=Red &#8593; &nbsp;&bull;&nbsp; B=Black &#8595; &nbsp;&bull;&nbsp; Glowing = must capture.</div></div>`;
}

/* ════════════════════════════════════════════════════════
   CHESS  (fixed: local selection, full legal move check)
════════════════════════════════════════════════════════ */
function pseudoMoves(board,r,c,atkOnly=false){
  const p=board[r][c];if(!p)return[];const sd=p.c;const mv=[];
  const add=(nr,nc)=>{if(!inside(nr,nc))return;const t=board[nr][nc];if(!t)mv.push({r:nr,c:nc});else if(t.c!==sd)mv.push({r:nr,c:nc});};
  if(p.t==='p'){const dir=sd==='w'?-1:1,st=sd==='w'?6:1;if(!atkOnly&&!board[r+dir]?.[c]){mv.push({r:r+dir,c});if(r===st&&!board[r+2*dir]?.[c])mv.push({r:r+2*dir,c});}for(const dc of[-1,1]){const nr=r+dir,nc=c+dc;if(!inside(nr,nc))continue;const t=board[nr][nc];if(atkOnly)mv.push({r:nr,c:nc});else if(t&&t.c!==sd)mv.push({r:nr,c:nc});}}
  if(p.t==='n')[[1,2],[2,1],[-1,2],[-2,1],[1,-2],[2,-1],[-1,-2],[-2,-1]].forEach(([dr,dc])=>add(r+dr,c+dc));
  const sliders=[];if(p.t==='b'||p.t==='q')sliders.push([1,1],[1,-1],[-1,1],[-1,-1]);if(p.t==='r'||p.t==='q')sliders.push([1,0],[-1,0],[0,1],[0,-1]);
  for(const[dr,dc]of sliders){let nr=r+dr,nc=c+dc;while(inside(nr,nc)){const t=board[nr][nc];if(!t)mv.push({r:nr,c:nc});else{if(t.c!==sd)mv.push({r:nr,c:nc});break;}nr+=dr;nc+=dc;}}
  if(p.t==='k')for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++)if(dr||dc)add(r+dr,c+dc);
  return mv;
}
function attacked(board,r,c,bySide){for(let sr=0;sr<8;sr++)for(let sc=0;sc<8;sc++){const p=board[sr][sc];if(p&&p.c===bySide&&pseudoMoves(board,sr,sc,true).some(m=>m.r===r&&m.c===c))return true;}return false;}
function findKing(board,side){for(let r=0;r<8;r++)for(let c=0;c<8;c++){const p=board[r][c];if(p&&p.t==='k'&&p.c===side)return[r,c];}return null;}
function legalMoves(board,r,c){const p=board[r][c];if(!p)return[];const sd=p.c;return pseudoMoves(board,r,c,false).filter(m=>{const nb=cloneBoard(board);nb[m.r][m.c]=nb[r][c];nb[r][c]=null;if(nb[m.r][m.c].t==='p'&&(m.r===0||m.r===7))nb[m.r][m.c].t='q';const k=findKing(nb,sd);return k&&!attacked(nb,k[0],k[1],sd==='w'?'b':'w');});}
function updateChessStatus(g){
  const sd=g.turnSeat==='A'?'w':'b',opp=sd==='w'?'b':'w';
  let any=false;for(let r=0;r<8&&!any;r++)for(let c=0;c<8&&!any;c++){const p=g.board[r][c];if(p&&p.c===sd&&legalMoves(g.board,r,c).length)any=true;}
  const k=findKing(g.board,sd);const inChk=k?attacked(g.board,k[0],k[1],opp):false;
  g.status=`${sd==='w'?'White':'Black'} to move${inChk?' &mdash; Check!':''}`;
  if(!any){g.winner=inChk?(opp==='w'?'A':'B'):'D';g.gameOver=true;g.rematch={A:false,B:false};g.rematchStarter=g.winner!=='D'?(g.winner==='A'?'B':'A'):'A';}
}
async function chessMove(r,c){
  const g=S.room.state;if(!g||g.gameOver)return;if(g.turnSeat!==S.me){setStatus('Not your turn',false);return;}
  const mySide=S.me==='A'?'w':'b';
  if(S.localSelect){
    const[sr,sc]=S.localSelect;const mv=S.localLegal.find(m=>m.r===r&&m.c===c);
    if(mv){
      const nb=cloneBoard(g.board);nb[r][c]=nb[sr][sc];nb[sr][sc]=null;
      if(nb[r][c].t==='p'&&(r===0||r===7))nb[r][c].t='q';
      g.board=nb;g.turnSeat=otherSeat(g.turnSeat);S.localSelect=null;S.localLegal=[];
      updateChessStatus(g);if(g.gameOver)setTimeout(showConfetti,200);
      S.room.state=g;await saveRoomState().catch(()=>{});render();return;
    }
    const piece=g.board[r][c];
    if(piece&&piece.c===mySide){const leg=legalMoves(g.board,r,c);if(leg.length){S.localSelect=[r,c];S.localLegal=leg;render();return;}}
    S.localSelect=null;S.localLegal=[];render();return;
  }
  const piece=g.board[r][c];
  if(piece&&piece.c===mySide){const leg=legalMoves(g.board,r,c);if(leg.length){S.localSelect=[r,c];S.localLegal=leg;render();}else setStatus('No legal moves for that piece',false);}
}
function renderChess(){

}

/* ════════════════════════════════════════════════════════
   BATTLESHIP  (fixed: local orient, lock phase, correct shot display)

function clearBattlePrev(){document.querySelectorAll('.cell.ship-preview,.cell.ship-preview-invalid').forEach(el=>el.classList.remove('ship-preview','ship-preview-invalid'));}
function updateBattlePrev(cell){
  clearBattlePrev();if(!cell||!S.room?.state)return;
  const g=S.room.state;const myPhase=S.me==='A'?'placeA':'placeB';
  if(g.phase!==myPhase||S.battleAwaitingLock)return;
  const my=g.sides[S.me];const sz=g.shipSizes[g.shipIndex];if(!sz)return;
  const r=+cell.dataset.r,c_=+cell.dataset.c;
  let valid=true;const coords=[];
  for(let i=0;i<sz;i++){const nr=r+(S.battleOrient==='V'?i:0),nc=c_+(S.battleOrient==='H'?i:0);if(!inside6(nr,nc)||my.board[nr][nc])valid=false;coords.push([nr,nc]);}
  coords.forEach(([nr,nc])=>{const el=document.querySelector(`[data-action="bt-place"][data-r="${nr}"][data-c="${nc}"]`);if(el)el.classList.add(valid?'ship-preview':'ship-preview-invalid');});
}
function battlePlace(r,c){
  const g=S.room.state;const myPhase=S.me==='A'?'placeA':'placeB';
  if(!g||g.gameOver||g.phase!==myPhase||S.battleAwaitingLock)return;
  const my=g.sides[S.me];const sz=g.shipSizes[g.shipIndex];if(!sz)return;
  const coords=[];
  for(let i=0;i<sz;i++){const nr=r+(S.battleOrient==='V'?i:0),nc=c+(S.battleOrient==='H'?i:0);if(!inside6(nr,nc))return setStatus('Ship does not fit here',false);if(my.board[nr][nc])return setStatus('Ships cannot overlap',false);coords.push([nr,nc]);}
  coords.forEach(([nr,nc])=>my.board[nr][nc]='S');my.ships.push(coords);g.shipIndex++;
  if(g.shipIndex>=g.shipSizes.length){my.placed=true;g.shipIndex=0;S.battleAwaitingLock=true;}
  S.room.state=g;saveRoomState().catch(()=>{});render();
}
async function battleLock(){
  const g=S.room.state;S.battleAwaitingLock=false;
  if(S.me==='A'){g.turnSeat='B';g.phase='placeB';}else{g.turnSeat='A';g.phase='battle';}
  S.room.state=g;await saveRoomState().catch(()=>{});render();
}
function battleReset(){
  const g=S.room.state;if(!g)return;const my=g.sides[S.me];
  my.board=Array.from({length:6},()=>Array(6).fill(''));my.ships=[];my.placed=false;
  g.shipIndex=0;S.battleAwaitingLock=false;S.room.state=g;render();
}
function battleFire(r,c){
  const g=S.room.state;if(!g||g.gameOver||g.phase!=='battle'||g.turnSeat!==S.me)return;
  const me=S.me,opp=otherSeat(me);const oppSide=g.sides[opp];const myShots=g.sides[me].shots;
  if(myShots[r][c])return setStatus('Already fired there',false);
  if(oppSide.board[r][c]==='S'){myShots[r][c]='H';oppSide.board[r][c]='X';if(oppSide.board.flat().every(v=>v!=='S')){g.winner=me;g.gameOver=true;g.rematch={A:false,B:false};g.rematchStarter=otherSeat(me);setTimeout(showConfetti,200);}else g.turnSeat=opp;setStatus('&#128293; Hit!',false);}
  else{myShots[r][c]='M';g.turnSeat=opp;setStatus('Miss &middot;',false);}
  S.room.state=g;saveRoomState().then(()=>render()).catch(()=>{});
}
function renderBattleship(){

    const status=g.gameOver?(g.winner==='D'?'Draw.':`${seatName(g.winner)} wins! &#127881;`):(isMyTurn?'&#127919; Your turn &mdash; fire!':'&#8987; Waiting&#8230;');
    return `<div class="scene"><div class="notice ${g.gameOver?'ok':''}">${status}</div><div style="display:flex;flex-wrap:wrap;gap:22px;justify-content:center;width:100%"><div style="text-align:center"><div class="muted" style="font-size:.7rem;text-transform:uppercase;letter-spacing:.1em;margin-bottom:7px">Enemy Waters</div><div class="boardbox"><div class="bat-board fire-grid">${fire}</div></div></div><div style="text-align:center"><div class="muted" style="font-size:.7rem;text-transform:uppercase;letter-spacing:.1em;margin-bottom:7px">Your Fleet</div><div class="boardbox"><div class="bat-board my-grid">${myGrid}</div></div></div></div><div class="footer-note">&#10005; Hit &nbsp;&bull;&nbsp; &#8901; Miss &nbsp;&bull;&nbsp; Sink all 3 ships to win!</div></div>`;
  }

    return `<div class="scene" style="text-align:center"><div class="notice ok">&#9989; All ships placed! Review and lock in.</div><div class="boardbox"><div class="bat-board fire-grid">${prev}</div></div><div class="toolbar" style="justify-content:center;gap:12px"><button class="btn primary" data-action="bt-lock">&#128274; Lock In Ships!</button><button class="btn danger" data-action="bt-reset">&#8617; Redo</button></div></div>`;
  }
  if(g.phase!==myPhase){return `<div class="scene"><div class="soft" style="text-align:center">&#8987; Waiting for ${seatName(opp)} to place their ships&#8230;</div></div>`;}
  const curSz=g.shipSizes[g.shipIndex];
  const pips=g.shipSizes.map((s,i)=>`<span class="rbadge${i===g.shipIndex?' draw':i<g.shipIndex?' win':''}">${i<g.shipIndex?'&#10003; ':i===g.shipIndex?'&#8594; ':''} ${s}u</span>`).join('');
  const bCells=my.board.flatMap((row,r)=>row.map((v,c_)=>`<button class="bsq ${(r+c_)%2===1?'dk':'lt'}${v==='S'?' has-ship':''}" data-action="bt-place" data-r="${r}" data-c="${c_}">${v==='S'?'<span style="font-size:.7rem">&#9632;</span>':''}</button>`)).join('');
  return `<div class="scene"><div class="notice">Placing ${curSz}-unit ship (${g.shipSizes.length-g.shipIndex} left)</div><div class="toolbar">${pips}<button class="btn sm" data-action="bt-orient">&#8635; ${S.battleOrient==='H'?'H':'V'}</button></div><div class="boardbox"><div class="bat-board fire-grid">${bCells}</div></div><div class="footer-note">Tap a cell to place &nbsp;&bull;&nbsp; Rotate to change direction</div></div>`;
}
function resetForRematch(){const starter=S.room.state.rematchStarter||'A';S.room.state=roomState(S.room.game,starter);S.room.state.rematch={A:false,B:false};S.room.state.rematchStarter=otherSeat(starter);S.room.state.quit={A:false,B:false};resetLocalState();}
async function voteRematch(vote){
  if(!S.room||!S.me)return;const g=S.room.state;if(!g.gameOver)return;
  g.rematch[S.me]=vote;S.room.state=g;await saveRoomState().catch(()=>{});
  if(g.rematch.A&&g.rematch.B){resetForRematch();await saveRoomState().catch(()=>{});await refreshRoom().catch(()=>{});}
  render();
}
function renderEndcard(){
  const g=S.room.state;const w=g.winner;const me=S.me;
  if(g.quit?.[otherSeat(me||'A')]){return `<div class="overlay"><div class="modal"><div class="modal-kicker">Game over</div><h2>Opponent left &#128075;</h2><div class="muted" style="font-size:.85rem;margin-top:4px">The other player has left.</div><div class="hr"></div><div class="toolbar"><button class="btn primary" data-action="home">&#8592; Go Home</button></div></div></div>`;}
  const res=w==='D'?'draw':(w===me?'win':'loss');
  const title=w==='D'?'Draw &#9996;&#65039;':`${seatName(w)} wins! &#127942;`;
  const detail=w==='D'?'No winner this round.':`Next: ${seatName(g.rematchStarter||otherSeat(w||'A'))} starts.`;
  const both=g.rematch?.A&&g.rematch?.B;
  return `<div class="overlay"><div class="modal"><div class="modal-kicker">Match finished</div><h2>${title}</h2><div class="muted" style="font-size:.82rem;margin-top:3px">${detail}</div><div class="rbadges"><span class="rbadge ${res}">${w==='D'?'Draw':(res==='win'?'You won! &#127881;':'You lost')}</span><span class="rbadge${g.rematch?.A?' win':''}">A: ${g.rematch?.A?'Ready':'&mdash;'}</span><span class="rbadge${g.rematch?.B?' win':''}">B: ${g.rematch?.B?'Ready':'&mdash;'}</span></div><div class="hr"></div><div class="toolbar"><button class="btn primary" data-action="vote-rematch">&#9654; Play again</button><button class="btn danger" data-action="leave-room">&#128075; Leave</button></div><div class="soft" style="margin-top:9px;font-size:.78rem">${both?'Both ready! Starting&#8230;':'Vote to rematch or leave.'}</div></div></div>`;
}

/* ════════════════════════════════════════════════════════
   LAYOUT HELPERS
════════════════════════════════════════════════════════ */
function card(kind,title,desc,btn,action){return `<div class="card"><div class="badge ${kind==='Solo'?'solo':'multi'}">${kind}</div><h3>${title}</h3><p>${desc}</p><div class="row"><button class="btn primary" data-action="${action}">${btn}</button></div></div>`;}
function syncBar(){return `<div class="syncbar"><div id="sync" class="sync-left"><span style="width:16px;height:16px;display:inline-block"></span><span>${esc(syncText())}</span></div><div class="muted small">${S.room?`Room ${esc(S.room.roomId)}`:'Local only'}</div></div>`;}
function sidePanel(){
  const turn=S.room?.state?.turnSeat?seatName(S.room.state.turnSeat):'&mdash;';
  const link=shareUrl();
  return `<div class="scard"><div class="slbl">Room</div><div class="seat-row">${S.room?`<span class="stag mine">${seatName(S.me)}</span><span class="stag turn">Turn: ${turn}</span>`:'<span class="stag">No room</span>'}</div><input class="room-link" style="width:100%;font-size:.72rem;font-family:ui-monospace,monospace" value="${esc(link)}" readonly onclick="this.select()" /><div class="toolbar" style="margin-top:9px"><button class="btn sm teal" data-action="copy-link">Copy</button><button class="btn sm" data-action="do-refresh">&#8635;</button></div></div><div class="scard"><div class="slbl">Sync</div><div class="sync-row" id="sync"><span style="width:14px;height:14px;display:inline-block"></span><span>${esc(syncText())}</span></div></div>`;
}
function renderHome(){
  const url=localStorage.getItem('gh_backend_url')||CONFIG.backendUrl;
  const solo=[['&#128290;','Sudoku','Fill the 9x9 grid — no repeats per row, column or box.','solo-sudoku'],['&#128221;','Wordle','Guess the mystery 5-letter word in 6 tries.','solo-wordle'],['&#9998;','Crossword','Mini crossword with across and down clues.','solo-crossword'],['&#127862;','2048','Slide tiles to merge — can you reach 2048?','solo-twenty48'],['&#128163;','Minesweeper','Clear the minefield without hitting any mine.','solo-minesweeper'],['&#128013;','Snake','Grow your snake — avoid walls and your own tail!','solo-snake'],['&#127183;','Memory Match','Flip cards and match every pair from memory.','solo-memory']];
  const multi=[['&#11093;','Tic-Tac-Toe','Classic 3-in-a-row, share a link and play live.','multi-ttt'],['&#128993;','Connect Four','Drop chips and line up 4 before your opponent.','multi-connect4'],['&#9920;','Checkers','Turn-based captures with mandatory jumps enforced.','multi-checkers'],['&#9823;','Chess','Full legal moves, check detection, and pawn promotion.','multi-chess'],['&#9875;','Battleship','Place ships, lock in, then hunt and sink the fleet!','multi-battleship']];
  const mc=(list,kind)=>list.map(([ico,name,desc,action])=>`<button class="gcard ${kind}" data-action="${action}"><div class="gcard-ico">${ico}</div><div class="gcard-body"><div class="gcard-name">${name}</div><div class="gcard-desc">${desc}</div><div class="gcard-foot"><span class="gbadge gbadge-${kind}">${kind==='solo'?'Solo':'Multi'}</span><span class="gcard-cta">Play &#8594;</span></div></div></button>`).join('');
  return `<div class="page"><div class="home-hero"><div class="home-title">GameHub</div><div class="home-sub">12 games &mdash; solo puzzles and live multiplayer rooms.</div></div><div class="cfg-card"><div class="cfg-label">&#9881; Apps Script Backend URL</div><div class="cfg-row"><input id="backendUrlInput" class="field" style="flex:1;min-width:0" value="${esc(url)}" placeholder="https://script.google.com/macros/s/.../exec" /><button class="btn teal sm" data-action="save-backend-url">Save</button><button class="btn sm" data-action="test-backend">Test</button></div><div id="backendStatus"></div></div><div class="section-hdr"><div class="sdot sdot-gold"></div><div class="shdr-label">Solo Games</div></div><div class="game-grid">${mc(solo,'solo')}</div><div class="section-hdr"><div class="sdot sdot-teal"></div><div class="shdr-label">Multiplayer</div></div><div class="game-grid">${mc(multi,'multi')}</div></div>`;
}
function renderSolo(){
  const g=S.game;let tb='';
  if(g==='sudoku')tb=`<select id="soloDiff" class="sel"><option>easy</option><option selected>medium</option><option>hard</option></select><button class="btn sm${S.notesMode?' notes-on':''}" data-action="toggle-notes">${S.notesMode?'&#9998; Notes ON':'Notes'}</button>`;
  if(g==='wordle')tb=`<select id="soloDiff" class="sel"><option>easy</option><option selected>medium</option><option>hard</option></select>`;
  if(g==='crossword')tb=`<select id="cwPick" class="sel">${CROSSWORDS.map((x,i)=>`<option value="${i}">${x.name}</option>`).join('')}</select>`;
  if(g==='minesweeper')tb=`<select id="mineDiff" class="sel"><option value="easy">Easy 9x9</option><option value="medium">Medium 16x9</option><option value="hard">Hard 16x16</option></select>`;
  if(g==='memory')tb=`<select id="memDiff" class="sel"><option value="easy">Easy (4x4)</option><option value="medium">Medium (4x5)</option><option value="hard">Hard (4x6)</option></select>`;
  tb+=`<button class="btn sm gold" data-action="new-solo">&#8635; New</button>`;
  let body='';
  if(g==='sudoku')body=renderSudoku();else if(g==='wordle')body=renderWordle();else if(g==='crossword')body=renderCrossword();else if(g==='twenty48')body=render2048();else if(g==='minesweeper')body=renderMinesweeper();else if(g==='snake')body=renderSnake();else if(g==='memory')body=renderMemory();
  return `<div class="page"><div class="gshell"><div class="gmain"><div class="gtopbar"><div><div class="gtitle">${gameLabel(g)}</div><div class="gsub">Solo &mdash; no server required</div></div><div class="toolbar">${tb}</div></div><div class="gbody">${body}</div></div><div class="gsidebar"><div class="scard"><div class="slbl">Solo Mode</div><div class="soft" style="font-size:.78rem;padding:8px 10px">Progress saves locally in your browser.</div></div></div></div></div>`;
}

function renderRoom(){
  const g=S.game;
  let body;
  if(!S.room){
    if(S.roomError){
      const saved=localStorage.getItem('gh_backend_url')||CONFIG.backendUrl;
      body=`<div class="scene" style="gap:16px"><div class="notice err" style="text-align:left"><strong>&#10060; ${esc(S.roomError)}</strong><br><span style="font-size:.82rem;opacity:.8">Most likely your Apps Script URL changed &mdash; paste the new one below and retry.</span></div><div class="toolbar" style="width:100%"><input id="urlFixInput" class="field" style="flex:1;min-width:0" value="${esc(saved)}" /><button class="btn teal sm" data-action="save-backend-url-fix">Save URL</button></div><div class="toolbar" style="justify-content:center"><button class="btn primary" data-action="retry-room">&#8635; Retry</button><button class="btn sm" data-action="test-backend-room">&#128268; Test</button><button class="btn sm gold" data-action="home">&#8592; Home</button></div></div>`;
    }else{body=`<div class="soft" style="text-align:center">Connecting&#8230;</div>`;}
  }else{body=g==='ttt'?renderTTT():g==='connect4'?renderConnect4():g==='checkers'?renderCheckers():g==='chess'?renderChess():renderBattleship();}
  const overlay=S.room?.state?.gameOver?renderEndcard():'';
  return `<div class="page"><div class="gshell"><div class="gmain" style="position:relative">${overlay}<div class="gtopbar"><div><div class="gtitle">${gameLabel(g)}</div><div class="gsub">Room: <code>${S.room?.roomId||'...'}</code></div></div><div class="toolbar"><button class="btn sm teal" data-action="copy-link">Copy link</button><button class="btn sm gold" data-action="new-room">New room</button></div></div><div class="gbody">${body}</div></div><div class="gsidebar">${sidePanel()}</div></div></div>`;
}
function render(){
  homeBtn.style.display=S.screen==='home'?'none':'inline-flex';
  app.innerHTML=S.screen==='home'?renderHome():S.screen==='solo'?renderSolo():renderRoom();
  renderSync();
  const uIn=document.getElementById('backendUrlInput');
  if(uIn)uIn.value=localStorage.getItem('gh_backend_url')||CONFIG.backendUrl;
}

/* ════════════════════════════════════════════════════════
   ACTION DISPATCHER
════════════════════════════════════════════════════════ */
function handleAction(action,el){
  if(action==='home')return goHome();
  if(action==='reset-local'){S.solo={sudoku:null,wordle:null,crossword:null,twenty48:null,minesweeper:null};setStatus('Progress reset',false);render();return;}
  if(action==='save-backend-url'||action==='save-backend-url-fix'){
    const inp=document.getElementById(action==='save-backend-url'?'backendUrlInput':'urlFixInput');
    const val=(inp?.value||'').trim();
    if(val&&val.startsWith('https://')){localStorage.setItem('gh_backend_url',val);setStatus('Backend URL saved',false);const el=document.getElementById('backendStatus');if(el)el.textContent='Saved: '+val.slice(0,60)+'...';}
    else setStatus('Enter a valid https:// URL',false);return;
  }
  if(action==='test-backend'||action==='test-backend-room'){
    setStatus('Testing connection…',true);
    api({action:'ping'}).then(res=>{
      const msg=res.ok?'\u2714 Connected! Server responded.':'Backend error: '+(res.error||'unknown');
      setStatus(msg,false);
      const el=document.getElementById('backendStatus');if(el)el.textContent=msg;
    }).catch(err=>{
      const msg='\u2718 '+err.message+' \u2014 check your URL above.';
      setStatus(msg,false);
      const el=document.getElementById('backendStatus');if(el)el.textContent=msg;
    });return;
  }
  if(action==='retry-room'){S.roomError=null;openMulti(S.game);return;}
  if(action==='copy-link')return navigator.clipboard.writeText(shareUrl()).then(()=>setStatus('Link copied!',false)).catch(()=>setStatus('Copy failed',false));
  if(action==='do-refresh')return refreshRoom().catch(e=>setStatus(e.message,false));
  if(action==='resume-room'){const rid=qs('room'),gm=qs('game');if(rid&&gm){S.screen='room';S.game=gm;render();joinRoom(rid).catch(e=>setStatus(e.message,false));}return;}
  if(action==='solo-sudoku')return openSolo('sudoku');
  if(action==='solo-wordle')return openSolo('wordle');
  if(action==='solo-crossword')return openSolo('crossword');
  if(action==='solo-twenty48')return openSolo('twenty48');
  if(action==='solo-minesweeper')return openSolo('minesweeper');
  if(action==='solo-snake')return openSolo('snake');
  if(action==='solo-memory')return openSolo('memory');
  if(action==='multi-ttt')return openMulti('ttt');
  if(action==='multi-connect4')return openMulti('connect4');
  if(action==='multi-checkers')return openMulti('checkers');
  if(action==='multi-chess')return openMulti('chess');
  if(action==='multi-battleship')return openMulti('battleship');
  if(action==='new-room')return openMulti(S.game);
  if(action==='new-solo'){
    const diff=document.getElementById('soloDiff')?.value||'medium';
    const mDiff=document.getElementById('mineDiff')?.value||'easy';
    if(S.game==='sudoku')initSudoku(diff);else if(S.game==='wordle')initWordle(diff);else if(S.game==='crossword')initCrossword(+(document.getElementById('cwPick')?.value||0));else if(S.game==='twenty48')init2048();else if(S.game==='minesweeper')initMinesweeper(mDiff);
    render();return;
  }
  if(action==='toggle-notes'){S.notesMode=!S.notesMode;render();return;}
  if(action==='vote-rematch')return voteRematch(true);
  if(action==='leave-room')return leaveRoom();
  if(action==='sudoku-sel'){S.solo.sudoku.sel=[+el.dataset.r,+el.dataset.c];render();return;}
  if(action==='sudoku-num')return sudokuSet(...S.solo.sudoku.sel,el.dataset.n);
  if(action==='sudoku-clr')return sudokuSet(...S.solo.sudoku.sel,'');
  if(action==='wkey')return wKey(el.dataset.ch);
  if(action==='wback')return wBack();
  if(action==='wenter')return wEnter();
  if(action==='ttt-move')return tttMove(+el.dataset.i);
  if(action==='c4-move')return connectMove(+el.dataset.col);
  if(action==='ck-cell')return checkersMove(+el.dataset.r,+el.dataset.c);
  if(action==='ch-cell')return chessMove(+el.dataset.r,+el.dataset.c);
  if(action==='bt-orient'){S.battleOrient=S.battleOrient==='H'?'V':'H';clearBattlePrev();render();return;}
  if(action==='bt-place')return battlePlace(+el.dataset.r,+el.dataset.c);
  if(action==='bt-fire')return battleFire(+el.dataset.r,+el.dataset.c);
  if(action==='bt-lock')return battleLock();
  if(action==='bt-reset')return battleReset();
  if(action==='mine-reveal')return mineReveal(+el.dataset.r,+el.dataset.c);
  if(action==='mine-flag-toggle'){S.solo.minesweeper.flagMode=!S.solo.minesweeper.flagMode;render();return;}
  if(action==='t48-continue'){S.solo.twenty48.continued=true;render();return;}
  if(action==='snake-tap'){snakeDir(0,1);return;}
  if(action==='mem-flip')return memFlip(+el.dataset.id);
}

/* ════════════════════════════════════════════════════════
   EVENT LISTENERS
════════════════════════════════════════════════════════ */
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(el)handleAction(el.dataset.action,el);});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.id==='soloDiff'&&S.screen==='solo'){if(S.game==='sudoku')initSudoku(el.value);if(S.game==='wordle')initWordle(el.value);render();return;}
  if(el.id==='cwPick'){initCrossword(+el.value);render();return;}
  if(el.id==='mineDiff'){initMinesweeper(el.value);render();return;}
  if(el.matches('[data-action="cw-cell"]'))cwSet(+el.dataset.r,+el.dataset.c,el.value);
});
document.addEventListener('input',e=>{if(e.target.matches('[data-action="cw-cell"]'))cwSet(+e.target.dataset.r,+e.target.dataset.c,e.target.value);});
document.addEventListener('keydown',e=>{
  if(S.screen==='solo'&&S.game==='sudoku'){
    if(/^[1-9]$/.test(e.key)){e.preventDefault();sudokuSet(...S.solo.sudoku.sel,e.key);}
    else if(e.key==='Backspace'||e.key==='Delete'){e.preventDefault();sudokuSet(...S.solo.sudoku.sel,'');}
    else if(e.key==='ArrowUp'){e.preventDefault();sudokuMove('up');}
    else if(e.key==='ArrowDown'){e.preventDefault();sudokuMove('down');}
    else if(e.key==='ArrowLeft'){e.preventDefault();sudokuMove('left');}
    else if(e.key==='ArrowRight'){e.preventDefault();sudokuMove('right');}
    else if(e.key.toLowerCase()==='n'){e.preventDefault();S.notesMode=!S.notesMode;render();}
    return;
  }
  if(S.screen==='solo'&&S.game==='wordle'){
    if(/^[a-zA-Z]$/.test(e.key)){e.preventDefault();wKey(e.key.toUpperCase());}
    else if(e.key==='Backspace'){e.preventDefault();wBack();}
    else if(e.key==='Enter'){e.preventDefault();wEnter();}
    return;
  }
  if(S.screen==='solo'&&S.game==='snake'){
    const smap={ArrowUp:[-1,0],ArrowDown:[1,0],ArrowLeft:[0,-1],ArrowRight:[0,1]};
    if(smap[e.key]){e.preventDefault();snakeDir(...smap[e.key]);}
    return;
  }
  if(S.screen==='solo'&&(S.game==='twenty48'||S.game==='snake')){
    const dirs={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down'};
    if(dirs[e.key]){e.preventDefault();move2048(dirs[e.key]);}
  }
});

/* swipe for 2048 (passive:false to allow preventDefault) + long-press flag for minesweeper */
let tx=0,ty=0,lpTimer=null,lpTgt=null;
document.addEventListener('touchstart',e=>{
  tx=e.touches[0].clientX;ty=e.touches[0].clientY;
  if(S.screen==='solo'&&(S.game==='twenty48'||S.game==='snake')){e.preventDefault();}
  if(S.screen==='solo'&&S.game==='minesweeper'){const cell=e.target.closest('[data-action="mine-reveal"]');if(cell){lpTgt=cell;lpTimer=setTimeout(()=>{if(lpTgt){mineFlag(+lpTgt.dataset.r,+lpTgt.dataset.c);lpTgt=null;}},500);}}
},{passive:false});
document.addEventListener('touchmove',e=>{
  if(S.screen==='solo'&&(S.game==='twenty48'||S.game==='snake')){e.preventDefault();}
  clearTimeout(lpTimer);lpTimer=null;lpTgt=null;
},{passive:false});
document.addEventListener('touchend',e=>{
  clearTimeout(lpTimer);lpTimer=null;lpTgt=null;
  if(S.screen==='solo'&&(S.game==='twenty48'||S.game==='snake')){
    const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;
    if(Math.max(Math.abs(dx),Math.abs(dy))>=30){
      const isH=Math.abs(dx)>Math.abs(dy);
      if(S.game==='twenty48'){if(isH)move2048(dx>0?'right':'left');else move2048(dy>0?'down':'up');}
      else{if(isH)snakeDir(0,dx>0?1:-1);else snakeDir(dy>0?1:-1,0);}
    }
  }
},{passive:true});

/* battleship hover preview */
document.addEventListener('mouseover',e=>{if(S.screen==='room'&&S.game==='battleship'){const cell=e.target.closest('[data-action="bt-place"]');updateBattlePrev(cell||null);}});
document.addEventListener('mouseleave',()=>clearBattlePrev(),true);

homeBtn.addEventListener('click',goHome);

/* ════════════════════════════════════════════════════════
   BOOT
════════════════════════════════════════════════════════ */
function boot(){
  const rid=qs('room'),gm=qs('game');
  if(rid&&gm){S.screen='room';S.game=gm;render();joinRoom(rid).catch(e=>setStatus(e.message,false));}
  else{S.screen='home';render();}
  startPolling();
}
boot();
window.addEventListener('visibilitychange',()=>{if(!document.hidden&&S.room)refreshRoom().catch(()=>{});});
</script>
